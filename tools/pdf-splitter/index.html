<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="PDF teilen | Linus Linhof">PDF Splitter | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

    <script src="../../assets/vendor/jszip.min.js"></script>
    <script src="../../assets/vendor/pdf-lib.min.js"></script>
    <script src="../../assets/vendor/FileSaver.min.js"></script>

    <style>
        .mode-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .mode-option {
            position: relative;
            border: 2px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
            background: var(--input-bg);
            display: block;
        }
        .mode-option:hover {
            border-color: var(--ink-secondary);
        }
        .mode-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .mode-option:has(input:checked) {
            border-color: var(--accent);
            background: var(--paper);
        }
        .mode-option:focus-within {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .mode-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--ink);
        }
        .mode-example {
            font-size: 0.8rem;
            color: var(--ink-secondary);
        }
        @media (max-width: 600px) {
            .mode-selector { grid-template-columns: 1fr; gap: 0.5rem; }
            .mode-option { padding: 0.75rem 1rem; }
        }

        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .page-grid-item {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            font-size: 0.85rem;
            transition: border-color 0.15s, background 0.15s;
            background: var(--paper);
        }
        .page-grid-item:hover {
            border-color: var(--accent);
        }
        /* Extract & Each: filled = "keep this page" */
        .page-grid[data-mode="extract"] .page-grid-item.selected,
        .page-grid[data-mode="each"] .page-grid-item.selected {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        /* Split: never filled; a right border marks "cut after this page" */
        .page-grid[data-mode="split"] .page-grid-item.cut-after {
            border-right: 3px solid var(--accent);
            margin-right: 0.25rem;
        }
        .page-grid-item.disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }
        .page-grid-item.disabled:hover {
            border-color: var(--border);
        }

        .page-count-badge {
            display: inline-block;
            background: var(--accent-secondary);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 0.5rem;
            font-weight: 500;
            vertical-align: middle;
        }
        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .field-helper {
            font-size: 0.85rem;
            color: var(--ink-secondary);
            margin-top: 0;
            margin-bottom: 0.5rem;
        }
        .field-summary {
            font-size: 0.85rem;
            color: var(--ink-secondary);
            margin-top: 0.75rem;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1 data-de="PDF teilen">PDF Splitter</h1>
                <p data-de="Seiten als ein PDF herausziehen, ein PDF in Teile schneiden oder jede Seite als eigene Datei speichern. Läuft im Browser, nichts wird hochgeladen.">Pull pages out as one PDF, cut a PDF into parts, or save every page as its own file. Runs in your browser; nothing is uploaded.</p>
            </div>

            <div class="card">

                <div class="mode-selector" role="radiogroup" aria-label="Split mode" data-de-attr="aria-label:Modus">
                    <label class="mode-option">
                        <input type="radio" name="splitMode" value="extract" checked>
                        <div class="mode-title" data-de="Seiten herausziehen">Extract pages</div>
                        <div class="mode-example" data-de="Seiten 3–7 als ein PDF">Pages 3-7 as one PDF</div>
                    </label>
                    <label class="mode-option">
                        <input type="radio" name="splitMode" value="split">
                        <div class="mode-title" data-de="In Teile schneiden">Split into parts</div>
                        <div class="mode-example" data-de="Nach Seite 5 und 12 schneiden, drei PDFs">Cut after 5 and 12, get 3 PDFs</div>
                    </label>
                    <label class="mode-option">
                        <input type="radio" name="splitMode" value="each">
                        <div class="mode-title" data-de="Eine Datei pro Seite">One file per page</div>
                        <div class="mode-example" data-de="Jede Seite wird ein PDF, gepackt">Every page becomes a PDF, zipped</div>
                    </label>
                </div>

                <div class="drop-zone" id="dropZone">
                    <p data-de="PDF hier ablegen">Drop a PDF here</p>
                    <p style="font-size: 0.8rem; opacity: 0.7;" data-de="oder zum Auswählen klicken">or click to browse</p>
                    <input type="file" id="fileInput" class="hidden" accept=".pdf">
                </div>

                <ul class="file-list hidden" id="fileListContainer">
                    <li class="file-item">
                        <div class="file-info">
                            <div>
                                <div style="display: flex; align-items: center;">
                                    <div class="file-name" id="fileName">filename.pdf</div>
                                    <div id="pageCountBadge" class="page-count-badge hidden">0 Pages</div>
                                </div>
                                <div class="file-size" id="fileSize">0 MB</div>
                            </div>
                        </div>
                        <button class="remove-file" id="removeFileBtn" aria-label="Remove file" data-de-attr="aria-label:Datei entfernen">×</button>
                    </li>
                </ul>

                <div id="optionsPanel" class="hidden" style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                    <label for="pageRange" id="pageRangeLabel" data-de="Seiten">Pages</label>
                    <p class="field-helper" id="pageRangeHelper"></p>
                    <input type="text" id="pageRange" placeholder="e.g. 1-5, 8" data-de-attr="placeholder:z. B. 1-5, 8">
                    <div class="page-grid" id="pageGrid" data-mode="extract"></div>
                    <p class="field-summary" id="pageRangeSummary"></p>
                </div>

                <div class="button-group">
                    <button class="button" id="splitBtn" disabled data-de="Seiten herausziehen">Extract pages</button>
                    <button class="button outline" id="resetBtn" data-de="Zurücksetzen">Reset</button>
                </div>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-fill" id="progressBar"></div>
                </div>

                <div class="result-box hidden" id="resultBox">
                    <div style="text-align: center;">
                        <h3 style="margin-bottom: 0.5rem;" data-de="Fertig">Done</h3>
                        <p id="resultMessage">The PDF is ready.</p>

                        <div class="button-group" style="justify-content: center;">
                            <button class="button secondary" id="downloadBtn" data-de="PDF herunterladen">Download PDF</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileListContainer');
        const fileNameDisplay = document.getElementById('fileName');
        const fileSizeDisplay = document.getElementById('fileSize');
        const pageCountBadge = document.getElementById('pageCountBadge');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const optionsPanel = document.getElementById('optionsPanel');
        const pageRangeInput = document.getElementById('pageRange');
        const pageRangeLabel = document.getElementById('pageRangeLabel');
        const pageRangeHelper = document.getElementById('pageRangeHelper');
        const pageRangeSummary = document.getElementById('pageRangeSummary');
        const pageGrid = document.getElementById('pageGrid');
        const modeInputs = document.querySelectorAll('input[name="splitMode"]');

        const splitBtn = document.getElementById('splitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        const resultBox = document.getElementById('resultBox');
        const resultMessage = document.getElementById('resultMessage');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentFile = null;
        let loadedPdfDoc = null;
        let totalPages = 0;
        let outputBlob = null;
        let outputFileName = '';
        let activeWorker = null;

        // Extract and Each share one input value (both mean "which pages").
        // Split keeps its own (cut points, different semantics).
        const modeState = {
            shared: '',
            split: ''
        };
        let currentMode = 'extract';

        const T = (en, de) => (window.LL_I18N ? window.LL_I18N.t(en, de) : en);

        function copy(mode) {
            if (mode === 'extract') return {
                label: T('Pages', 'Seiten'),
                helper: T('Pages to keep, in document order. Click numbers or type a range.',
                         'Seiten, die bleiben, in Dokumentenreihenfolge. Zahlen klicken oder Bereich tippen.'),
                placeholder: T('e.g. 3-7, 10', 'z. B. 3-7, 10'),
                button: T('Extract pages', 'Seiten herausziehen'),
                running: T('Extracting...', 'Ziehe heraus …')
            };
            if (mode === 'split') return {
                label: T('Cut after page', 'Nach Seite schneiden'),
                helper: T('Click a page to cut after it. Each part becomes its own PDF, zipped.',
                         'Seite anklicken, um danach zu schneiden. Jeder Teil wird ein PDF, gepackt.'),
                placeholder: T('e.g. 5, 12', 'z. B. 5, 12'),
                button: T('Split PDF', 'PDF teilen'),
                running: T('Splitting...', 'Teile …')
            };
            return {
                label: T('Pages', 'Seiten'),
                helper: T('Pages to save. Empty means all of them.', 'Seiten, die gespeichert werden. Leer heißt alle.'),
                placeholder: T('All pages', 'Alle Seiten'),
                button: T('Save each page', 'Jede Seite speichern'),
                running: T('Saving...', 'Speichere …')
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupDropZone(dropZone, fileInput, handleFileSelection);
            applyModeCopy();
            modeInputs.forEach(el => el.addEventListener('change', () => switchMode(el.value)));
        });

        function applyModeCopy() {
            const c = copy(currentMode);
            pageRangeLabel.textContent = c.label;
            pageRangeHelper.textContent = c.helper;
            pageRangeInput.setAttribute('placeholder', c.placeholder);
            splitBtn.textContent = c.button;
            pageGrid.dataset.mode = currentMode;
            downloadBtn.textContent = currentMode === 'extract'
                ? T('Download PDF', 'PDF herunterladen')
                : T('Download ZIP', 'ZIP herunterladen');
        }

        function switchMode(newMode) {
            if (newMode === currentMode) return;
            // Save current input under the right key.
            if (currentMode === 'split') modeState.split = pageRangeInput.value;
            else modeState.shared = pageRangeInput.value;

            currentMode = newMode;
            applyModeCopy();

            // Restore the input for the new mode.
            pageRangeInput.value = currentMode === 'split' ? modeState.split : modeState.shared;

            // A previous result no longer matches what is on screen.
            resultBox.classList.add('hidden');
            outputBlob = null;

            if (totalPages > 0) {
                syncGridFromInput();
                updateSummaryAndButton();
            }
        }

        async function handleFileSelection(files) {
            if (files.length === 0) return;

            const file = files[0];
            if (file.type !== 'application/pdf') {
                showToast(T('That is not a PDF.', 'Das ist keine PDF.'), 'error');
                return;
            }

            currentFile = file;
            fileNameDisplay.textContent = file.name;
            fileSizeDisplay.textContent = formatFileSize(file.size);

            dropZone.classList.add('hidden');
            fileListContainer.classList.remove('hidden');
            pageCountBadge.innerHTML = '<div class="loading-spinner"></div> ' + T('Counting pages...', 'Zähle Seiten …');
            pageCountBadge.classList.remove('hidden');

            try {
                const arrayBuffer = await file.arrayBuffer();
                loadedPdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                totalPages = loadedPdfDoc.getPageCount();

                pageCountBadge.textContent = totalPages === 1
                    ? T('1 Page', '1 Seite')
                    : T(`${totalPages} Pages`, `${totalPages} Seiten`);

                renderPageGrid(totalPages);
                optionsPanel.classList.remove('hidden');
                applyModeCopy();
                syncGridFromInput();
                updateSummaryAndButton();

            } catch (err) {
                console.error(err);
                showToast(/encrypted/i.test(err.message)
                    ? T(
                        `"${file.name}" is encrypted. Even when it opens without a password, its contents stay locked, and this tool cannot unlock them. It leaves the file alone rather than make pages nobody can read.`,
                        `„${file.name}“ ist verschlüsselt. Auch wenn es ohne Passwort aufgeht, bleibt der Inhalt gesperrt, und dieses Werkzeug kann ihn nicht entsperren. Es lässt die Datei lieber in Ruhe, statt Seiten zu erzeugen, die niemand lesen kann.`)
                    : T('Could not read this PDF. It may be damaged.', 'Diese PDF ließ sich nicht lesen. Sie könnte beschädigt sein.'),
                    'error');
                pageCountBadge.classList.add('hidden');
                resetTool();
            }
        }

        removeFileBtn.addEventListener('click', () => resetTool());
        resetBtn.addEventListener('click', () => resetTool());

        function resetTool() {
            if (activeWorker) {
                try { activeWorker.terminate(); } catch (e) {}
                activeWorker = null;
            }
            currentFile = null;
            loadedPdfDoc = null;
            totalPages = 0;
            outputBlob = null;
            outputFileName = '';
            modeState.shared = '';
            modeState.split = '';
            fileInput.value = '';
            pageRangeInput.value = '';
            pageGrid.innerHTML = '';

            dropZone.classList.remove('hidden');
            fileListContainer.classList.add('hidden');
            optionsPanel.classList.add('hidden');
            splitBtn.disabled = true;
            splitBtn.textContent = copy(currentMode).button;
            progressContainer.style.display = 'none';
            progressBar.style.width = '0%';
            resultBox.classList.add('hidden');
            pageCountBadge.classList.add('hidden');
            pageRangeSummary.textContent = '';
        }

        function renderPageGrid(maxPages) {
            pageGrid.innerHTML = '';
            const limit = Math.min(maxPages, 1000);
            for (let i = 1; i <= limit; i++) {
                const item = document.createElement('div');
                item.className = 'page-grid-item';
                item.textContent = i;
                item.dataset.page = i;
                item.addEventListener('click', () => onGridClick(item, i));
                pageGrid.appendChild(item);
            }
            if (maxPages > 1000) {
                const msg = document.createElement('div');
                msg.style.gridColumn = '1 / -1';
                msg.style.fontSize = '0.85rem';
                msg.style.color = 'var(--ink-secondary)';
                msg.textContent = T(
                    'Only the first 1000 pages are shown here. Type higher page numbers into the field.',
                    'Nur die ersten 1000 Seiten stehen hier. Höhere Seitenzahlen ins Feld tippen.');
                pageGrid.appendChild(msg);
            }
        }

        function onGridClick(item, pageNum) {
            if (currentMode === 'split') {
                if (pageNum === totalPages) return; // No cut after the last page.
                item.classList.toggle('cut-after');
                updateInputFromGrid();
            } else {
                item.classList.toggle('selected');
                updateInputFromGrid();
            }
            updateSummaryAndButton();
        }

        function updateInputFromGrid() {
            const cls = currentMode === 'split' ? 'cut-after' : 'selected';
            const picked = Array.from(pageGrid.querySelectorAll('.page-grid-item.' + cls))
                                .map(el => parseInt(el.dataset.page))
                                .sort((a, b) => a - b);

            if (picked.length === 0) {
                pageRangeInput.value = '';
                return;
            }

            if (currentMode === 'split') {
                pageRangeInput.value = picked.join(', ');
                return;
            }

            const ranges = [];
            let start = picked[0];
            let end = start;
            for (let i = 1; i < picked.length; i++) {
                if (picked[i] === end + 1) {
                    end = picked[i];
                } else {
                    ranges.push(start === end ? `${start}` : `${start}-${end}`);
                    start = picked[i];
                    end = start;
                }
            }
            ranges.push(start === end ? `${start}` : `${start}-${end}`);
            pageRangeInput.value = ranges.join(', ');
        }

        function syncGridFromInput() {
            if (totalPages === 0) return;
            const items = pageGrid.querySelectorAll('.page-grid-item');
            items.forEach(item => item.classList.remove('selected', 'cut-after', 'disabled'));

            if (currentMode === 'split') {
                const cuts = getCutPoints(pageRangeInput.value, totalPages);
                items.forEach(item => {
                    const p = parseInt(item.dataset.page);
                    if (p === totalPages) item.classList.add('disabled');
                    if (cuts.has(p)) item.classList.add('cut-after');
                });
            } else {
                const picks = getPagesToExtract(pageRangeInput.value, totalPages);
                items.forEach(item => {
                    const p = parseInt(item.dataset.page) - 1;
                    if (picks.has(p)) item.classList.add('selected');
                });
            }
        }

        pageRangeInput.addEventListener('input', () => {
            syncGridFromInput();
            updateSummaryAndButton();
        });

        function updateSummaryAndButton() {
            if (totalPages === 0) {
                pageRangeSummary.textContent = '';
                splitBtn.disabled = true;
                return;
            }

            if (currentMode === 'extract') {
                const picks = getPagesToExtract(pageRangeInput.value, totalPages);
                const n = picks.size;
                if (!pageRangeInput.value.trim()) {
                    pageRangeSummary.textContent = T('Nothing selected', 'Nichts ausgewählt');
                    splitBtn.disabled = true;
                } else if (n === 0) {
                    pageRangeSummary.textContent = T('None of those pages exist', 'Keine dieser Seiten gibt es');
                    splitBtn.disabled = true;
                } else {
                    pageRangeSummary.textContent = n === 1
                        ? T('1 page selected', '1 Seite ausgewählt')
                        : T(`${n} pages selected`, `${n} Seiten ausgewählt`);
                    splitBtn.disabled = false;
                }
                return;
            }

            if (currentMode === 'split') {
                const cuts = getCutPoints(pageRangeInput.value, totalPages);
                if (cuts.size === 0) {
                    pageRangeSummary.textContent = T('Pick at least one cut.', 'Mindestens einen Schnitt setzen.');
                    splitBtn.disabled = true;
                } else {
                    const parts = cutsToParts(Array.from(cuts).sort((a, b) => a - b), totalPages);
                    const partStr = parts.map(p => p.from === p.to ? `${p.from}` : `${p.from}-${p.to}`).join(' · ');
                    pageRangeSummary.textContent = parts.length === 1
                        ? T(`1 part: ${partStr}`, `1 Teil: ${partStr}`)
                        : T(`${parts.length} parts: ${partStr}`, `${parts.length} Teile: ${partStr}`);
                    splitBtn.disabled = false;
                }
                return;
            }

            // each
            const picks = getPagesToExtract(pageRangeInput.value, totalPages);
            const n = picks.size;
            if (!pageRangeInput.value.trim()) {
                pageRangeSummary.textContent = totalPages === 1
                    ? T('All 1 page', 'Alle 1 Seite')
                    : T(`All ${totalPages} pages`, `Alle ${totalPages} Seiten`);
                splitBtn.disabled = false;
            } else if (n === 0) {
                pageRangeSummary.textContent = T('None of those pages exist', 'Keine dieser Seiten gibt es');
                splitBtn.disabled = true;
            } else {
                pageRangeSummary.textContent = n === 1
                    ? T('1 file', '1 Datei')
                    : T(`${n} files`, `${n} Dateien`);
                splitBtn.disabled = false;
            }
        }

        // 1-based numbers in the field, 0-based indices out. Reused by test.js.
        function getPagesToExtract(rangeStr, maxPages) {
            if (!rangeStr.trim()) {
                const pages = new Set();
                for (let i = 0; i < maxPages; i++) pages.add(i);
                return pages;
            }
            const pages = new Set();
            const parts = rangeStr.split(',');
            parts.forEach(part => {
                part = part.trim();
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(n => parseInt(n));
                    if (!isNaN(start) && !isNaN(end)) {
                        const s = Math.min(start, end);
                        const e = Math.max(start, end);
                        for (let i = s; i <= e; i++) {
                            if (i >= 1 && i <= maxPages) pages.add(i - 1);
                        }
                    }
                } else {
                    const page = parseInt(part);
                    if (!isNaN(page) && page >= 1 && page <= maxPages) {
                        pages.add(page - 1);
                    }
                }
            });
            return pages;
        }

        // "Cut after N" values, 1-based. Anything <1, >=totalPages, or unreadable is dropped.
        // Reused by test.js.
        function getCutPoints(str, totalPages) {
            const out = new Set();
            if (!str.trim()) return out;
            str.split(',').forEach(raw => {
                const n = parseInt(raw.trim());
                if (!isNaN(n) && n >= 1 && n < totalPages) out.add(n);
            });
            return out;
        }

        // sortedCuts (1-based, <totalPages) -> [{from, to}, ...] parts (1-based, inclusive).
        // Reused by test.js.
        function cutsToParts(sortedCuts, totalPages) {
            const parts = [];
            let start = 1;
            for (const cut of sortedCuts) {
                parts.push({ from: start, to: cut });
                start = cut + 1;
            }
            parts.push({ from: start, to: totalPages });
            return parts;
        }

        splitBtn.addEventListener('click', async () => {
            if (!currentFile || activeWorker) return;

            try {
                const c = copy(currentMode);
                splitBtn.disabled = true;
                splitBtn.textContent = c.running;
                progressContainer.style.display = 'block';
                progressBar.style.width = '5%';

                const fileBuffer = await currentFile.arrayBuffer();
                const worker = new Worker('worker.js');
                activeWorker = worker;

                const cleanup = () => {
                    splitBtn.textContent = copy(currentMode).button;
                    progressContainer.style.display = 'none';
                    if (activeWorker === worker) activeWorker = null;
                    updateSummaryAndButton();
                    try { worker.terminate(); } catch (e) {}
                };

                worker.onmessage = (e) => {
                    const data = e.data;
                    if (data.type === 'progress') {
                        progressBar.style.width = `${data.percentage}%`;
                    } else if (data.type === 'done') {
                        outputBlob = data.outputBlob;
                        outputFileName = data.outputFileName;
                        progressBar.style.width = '100%';
                        resultMessage.textContent = data.doneMessage;
                        downloadBtn.textContent = currentMode === 'extract'
                            ? T('Download PDF', 'PDF herunterladen')
                            : T('Download ZIP', 'ZIP herunterladen');
                        resultBox.classList.remove('hidden');
                        showToast(T('Done.', 'Fertig.'), 'success');
                        cleanup();
                    } else if (data.type === 'error') {
                        console.error(data.message);
                        showToast(T('Could not process: ', 'Ging nicht: ') + data.message, 'error');
                        cleanup();
                    }
                };

                worker.onerror = (err) => {
                    console.error(err);
                    showToast(T('The job stopped with an error.', 'Der Vorgang endete mit einem Fehler.'), 'error');
                    cleanup();
                };

                const baseName = currentFile.name.replace(/\.pdf$/i, '');

                if (currentMode === 'extract') {
                    const indices = Array.from(getPagesToExtract(pageRangeInput.value, totalPages))
                                         .sort((a, b) => a - b);
                    if (indices.length === 0) throw new Error(T('None of those pages exist in this PDF.',
                                                               'Keine dieser Seiten gibt es in dieser PDF.'));
                    worker.postMessage({
                        action: 'extract',
                        fileBuffer,
                        indices,
                        outputFileName: `${baseName}_extract.pdf`,
                        doneMessage: indices.length === 1
                            ? T('1 page saved as one PDF.', '1 Seite als ein PDF gespeichert.')
                            : T(`${indices.length} pages saved as one PDF.`, `${indices.length} Seiten als ein PDF gespeichert.`)
                    }, [fileBuffer]);
                } else if (currentMode === 'split') {
                    const cuts = Array.from(getCutPoints(pageRangeInput.value, totalPages)).sort((a, b) => a - b);
                    if (cuts.length === 0) throw new Error(T('Pick at least one cut.',
                                                             'Mindestens einen Schnitt setzen.'));
                    const parts = cutsToParts(cuts, totalPages);
                    worker.postMessage({
                        action: 'split',
                        fileBuffer,
                        parts,
                        baseName,
                        outputFileName: `${baseName}_split.zip`,
                        doneMessage: parts.length === 1
                            ? T('Split into 1 part.', 'In 1 Teil geteilt.')
                            : T(`Split into ${parts.length} parts.`, `In ${parts.length} Teile geteilt.`)
                    }, [fileBuffer]);
                } else {
                    const indices = Array.from(getPagesToExtract(pageRangeInput.value, totalPages))
                                         .sort((a, b) => a - b);
                    if (indices.length === 0) throw new Error(T('None of those pages exist in this PDF.',
                                                               'Keine dieser Seiten gibt es in dieser PDF.'));
                    worker.postMessage({
                        action: 'each',
                        fileBuffer,
                        indices,
                        totalPages,
                        baseName,
                        outputFileName: `${baseName}_pages.zip`,
                        doneMessage: indices.length === 1
                            ? T('1 page saved, one file.', '1 Seite gespeichert, eine Datei.')
                            : T(`${indices.length} pages saved, one file each.`, `${indices.length} Seiten gespeichert, je eine Datei.`)
                    }, [fileBuffer]);
                }

            } catch (error) {
                console.error(error);
                showToast(error.message, 'error');
                splitBtn.textContent = copy(currentMode).button;
                splitBtn.disabled = false;
                progressContainer.style.display = 'none';
                if (activeWorker) {
                    try { activeWorker.terminate(); } catch (e) {}
                    activeWorker = null;
                }
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (outputBlob && outputFileName) {
                saveAs(outputBlob, outputFileName);
            }
        });

    /* Is this tool holding something right now that a reload would throw
       away? Asked when someone clicks "Reload" in the update notice
       (assets/js/layout.js). tests/test-holds-work.js insists that every
       tool with a file input answers. */
    window.llHoldsWork = () => !!currentFile || !!outputBlob;
    </script>
</body>
</html>
