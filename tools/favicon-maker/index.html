<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="Favicon-Generator | Linus Linhof">Favicon Generator | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <!-- draw() swaps this for the icon being made, so the tab shows it at real size. -->
    <link rel="icon" type="image/png" href="../../assets/favicon.svg" id="dynamic-favicon">
    
    <style>
        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: repeating-linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0),
                        repeating-linear-gradient(45deg, #f0f0f0 25%, #faf6f2 25%, #faf6f2 75%, #f0f0f0 75%, #f0f0f0);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            padding: 3rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        
        canvas {
            max-width: 128px;
            max-height: 128px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        canvas:hover {
            transform: scale(1.1);
        }

        .color-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
        }
        
        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; }

        .tab-preview-hint {
            text-align: center;
            font-size: 0.85rem;
            color: var(--accent);
            margin-top: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1 data-de="Favicon-Generator">Favicon Generator</h1>
                <p><span data-de="Erzeugt ein Favicon aus einem Buchstaben, Emoji oder Bild, als PNG, ICO oder als vollständiges Set mit Web-Manifest.">Makes a favicon from a letter, an emoji or an image, as PNG, ICO or a full set with a web manifest.</span><br><span data-de="Das Icon im Browser-Tab ändert sich mit.">The icon in this browser tab changes as you edit.</span></p>
            </div>

            <div class="split-view">

                <div class="card">

                    <div class="button-group" style="margin-bottom: 1.5rem;">
                        <button class="button active" id="modeText" onclick="setMode('text')" data-de="Text / Emoji">Text / Emoji</button>
                        <button class="button outline" id="modeImage" onclick="setMode('image')" data-de="Bild">Image</button>
                    </div>

                    <div id="textControls">
                        <label data-de="Text oder Emoji (bis zu 2 Zeichen)">Text or Emoji (up to 2 characters)</label>
                        <input type="text" id="inputText" value="L" maxlength="2" style="font-size: 1.5rem; text-align: center;">

                        <div class="split-view" style="margin-bottom: 0;">
                            <div>
                                <label data-de="Schriftgröße">Font Size</label>
                                <input type="range" id="fontSize" min="50" max="450" value="300">
                            </div>
                            <div>
                                <label data-de="Schriftart">Font Family</label>
                                <select id="fontFamily" data-save>
                                    <option value="sans-serif" data-de="Serifenlos">Sans Serif</option>
                                    <option value="serif" data-de="Serif">Serif</option>
                                    <option value="monospace" data-de="Monospace">Monospace</option>
                                    <option value="cursive" data-de="Schreibschrift">Cursive</option>
                                    <option value="Arial">Arial</option>
                                    <option value="Verdana">Verdana</option>
                                    <option value="Times New Roman">Times New Roman</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="imageControls" class="hidden">
                        <div class="drop-zone" id="dropZone" style="padding: 1.5rem; min-height: 120px;">
                            <p style="margin: 0.5rem 0;" data-de="Bild hier ablegen">Drop an image here</p>
                            <input type="file" id="fileInput" class="hidden" accept="image/*">
                        </div>
                        <div style="margin-top: 1rem;">
                            <label data-de="Bildgröße">Image Scale</label>
                            <input type="range" id="imgScale" min="10" max="100" value="70">
                        </div>
                        <div style="margin-top: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                            <input type="checkbox" id="autoRemoveBg" style="width: auto;">
                            <label for="autoRemoveBg" style="margin: 0; cursor: pointer;" data-de="Einfarbigen Hintergrund entfernen">Remove a plain background</label>
                        </div>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border); margin: 1.5rem 0;">

                    <div class="split-view">
                        <div>
                            <label data-de="Form / Hintergrund">Shape / Background</label>
                            <select id="shapeSelect" data-save>
                                <option value="rounded" data-de="Abgerundetes Quadrat">Rounded Square</option>
                                <option value="circle" data-de="Kreis">Circle</option>
                                <option value="square" data-de="Quadrat">Square</option>
                                <option value="none" data-de="Transparent (kein Hintergrund)">Transparent (No Background)</option>
                            </select>
                        </div>
                        <div>
                            <label data-de="Farben">Colors</label>
                            <div class="color-input-group" id="bgColorGroup">
                                <input type="color" id="bgColor" value="#2a2621" title="Background Color" data-de-attr="title:Hintergrundfarbe">
                                <span style="font-size: 0.8rem;" data-de="Hintergrund">Background</span>
                            </div>
                            <div class="color-input-group" id="fgColorGroup">
                                <input type="color" id="fgColor" value="#faf6f2" title="Text Color" data-de-attr="title:Textfarbe">
                                <span style="font-size: 0.8rem;" data-de="Textfarbe">Text Color</span>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="card" style="display: flex; flex-direction: column;">
                    <label data-de="Vorschau (512 px)">Preview (512 px)</label>

                    <div class="preview-area">
                        <canvas id="previewCanvas" width="512" height="512"></canvas>
                    </div>

                    <div class="tab-preview-hint" data-de="Der Tab oben in diesem Fenster zeigt es in Originalgröße.">
                        The tab at the top of this window shows it at real size.
                    </div>

                    <div style="margin-top: auto;">
                        <div class="button-group" style="justify-content: center;">
                            <button class="button" id="downloadPng" data-de="PNG herunterladen">Download PNG</button>
                            <button class="button secondary" id="downloadIco" data-de="ICO herunterladen">Download ICO</button>
                        </div>
                        <div class="button-group" style="justify-content: center; margin-top: 0.5rem;">
                            <button class="button outline" id="downloadZip" style="width: 100%;">Download Full Set (ZIP)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script src="../../assets/vendor/jszip.min.js"></script>
    
    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        const inputText = document.getElementById('inputText');
        const fontSize = document.getElementById('fontSize');
        const fontFamily = document.getElementById('fontFamily');
        const shapeSelect = document.getElementById('shapeSelect');
        const bgColor = document.getElementById('bgColor');
        const bgColorGroup = document.getElementById('bgColorGroup');
        const fgColor = document.getElementById('fgColor');
        const fgColorGroup = document.getElementById('fgColorGroup');

        const modeTextBtn = document.getElementById('modeText');
        const modeImageBtn = document.getElementById('modeImage');
        const textControls = document.getElementById('textControls');
        const imageControls = document.getElementById('imageControls');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const imgScale = document.getElementById('imgScale');
        const autoRemoveBg = document.getElementById('autoRemoveBg');

        const downloadPng = document.getElementById('downloadPng');
        const downloadIco = document.getElementById('downloadIco');
        const downloadZip = document.getElementById('downloadZip');
        const tabIcon = document.getElementById('dynamic-favicon');

        let currentMode = 'text';
        let uploadedImage = null;
        let originalUploadedImageSrc = null;
        const bgWorker = new Worker('bg-worker.js');

        bgWorker.onmessage = (e) => {
            if (e.data.action === 'removeBackground' && e.data.success) {
                const processedImageData = e.data.imageData;
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = processedImageData.width;
                tempCanvas.height = processedImageData.height;
                tempCanvas.getContext('2d').putImageData(processedImageData, 0, 0);

                uploadedImage = new Image();
                uploadedImage.onload = () => {
                    draw();
                };
                uploadedImage.src = tempCanvas.toDataURL();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateUIForShape();
            draw();
            setupDropZone(dropZone, fileInput, handleFile);
        });

        [inputText, fontSize, fontFamily, bgColor, fgColor, imgScale].forEach(el => {
            el.addEventListener('input', draw);
            el.addEventListener('change', draw);
        });

        autoRemoveBg.addEventListener('change', () => {
            if (originalUploadedImageSrc) {
                processUploadedImage(originalUploadedImageSrc);
            }
        });

        // A transparent shape has no background colour to choose.
        shapeSelect.addEventListener('change', () => {
            updateUIForShape();
            draw();
        });

        function updateUIForShape() {
            if (shapeSelect.value === 'none') {
                bgColorGroup.classList.add('hidden');
            } else {
                bgColorGroup.classList.remove('hidden');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            if (mode === 'text') {
                modeTextBtn.classList.remove('outline');
                modeTextBtn.classList.add('active');
                modeImageBtn.classList.add('outline');
                textControls.classList.remove('hidden');
                imageControls.classList.add('hidden');
                fgColorGroup.classList.remove('hidden');
            } else {
                modeImageBtn.classList.remove('outline');
                modeImageBtn.classList.add('active');
                modeTextBtn.classList.add('outline');
                textControls.classList.add('hidden');
                imageControls.classList.remove('hidden');
                fgColorGroup.classList.add('hidden');
            }
            draw();
        }

        function handleFile(files) {
            if (files.length === 0) return;
            const file = files[0];
            const reader = new FileReader();

            if (file.type === 'image/svg+xml') {
                reader.onload = (e) => {
                    let svgContent = e.target.result;
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(svgContent, "image/svg+xml");
                    const svg = doc.querySelector('svg');

                    if (svg) {
                        if (!svg.hasAttribute('width')) svg.setAttribute('width', '512');
                        if (!svg.hasAttribute('height')) svg.setAttribute('height', '512');
                        const serializer = new XMLSerializer();
                        svgContent = serializer.serializeToString(svg);
                    }

                    const blob = new Blob([svgContent], {type: 'image/svg+xml;charset=utf-8'});
                    const url = URL.createObjectURL(blob);

                    originalUploadedImageSrc = url;
                    processUploadedImage(url);
                };
                reader.readAsText(file);
            } else {
                reader.onload = (e) => {
                    originalUploadedImageSrc = e.target.result;
                    processUploadedImage(e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function processUploadedImage(src) {
            const tempImg = new Image();
            tempImg.onload = () => {
                if (autoRemoveBg.checked) {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = tempImg.width;
                    tempCanvas.height = tempImg.height;
                    const tCtx = tempCanvas.getContext('2d');
                    tCtx.drawImage(tempImg, 0, 0);

                    const imageData = tCtx.getImageData(0, 0, tempImg.width, tempImg.height);
                    bgWorker.postMessage({
                        action: 'removeBackground',
                        imageData: imageData,
                        width: tempImg.width,
                        height: tempImg.height,
                        tolerance: 40
                    });
                } else {
                    uploadedImage = tempImg;
                    draw();
                }
            };
            tempImg.src = src;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const size = canvas.width;

            const shape = shapeSelect.value;
            ctx.fillStyle = bgColor.value;

            if (shape === 'square') {
                ctx.fillRect(0, 0, size, size);
            } else if (shape === 'circle') {
                ctx.beginPath();
                ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
                ctx.fill();
            } else if (shape === 'rounded') {
                const r = size * 0.2; // 20% radius
                ctx.beginPath();
                ctx.moveTo(r, 0);
                ctx.lineTo(size - r, 0);
                ctx.quadraticCurveTo(size, 0, size, r);
                ctx.lineTo(size, size - r);
                ctx.quadraticCurveTo(size, size, size - r, size);
                ctx.lineTo(r, size);
                ctx.quadraticCurveTo(0, size, 0, size - r);
                ctx.lineTo(0, r);
                ctx.quadraticCurveTo(0, 0, r, 0);
                ctx.closePath();
                ctx.fill();
            }
            // 'none' leaves the canvas transparent.

            if (currentMode === 'text') {
                const text = inputText.value;
                const fSize = fontSize.value;
                const family = fontFamily.value;
                
                ctx.fillStyle = fgColor.value;
                ctx.font = `${fSize}px ${family}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Baseline 'middle' sits a little high for most letters and emoji.
                const yOffset = size / 2 + (fSize * 0.05); 
                ctx.fillText(text, size / 2, yOffset);
            } 
            else if (currentMode === 'image' && uploadedImage) {
                const scale = imgScale.value / 100;
                const drawSize = size * scale;
                
                // Centre square of the image.
                const srcSize = Math.min(uploadedImage.width, uploadedImage.height);
                const srcX = (uploadedImage.width - srcSize) / 2;
                const srcY = (uploadedImage.height - srcSize) / 2;

                const x = (size - drawSize) / 2;
                const y = (size - drawSize) / 2;
                
                // Not clipped to the shape: the image sits on top of the background.
                ctx.save();
                ctx.drawImage(uploadedImage, srcX, srcY, srcSize, srcSize, x, y, drawSize, drawSize);
                ctx.restore();
            }

            updateTabIcon();
        }

        function updateTabIcon() {
            const dataUrl = canvas.toDataURL('image/png');
            tabIcon.href = dataUrl;
        }

        downloadPng.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'favicon.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('PNG Downloaded', 'success');
        });

        downloadIco.addEventListener('click', () => {
            try {
                const icoBlob = generateIco(canvas);
                
                const link = document.createElement('a');
                link.download = 'favicon.ico';
                link.href = URL.createObjectURL(icoBlob);
                link.click();
                showToast('ICO Downloaded', 'success');
            } catch(e) {
                console.error(e);
                showToast('Could not build the ICO file.', 'error');
            }
        });

        downloadZip.addEventListener('click', async () => {
            if (typeof JSZip === 'undefined') {
                showToast('Zip library not loaded yet.', 'error');
                return;
            }

            try {
                downloadZip.disabled = true;
                downloadZip.textContent = 'Generating...';

                const zip = new JSZip();

                const sizes = {
                    'apple-touch-icon.png': 180,
                    'favicon-32x32.png': 32,
                    'favicon-16x16.png': 16,
                    'android-chrome-192x192.png': 192,
                    'android-chrome-512x512.png': 512
                };

                const resizeCanvas = document.createElement('canvas');
                const rCtx = resizeCanvas.getContext('2d');

                for (const [filename, size] of Object.entries(sizes)) {
                    resizeCanvas.width = size;
                    resizeCanvas.height = size;
                    rCtx.clearRect(0, 0, size, size);
                    rCtx.drawImage(canvas, 0, 0, size, size);

                    const dataUrl = resizeCanvas.toDataURL('image/png');
                    const base64Data = dataUrl.split(',')[1];
                    zip.file(filename, base64Data, {base64: true});
                }

                const icoBlob = generateIco(canvas);
                zip.file('favicon.ico', icoBlob);

                const manifest = {
                    "name": "My Web App",
                    "short_name": "App",
                    "icons": [
                        {
                            "src": "/android-chrome-192x192.png",
                            "sizes": "192x192",
                            "type": "image/png"
                        },
                        {
                            "src": "/android-chrome-512x512.png",
                            "sizes": "512x512",
                            "type": "image/png"
                        }
                    ],
                    "theme_color": bgColor.value,
                    "background_color": bgColor.value,
                    "display": "standalone",
                    "start_url": "/"
                };
                const manifestJsonStr = JSON.stringify(manifest, null, 2);
                zip.file('site.webmanifest', manifestJsonStr);
                zip.file('manifest.json', manifestJsonStr);

                const content = await zip.generateAsync({type: 'blob'});
                const link = document.createElement('a');
                link.download = 'favicon_set.zip';
                link.href = URL.createObjectURL(content);
                link.click();

                showToast('ZIP Downloaded', 'success');
            } catch(e) {
                console.error(e);
                showToast('Could not build the ZIP file.', 'error');
            } finally {
                downloadZip.disabled = false;
                downloadZip.textContent = 'Download Full Set (ZIP)';
            }
        });

        // An ICO file holding one PNG.
        function generateIco(sourceCanvas) {
            // 256 is the largest size an ICO directory entry can state.
            const icoCanvas = document.createElement('canvas');
            icoCanvas.width = 256;
            icoCanvas.height = 256;
            const ictx = icoCanvas.getContext('2d');
            ictx.drawImage(sourceCanvas, 0, 0, 256, 256);

            const dataUrl = icoCanvas.toDataURL('image/png');
            const byteString = atob(dataUrl.split(',')[1]);
            const pngBuffer = new Uint8Array(byteString.length);
            for (let i = 0; i < byteString.length; i++) {
                pngBuffer[i] = byteString.charCodeAt(i);
            }

            const imageSize = pngBuffer.length;
            const width = 0; // 0 means 256px in ICO format
            const height = 0;
            const numColors = 0; 
            const reserved = 0;
            const planes = 1;
            const bpp = 32; 
            const imageOffset = 22; // 6 (header) + 16 (entry)

            // ICO Header (6 bytes)
            const header = new Uint8Array([
                0, 0, 1, 0, 1, 0
            ]);

            // ICO Directory Entry (16 bytes)
            const entry = new Uint8Array([
                width, height, numColors, reserved,
                1, 0, 32, 0,
                imageSize & 0xFF, (imageSize >> 8) & 0xFF, (imageSize >> 16) & 0xFF, (imageSize >> 24) & 0xFF,
                imageOffset, 0, 0, 0
            ]);

            const icoFile = new Uint8Array(header.length + entry.length + pngBuffer.length);
            icoFile.set(header, 0);
            icoFile.set(entry, header.length);
            icoFile.set(pngBuffer, header.length + entry.length);

            return new Blob([icoFile], { type: 'image/x-icon' });
        }

        // The mode buttons call it from inline onclick.
        window.setMode = setMode;
    
    /* Is this tool holding something right now that a reload would throw
       away? The question is asked when someone clicks "Reload" in the
       update notice (assets/js/layout.js). A tool that stays quiet counts
       as empty. tests/test-holds-work.js insists that every tool with a
       file input speaks up. */
    window.llHoldsWork = () => !!uploadedImage;
    </script>
</body>
</html>
