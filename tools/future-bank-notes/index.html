<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro-Banknoten Entwürfe Vergleich | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <style>
        /* Premium UI styling */
        :root {
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --shadow-premium: 0 10px 25px rgba(0, 0, 0, 0.08), 0 3px 10px rgba(0, 0, 0, 0.04);
            --transition-smooth: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body.dark-mode {
            --shadow-premium: 0 15px 35px rgba(0, 0, 0, 0.3), 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .intro-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 800px;
            margin: 0 auto 2.5rem;
        }

        .badge-premium {
            background: var(--gold-gradient);
            color: #2a2621;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-family: var(--font-heading);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(179, 135, 40, 0.25);
            display: inline-block;
        }

        /* Responsive Dashboard controls */
        .controls-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: var(--shadow-premium);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .control-group label {
            margin-bottom: 0;
            font-size: 0.95rem;
            color: var(--ink);
        }

        .selector-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .selector-btn {
            padding: 0.5rem 1.25rem;
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--border);
            font-family: var(--font-heading);
            font-weight: 500;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .selector-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .selector-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Grid Comparison Layout */
        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
            width: 100%;
        }

        /* Adjust columns for mobile */
        @media (max-width: 960px) {
            .compare-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        .compare-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: var(--shadow-premium);
            transition: var(--transition-smooth);
        }

        .compare-card:hover {
            border-color: var(--accent);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0;
            color: var(--ink);
        }

        .card-designer {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            color: var(--ink-secondary);
            font-weight: 500;
        }

        .card-orientation-badge {
            font-size: 0.75rem;
            background: var(--paper);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-weight: 500;
        }

        /* ─── UNSQUASHED BANKNOTE ROW ─── */
        .previews-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            margin: 1rem 0;
            width: 100%;
        }

        .banknote-img-wrapper {
            height: 180px; /* Uniform height */
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: #ffffff;
            transition: transform 0.25s ease;
            cursor: zoom-in;
            overflow: hidden;
            position: relative;
        }

        .banknote-img-wrapper:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .banknote-img-wrapper img {
            height: 100%;
            width: auto;
            object-fit: contain;
            display: block;
        }

        /* Label for Front/Back */
        .img-label {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 2px;
            font-family: var(--font-heading);
            font-weight: 500;
            pointer-events: none;
        }

        /* Optimize for mobile */
        @media (max-width: 600px) {
            .banknote-img-wrapper {
                height: 130px; /* Scaled down slightly on medium screens */
            }
            .compare-card {
                padding: 1.25rem 1rem;
            }
        }

        @media (max-width: 400px) {
            .banknote-img-wrapper {
                height: 100px; /* Scaled down more for narrow screens to fit side-by-side */
            }
            .previews-row {
                gap: 0.5rem;
            }
        }

        .concept-text {
            font-size: 0.9rem;
            line-height: 1.6;
            text-align: justify;
            color: var(--ink-secondary);
            margin-bottom: 0;
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
        }

        /* Lightbox Zoom Overlay */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }

        .lightbox-content {
            max-width: 92%;
            max-height: 92%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <!-- 1. HEADER SECTION -->
            <div class="intro-container">
                <span class="badge-premium">Euro-Designvergleich</span>
                <h1>Euro-Banknoten Vergleich</h1>
                <p>Vergleichen Sie alle 10 Designvorschläge der neuen Euro-Scheine direkt nebeneinander. Optimiert für alle Bildschirmgrößen und ohne Verzerrungen.</p>
            </div>

            <!-- 2. CONTROLS PANEL -->
            <div class="controls-card">
                <!-- Denomination Select -->
                <div class="control-group">
                    <label>Wertstufe wählen (Stückelung):</label>
                    <div class="selector-row" id="denom-row">
                        <button class="selector-btn active" data-val="5">5 €</button>
                        <button class="selector-btn" data-val="10">10 €</button>
                        <button class="selector-btn" data-val="20">20 €</button>
                        <button class="selector-btn" data-val="50">50 €</button>
                        <button class="selector-btn" data-val="100">100 €</button>
                        <button class="selector-btn" data-val="200">200 €</button>
                    </div>
                </div>

                <!-- Side Select -->
                <div class="control-group">
                    <label>Sichtbare Seiten:</label>
                    <div class="selector-row" id="side-row">
                        <button class="selector-btn active" data-val="both">Vorder- & Rückseite</button>
                        <button class="selector-btn" data-val="front">Nur Vorderseite</button>
                        <button class="selector-btn" data-val="back">Nur Rückseite</button>
                    </div>
                </div>
            </div>

            <!-- 3. MAIN COMPARISON GRID -->
            <div class="compare-grid" id="compare-grid">
                <!-- JS will populate cards dynamically -->
            </div>
        </div>
    </main>

    <!-- Lightbox Zoom Overlay -->
    <div class="lightbox-overlay" id="lightbox">
        <img class="lightbox-content" id="lightbox-img" src="" alt="Zoomierte Ansicht">
    </div>

    <script src="../../assets/js/layout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Proposals database
            const proposals = [
                {
                    "id": "proposalA",
                    "letter": "a",
                    "title": "Design A",
                    "designer": "Studio Joost Grootens",
                    "orientation": "Querformat",
                    "desc": "Das Design lässt sich als Reflexion darüber erklären, wie Kultur entsteht. Die Augen stehen für Beobachtung, Wahrnehmung und Reflexion, während der Mund Ausdruck, Dialog und Austausch symbolisiert. Durch die Hervorhebung dieser Elemente gehen die Porträts über die individuelle Identität hinaus und verweisen auf eine gemeinsame menschliche Fähigkeit zum kulturellen Schaffen. Auf der Rückseite zeigen zeitgenössische Kulturräume, wie Menschen unterschiedlicher Herkunft und unterschiedlichen Alters zusammenkommen und interagieren."
                },
                {
                    "id": "proposalB",
                    "letter": "b",
                    "title": "Design B",
                    "designer": "PunktFormStrich",
                    "orientation": "Querformat",
                    "desc": "Die Banknotenserie „Flüsse und Vögel“ vermittelt ihr Konzept durch einen direkten Zusammenhang zwischen visuellen Elementen und ihrer Bedeutung. Jede Banknote zeigt eine bestimmte Vogelart in Bezug zu ihrem Lebensraum und verbindet biologische Vielfalt mit europäischen Landschaften. Horizontale Balkenstrukturen übertragen den charakteristischen Ruf jedes Vogels in eine visuelle Form, während eine vertikale Skala dessen Fluggeschwindigkeit anzeigt."
                },
                {
                    "id": "proposalC",
                    "letter": "c",
                    "title": "Design C",
                    "designer": "Neue Gestaltung GmbH",
                    "orientation": "Querformat",
                    "desc": "Das Design erzählt eine einfache Geschichte: Europa ist ein gemeinsamer Kulturraum. Jede Banknote ist aufgrund ihrer dominierenden Farbe und seines eigenen zentralen Motivs sofort erkennbar; jede zeigt eine Persönlichkeit, deren Leben und Werk die Europäer über Jahrhunderte hinweg miteinander verbinden. Die Rückseite vereint eine Landkarte Europas mit einer aktuellen Szene des Kulturraums, den die Banknote abbildet."
                },
                {
                    "id": "proposalD",
                    "letter": "d",
                    "title": "Design D",
                    "designer": "Rudy Guedj & François Girard-Meunier",
                    "orientation": "Hochformat",
                    "desc": "Sechs Vögel sind in abstrakten Landschaften zu sehen, die mit der stetigen Reise eines Flusses verbunden sind, von einer Bergquelle hin zu einem stürmischen Meer. Licht begleitet diesen Verlauf und entfaltet sich von einer sanften Präsenz zu einer dynamischen, durchdringenden Kraft. Auf der Rückseite werden die EU-Institutionen durch Handgesten und ein sich wandelndes, stoffartiges Geflecht dargestellt."
                },
                {
                    "id": "proposalE",
                    "letter": "e",
                    "title": "Design E",
                    "designer": "Myrsini Vardopoulou",
                    "orientation": "Querformat",
                    "desc": "Der kommunikative Ansatz stellt den universellen Wert des Wirkens der jeweiligen Person in den Vordergrund und nicht ihre Persönlichkeit. Der Kreis und die Symbole fungieren als visuelle Botschaft, die für einen intellektuellen Raum steht. Dieser Raum vermittelt dem Betrachter eine unmittelbare visuelle Vertrautheit. Gleichzeitig verweisen symbolische Details subtil auf eine tiefergehende konzeptionelle Interpretation."
                },
                {
                    "id": "proposalF",
                    "letter": "f",
                    "title": "Design F",
                    "designer": "Jan Robert Dünnweller",
                    "orientation": "Querformat",
                    "desc": "Das Design soll das offizielle Motto der EU – „In Vielfalt geeint“ – veranschaulichen. Europa ist durch eine reiche gemeinsame Kulturgeschichte und ein kulturelles Erbe vereint, die durch die Porträts ikonischer europäischer Persönlichkeiten dargestellt werden. Diese Vielfalt wird in einer Collage aus zahlreichen Formen und Oberflächenstrukturen visualisiert."
                },
                {
                    "id": "proposalG",
                    "letter": "g",
                    "title": "Design G",
                    "designer": "Rubio & del Amo & Cruz más Cruz",
                    "orientation": "Hochformat",
                    "desc": "Ein einnehmender Blick trifft den Betrachter aus der Mitte der Banknote. In ihr verdichten sich ein Vorschlag, eine Idee und ein Dialog zwischen denjenigen Menschen, die unsere kulturelle Identität geformt haben, und denjenigen von uns, die Europa zu einem Ort von Vordenkern machen. Wenn wir die Banknoten horizontal drehen, erkennen wir vier Blöcke (E, U, R, O)."
                },
                {
                    "id": "proposalH",
                    "letter": "h",
                    "title": "Design H",
                    "designer": "Atelier Goppel-Toperngpong",
                    "orientation": "Querformat",
                    "desc": "Wasser fließt. Es bildet die Grundlage allen Lebens, prägt unsere Umwelt und schafft die Lebensräume für die vielfältige Vogelwelt Europas, die auf den Banknoten abgebildet ist. Darüber hinaus kann Wasser viele Eigenschaften annehmen, wie etwa Ausgeglichenheit oder Beständigkeit. In diesem Sinne ist Wasser eine treffende Analogie für die EU."
                },
                {
                    "id": "proposalI",
                    "letter": "i",
                    "title": "Design I",
                    "designer": "Isabelle Daëron",
                    "orientation": "Hochformat",
                    "desc": "Vom Flügelschlag eines Vogels bis zum Strom der Flüsse – Bewegung steht im Mittelpunkt dieses Entwurfs. Sie soll sowohl die Dynamik der EU als auch die materiellen und immateriellen Ströme verkörpern, die ihr Gebiet durchziehen. Der Vogel symbolisiert das Zwiegespräch und die gegenseitige Abhängigkeit zwischen unseren Gesellschaften und der Natur."
                },
                {
                    "id": "proposalJ",
                    "letter": "j",
                    "title": "Design J",
                    "designer": "Ville Tietäväinen",
                    "orientation": "Hochformat",
                    "desc": "Diese Euro-Banknotenserie erzählt eine visuelle Geschichte der europäischen Flüsse, von ihrer Quelle in den Bergen bis zu ihrer Mündung ins Meer. Die Hauptdarsteller sind die europäischen Vögel in ihren natürlichen Lebensräumen. Selbst die EU-Gebäude auf der Rückseite verschmelzen mit dem Flügel des jeweiligen Vogels."
                }
            ];

            // State variables
            let currentDenom = 5;
            let currentSideMode = "both"; // both, front, back

            // DOM elements
            const compareGrid = document.getElementById('compare-grid');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');

            // === 1. INITIALIZATION ===
            renderGrid();

            // === 2. EVENT LISTENERS ===
            document.querySelectorAll('#denom-row .selector-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#denom-row .selector-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentDenom = parseInt(e.target.getAttribute('data-val'));
                    renderGrid();
                });
            });

            document.querySelectorAll('#side-row .selector-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#side-row .selector-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentSideMode = e.target.getAttribute('data-val');
                    renderGrid();
                });
            });

            lightbox.addEventListener('click', () => {
                lightbox.style.display = 'none';
            });

            // === 3. RENDER FUNCTION ===
            function renderGrid() {
                compareGrid.innerHTML = '';

                proposals.forEach(prop => {
                    const card = document.createElement('div');
                    card.className = 'compare-card';

                    // Generate images markup
                    let imagesHtml = '';
                    const frontImgPath = `./images/banknote-design-proposal-${prop.letter}-${currentDenom}-front.jpg`;
                    const backImgPath = `./images/banknote-design-proposal-${prop.letter}-${currentDenom}-back.jpg`;

                    if (currentSideMode === 'both' || currentSideMode === 'front') {
                        imagesHtml += `
                            <div class="banknote-img-wrapper" data-src="${frontImgPath}" title="Klicken zum Vergrößern">
                                <img src="${frontImgPath}" alt="${prop.title} ${currentDenom}€ Vorderseite">
                                <span class="img-label">Vorderseite</span>
                            </div>
                        `;
                    }
                    if (currentSideMode === 'both' || currentSideMode === 'back') {
                        imagesHtml += `
                            <div class="banknote-img-wrapper" data-src="${backImgPath}" title="Klicken zum Vergrößern">
                                <img src="${backImgPath}" alt="${prop.title} ${currentDenom}€ Rückseite">
                                <span class="img-label">Rückseite</span>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="card-header-row">
                            <div>
                                <h3 class="card-title">${prop.title}</h3>
                                <span class="card-designer">${prop.designer}</span>
                            </div>
                            <span class="card-orientation-badge">${prop.orientation}</span>
                        </div>
                        <div class="previews-row">
                            ${imagesHtml}
                        </div>
                        <p class="concept-text">${prop.desc}</p>
                    `;

                    // Attach click handler on images to open Lightbox
                    card.querySelectorAll('.banknote-img-wrapper').forEach(wrapper => {
                        wrapper.addEventListener('click', () => {
                            lightboxImg.src = wrapper.getAttribute('data-src');
                            lightbox.style.display = 'flex';
                        });
                    });

                    compareGrid.appendChild(card);
                });
            }

        });
    </script>
</body>
</html>
