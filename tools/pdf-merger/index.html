<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    
    <script src="../../assets/vendor/pdf-lib.min.js"></script>
    <script src="../../assets/vendor/FileSaver.min.js"></script>
    <script src="../../assets/vendor/pdf.min.js"></script>
    
    <style>
        .file-item {
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }
        .file-item.dragging {
            opacity: 0.5;
            background: var(--code-bg);
            border: 2px dashed var(--accent);
        }
        .file-item.drag-over-target {
            border-top: 2px solid var(--accent);
        }
        .handle {
            cursor: grab;
            padding: 0 10px;
            color: var(--ink-secondary);
            font-size: 1.2rem;
            user-select: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1>PDF Merger</h1>
                <p>Combines several PDFs into one, in the order of the list. Drag a file by its handle to move it.</p>
            </div>

            <div class="card">
                
                <div class="drop-zone" id="dropZone">
                    <p>Drop PDFs here</p>
                    <span style="font-size: 0.85rem; color: var(--ink-secondary); margin-top: 0.5rem;">or click to browse</span>
                    <input type="file" id="fileInput" class="hidden" multiple accept=".pdf">
                </div>

                <ul class="file-list" id="fileList"></ul>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-fill" id="progressBar"></div>
                </div>

                <div class="button-group">
                    <button class="button" id="mergeBtn" disabled>Merge PDFs</button>
                    <button class="button outline" id="clearBtn">Clear All</button>
                </div>

                <div class="result-box hidden" id="resultBox">
                    <h3>Done</h3>
                    <p>The merged PDF is ready.</p>
                    <div class="button-group">
                        <a href="#" class="button" id="downloadBtn" download="merged.pdf">Download Merged PDF</a>
                        <button class="button outline" id="resetBtn">Start over</button>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/layout.js"></script>
    
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = '../../assets/vendor/pdf.worker.min.js';

        let storedFiles = [];
        const { PDFDocument } = PDFLib;

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const mergeBtn = document.getElementById('mergeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const resultBox = document.getElementById('resultBox');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');

        document.addEventListener('DOMContentLoaded', () => {
            setupDropZone(dropZone, fileInput, handleFiles);
        });

        function handleFiles(files) {
            const newFiles = Array.from(files).filter(f => f.type === 'application/pdf');
            
            if (newFiles.length === 0 && files.length > 0) {
                showToast('Only PDF files can be merged.', 'error');
                return;
            }

            storedFiles = [...storedFiles, ...newFiles];
            renderFileList();
            
            if (newFiles.length > 0) {
                showToast(newFiles.length === 1 ? '1 file added.' : `${newFiles.length} files added.`, 'success');
            }
        }

        function renderFileList() {
            fileList.innerHTML = '';
            
            if (storedFiles.length === 0) {
                fileList.innerHTML = '<li style="text-align:center; color:var(--ink-secondary); padding: 1rem; font-style:italic;">No files yet</li>';
                mergeBtn.disabled = true;
                return;
            }

            mergeBtn.disabled = false;

            storedFiles.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.setAttribute('draggable', 'true');
                li.setAttribute('data-index', index);
                
                li.innerHTML = `
                    <div class="file-info" style="pointer-events: none; align-items: center; display: flex; gap: 10px;">
                        <span class="handle" style="pointer-events: auto;">☰</span>
                        <div class="thumb-container" id="thumb-container-${index}" style="width: 40px; height: 50px; background: #f0f0f0; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px;">
                            <span style="font-size: 0.8rem; color: #888;">...</span>
                        </div>
                        <div>
                            <div class="file-name" title="${escapeHTML(file.name)}" style="margin-bottom: 2px;">${escapeHTML(file.name)}</div>
                            <div class="file-size">${formatFileSize(file.size)}</div>
                        </div>
                    </div>
                    <button class="remove-file" data-index="${index}" title="Remove" aria-label="Remove file" style="pointer-events: auto;">×</button>
                `;

                addDragListeners(li);
                fileList.appendChild(li);
                renderThumbnail(file, index);
            });

            document.querySelectorAll('.remove-file').forEach(btn => {
                btn.addEventListener('click', (e) => removeFile(parseInt(e.target.dataset.index)));
            });
        }

        async function renderThumbnail(file, index) {
            const container = document.getElementById(`thumb-container-${index}`);
            if (!container) return;

            try {
                const url = URL.createObjectURL(file);
                const loadingTask = pdfjsLib.getDocument(url);
                const pdf = await loadingTask.promise;
                const page = await pdf.getPage(1);

                const viewport = page.getViewport({ scale: 1 });
                const scale = 40 / viewport.width;
                const scaledViewport = page.getViewport({ scale });

                const canvas = document.createElement('canvas');
                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;
                const ctx = canvas.getContext('2d');

                // An unpainted canvas is transparent and shows up black in the thumbnail
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                await page.render({
                    canvasContext: ctx,
                    viewport: scaledViewport
                }).promise;

                container.innerHTML = '';
                container.appendChild(canvas);
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error(err);
                container.innerHTML = '<span title="No preview. The file is encrypted or damaged. A file that needs a password to open will not merge." style="font-size: 1rem; color: #888; cursor: help;">?</span>';

                if (err.name === 'PasswordException') {
                    showToast(`"${file.name}" is encrypted. If it needs a password to open, it will not merge.`, 'warning');
                }
            }
        }

        // Reordering uses pointer events rather than HTML5 drag and drop, which does not fire on touch screens
        let draggedItem = null;
        let startIndex = -1;
        let originalY = 0;
        let currentY = 0;
        let placeholder = null;

        function addDragListeners(item) {
            item.removeAttribute('draggable');

            const handle = item.querySelector('.handle');
            if (!handle) return;

            handle.addEventListener('pointerdown', (e) => {
                e.preventDefault(); // otherwise the drag selects text

                draggedItem = item;
                startIndex = +item.getAttribute('data-index');
                originalY = item.offsetTop;
                currentY = e.clientY;

                // Keeps the gap open while the item itself floats
                placeholder = document.createElement('li');
                placeholder.className = 'file-item placeholder';
                placeholder.style.height = `${item.offsetHeight}px`;
                placeholder.style.background = 'transparent';
                placeholder.style.border = '2px dashed var(--accent)';
                placeholder.style.visibility = 'visible';

                item.parentNode.insertBefore(placeholder, item);

                const rect = item.getBoundingClientRect();
                item.style.position = 'absolute';
                item.style.top = `${originalY}px`;
                item.style.left = `${item.offsetLeft}px`;
                item.style.width = `${rect.width}px`;
                item.style.zIndex = '1000';
                item.style.boxShadow = '0 10px 20px rgba(0,0,0,0.1)';
                item.classList.add('dragging');

                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
            });
        }

        function onPointerMove(e) {
            if (!draggedItem) return;
            
            const dy = e.clientY - currentY;
            const newTop = originalY + dy;
            draggedItem.style.top = `${newTop}px`;

            const listItems = Array.from(fileList.children).filter(child => child !== draggedItem && child !== placeholder && child.classList.contains('file-item'));

            let targetIndex = listItems.length;
            for (let i = 0; i < listItems.length; i++) {
                const child = listItems[i];
                const childRect = child.getBoundingClientRect();
                const childCenterY = childRect.top + childRect.height / 2;

                if (e.clientY < childCenterY) {
                    targetIndex = i;
                    break;
                }
            }

            if (targetIndex < listItems.length) {
                fileList.insertBefore(placeholder, listItems[targetIndex]);
            } else {
                fileList.appendChild(placeholder);
            }
        }

        function onPointerUp(e) {
            if (!draggedItem) return;

            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);

            fileList.insertBefore(draggedItem, placeholder);

            draggedItem.style.position = '';
            draggedItem.style.top = '';
            draggedItem.style.left = '';
            draggedItem.style.width = '';
            draggedItem.style.zIndex = '';
            draggedItem.style.boxShadow = '';
            draggedItem.classList.remove('dragging');

            if (placeholder && placeholder.parentNode) {
                placeholder.parentNode.removeChild(placeholder);
            }

            const items = Array.from(fileList.querySelectorAll('.file-item:not(.placeholder)'));
            const newIndex = items.indexOf(draggedItem);

            if (startIndex !== newIndex && newIndex !== -1) {
                const movedFile = storedFiles.splice(startIndex, 1)[0];
                storedFiles.splice(newIndex, 0, movedFile);
                renderFileList(); // the data-index attributes are stale after a move
            }

            draggedItem = null;
            placeholder = null;
            startIndex = -1;
        }

        function removeFile(index) {
            storedFiles.splice(index, 1);
            renderFileList();
        }

        function clearAll() {
            storedFiles = [];
            fileInput.value = '';
            renderFileList();
            resultBox.classList.add('hidden');
        }

        mergeBtn.addEventListener('click', () => {
            if (storedFiles.length < 2) {
                showToast('Add at least two PDFs.', 'error');
                return;
            }

            mergeBtn.disabled = true;
            progressContainer.style.display = 'block';
            progressBar.style.width = '5%';
            resultBox.classList.add('hidden');

            const worker = new Worker('worker.js');

            worker.onmessage = (e) => {
                const { type, percent, data, message } = e.data;
                
                if (type === 'progress') {
                    progressBar.style.width = `${percent}%`;
                } else if (type === 'done') {
                    const blob = new Blob([data], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);

                    downloadBtn.href = url;
                    downloadBtn.download = `merged-pdf-${new Date().toISOString().slice(0,10)}.pdf`;

                    progressBar.style.width = '100%';
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        progressBar.style.width = '0%';
                        resultBox.classList.remove('hidden');
                        mergeBtn.disabled = false;
                        showToast('Merged.', 'success');

                        resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }, 500);

                    worker.terminate();
                } else if (type === 'error') {
                    console.error(message);
                    showToast('Could not merge: ' + message, 'error');
                    progressContainer.style.display = 'none';
                    mergeBtn.disabled = false;
                    worker.terminate();
                }
            };

            worker.onerror = (err) => {
                console.error(err);
                showToast('The merge stopped with an error.', 'error');
                progressContainer.style.display = 'none';
                mergeBtn.disabled = false;
                worker.terminate();
            };

            worker.postMessage({ files: storedFiles });
        });

        clearBtn.addEventListener('click', clearAll);
        
        resetBtn.addEventListener('click', () => {
            resultBox.classList.add('hidden');
            clearAll();
        });

        renderFileList();
    
    /* Hält dieses Werkzeug gerade etwas, das ein Neuladen vernichtet?
       Gefragt wird beim Druck auf "Neu laden" im Update-Hinweis
       (assets/js/layout.js). Wer sich nicht meldet, gilt als leer —
       tests/test-arbeit-haken.js besteht darauf, dass jedes Werkzeug mit
       Datei-Eingabe sich meldet. */
    window.llHaeltArbeit = () => storedFiles.length > 0;
    </script>
</body>
</html>
