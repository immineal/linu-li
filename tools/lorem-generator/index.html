<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="Lorem-Ipsum-Generator | Linus Linhof">Lorem Ipsum Generator | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1 data-de="Lorem-Ipsum-Generator">Lorem Ipsum Generator</h1>
                <p data-de="Fülltext auf Latein, in Technikjargon oder Businesssprache, als reiner Text, JSON, CSV oder SQL.">Filler text in Latin, tech jargon or corporate speak, as plain text, JSON, CSV or SQL.</p>
            </div>

            <div class="card">
                
                <div class="split-view">
                    <div>
                        <label for="theme" data-de="Thema">Theme</label>
                        <select id="theme" data-save>
                            <option value="latin" data-de="Standard (Latein)">Standard (Latin)</option>
                            <option value="tech" data-de="Technikjargon">Tech Babble</option>
                            <option value="corporate" data-de="Businesssprache">Corporate Speak</option>
                        </select>

                        <label for="quantity" data-de="Menge">Quantity</label>
                        <input type="number" id="quantity" value="3" min="1" max="100">
                    </div>

                    <div>
                        <label for="type" data-de="Einheit">Type</label>
                        <select id="type" data-save>
                            <option value="paragraphs" data-de="Absätze">Paragraphs</option>
                            <option value="sentences" data-de="Sätze">Sentences</option>
                            <option value="words" data-de="Wörter">Words</option>
                        </select>

                        <label style="margin-top: 1.2rem;" data-de="Optionen">Options</label>

                        <label for="format" data-de="Format">Format</label>
                        <select id="format" data-save>
                            <option value="text" data-de="Reiner Text">Plain Text</option>
                            <option value="json">JSON</option>
                            <option value="csv">CSV</option>
                            <option value="sql" data-de="SQL-Insert">SQL Insert</option>
                        </select>

                        <label class="toggle-wrapper" for="startWithLorem" id="loremToggleWrapper">
                            <span id="startWithLabel" style="flex-grow:1; cursor:pointer;">Start with "Lorem ipsum..."</span>
                            <input type="checkbox" id="startWithLorem" class="toggle-checkbox" checked>
                            <div class="toggle-switch"></div>
                        </label>

                        <label class="toggle-wrapper" for="htmlTags">
                            <span style="flex-grow:1; cursor:pointer;" data-de="HTML-Tags einfügen (&lt;p&gt;)">Include HTML Tags (&lt;p&gt;)</span>
                            <input type="checkbox" id="htmlTags" class="toggle-checkbox">
                            <div class="toggle-switch"></div>
                        </label>
                    </div>
                </div>

                <div class="button-group">
                    <button class="button" id="generateBtn" data-de="Text erzeugen">Generate Text</button>
                    <button class="button outline" id="clearBtn" data-de="Leeren">Clear</button>
                </div>

                <div class="button-group" style="margin-top: 1rem;">
                    <span style="font-size: 0.9rem; color: var(--text-muted); align-self: center; margin-right: 0.5rem;" data-de="Schnellkopie:">Quick Copy:</span>
                    <button class="button sm outline" id="quick1ParBtn" data-de="1 Absatz">1 Paragraph</button>
                    <button class="button sm outline" id="quick5ParBtn" data-de="5 Absätze">5 Paragraphs</button>
                    <button class="button sm outline" id="quick10ParBtn" data-de="10 Absätze">10 Paragraphs</button>
                </div>

                <div class="result-box hidden" id="resultBox">
                    <label data-de="Erzeugter Text">Generated Text</label>
                    <div id="textOutput" class="code-view" style="max-height: 500px; overflow-y: auto;"></div>
                    
                    <div class="button-group" style="margin-top: 1rem;">
                        <button class="button sm secondary" id="copyBtn" data-de="In die Zwischenablage kopieren">Copy to Clipboard</button>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>
    
    <script>
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const resultBox = document.getElementById('resultBox');
        const textOutput = document.getElementById('textOutput');
        
        const themeSelect = document.getElementById('theme');
        const quantityInput = document.getElementById('quantity');
        const typeSelect = document.getElementById('type');
        const formatSelect = document.getElementById('format');
        const quick1ParBtn = document.getElementById('quick1ParBtn');
        const quick5ParBtn = document.getElementById('quick5ParBtn');
        const quick10ParBtn = document.getElementById('quick10ParBtn');
        const startWithLoremCheck = document.getElementById('startWithLorem');
        const loremToggleWrapper = document.getElementById('loremToggleWrapper');
        const startWithLabel = document.getElementById('startWithLabel');
        const htmlTagsCheck = document.getElementById('htmlTags');

        const vocabs = {
            latin: [
                "lorem", "ipsum", "dolor", "sit", "amet", "consectetur", "adipiscing", "elit", 
                "sed", "do", "eiusmod", "tempor", "incididunt", "ut", "labore", "et", "dolore", 
                "magna", "aliqua", "ut", "enim", "ad", "minim", "veniam", "quis", "nostrud", 
                "exercitation", "ullamco", "laboris", "nisi", "ut", "aliquip", "ex", "ea", 
                "commodo", "consequat", "duis", "aute", "irure", "dolor", "in", "reprehenderit", 
                "in", "voluptate", "velit", "esse", "cillum", "dolore", "eu", "fugiat", "nulla", 
                "pariatur", "excepteur", "sint", "occaecat", "cupidatat", "non", "proident", 
                "sunt", "in", "culpa", "qui", "officia", "deserunt", "mollit", "anim", "id", 
                "est", "laborum"
            ],
            tech: [
                "algorithm", "bandwidth", "cloud", "digital", "encryption", "firewall", "gigabit", 
                "heuristic", "ip", "json", "kernel", "logic", "matrix", "network", "open-source", 
                "protocol", "quantum", "router", "server", "token", "url", "virtual", "wireless", 
                "xml", "backend", "frontend", "api", "cache", "data", "ethernet", "firmware", 
                "gateway", "hardware", "interface", "javascript", "keyboard", "latency", "malware", 
                "node", "offline", "packet", "query", "runtime", "socket", "terminal", "upload", 
                "vector", "widget", "zip", "array", "binary", "cyber", "debug", "syntax"
            ],
            corporate: [
                "agile", "benchmark", "circle-back", "deliverables", "empower", "feedback", "growth", 
                "holistic", "innovate", "journey", "kpi", "leverage", "mindset", "networking", 
                "optimize", "pivot", "quarterly", "roi", "synergy", "touchpoint", "upside", 
                "value-add", "win-win", "alignment", "bandwidth", "core-competency", "disrupt", 
                "ecosystem", "framework", "granular", "hardball", "ideation", "jargon", "key-takeaway", 
                "low-hanging-fruit", "moving-forward", "next-steps", "onboarding", "paradigm-shift", 
                "quota", "roadmap", "scalability", "traction", "utilize", "vertical", "wheelhouse", 
                "yield", "zone"
            ]
        };

        const startingPhrases = {
            latin: "Lorem ipsum dolor sit amet, consectetur adipiscing elit",
            tech: "Algorithm bandwidth cloud digital encryption, firewall gigabit heuristic",
            corporate: "Agile benchmark circle-back deliverables, empower feedback growth"
        };

        themeSelect.addEventListener('change', () => {
            const theme = themeSelect.value;
            const phrase = startingPhrases[theme];
            
            const shortPhrase = phrase.split(' ').slice(0, 2).join(' ');
            
            startWithLabel.textContent = `Start with "${shortPhrase}..."`;

            startWithLoremCheck.disabled = false;
            loremToggleWrapper.style.opacity = '1';
            startWithLoremCheck.checked = true;
        });

        // Deals words from a shuffled deck and reshuffles when it runs out, so
        // no word repeats until every other one has come up.
        function* createRandomWordGenerator(theme) {
            const list = vocabs[theme];
            let remainingWords = [];
            while (true) {
                if (remainingWords.length === 0) {
                    remainingWords = [...list];
                    for (let i = remainingWords.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [remainingWords[i], remainingWords[j]] = [remainingWords[j], remainingWords[i]];
                    }
                }
                yield remainingWords.pop();
            }
        }

        const generators = {
            latin: createRandomWordGenerator('latin'),
            tech: createRandomWordGenerator('tech'),
            corporate: createRandomWordGenerator('corporate')
        };

        function getRandomWord(theme) {
            return generators[theme].next().value;
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function generateSentence(theme, minWords = 8, maxWords = 15) {
            const length = Math.floor(Math.random() * (maxWords - minWords + 1)) + minWords;
            let sentence = [];
            for (let i = 0; i < length; i++) {
                sentence.push(getRandomWord(theme));
            }
            if (length > 10 && Math.random() > 0.5) {
                const commaIndex = Math.floor(Math.random() * (length - 4)) + 2;
                sentence[commaIndex] += ",";
            }
            
            let text = sentence.join(" ");
            return capitalize(text) + ".";
        }

        function generateParagraph(theme, numSentences) {
            let sentences = [];
            for (let i = 0; i < numSentences; i++) {
                sentences.push(generateSentence(theme));
            }
            return sentences.join(" ");
        }

        function generateText() {
            let quantity = parseInt(quantityInput.value);
            if (isNaN(quantity) || quantity < 0) quantity = 0;
            if (quantity > 10000) quantity = 10000;

            const type = typeSelect.value;
            const theme = themeSelect.value;
            const startPhrase = startingPhrases[theme];
            const startEnabled = startWithLoremCheck.checked;
            const useHtml = htmlTagsCheck.checked;
            const format = formatSelect.value;

            let output = "";
            let rawTextArray = [];

            if (quantity === 0) {
                textOutput.innerText = "";
                resultBox.classList.add('hidden');
                return;
            }

            if (type === 'words') {
                for (let i = 0; i < quantity; i++) {
                    rawTextArray.push(getRandomWord(theme));
                }
                output = rawTextArray.join(" ");
            } 
            else if (type === 'sentences') {
                for (let i = 0; i < quantity; i++) {
                    rawTextArray.push(generateSentence(theme));
                }
                output = rawTextArray.join(" ");
            } 
            else {
                for (let i = 0; i < quantity; i++) {
                    const sentenceCount = Math.floor(Math.random() * 4) + 3;
                    rawTextArray.push(generateParagraph(theme, sentenceCount));
                }
                output = rawTextArray.join("\n\n");
            }

            if (startEnabled) {
                if (type === 'words') {
                    const standardWords = startPhrase.toLowerCase().replace(/[.,]/g, '').split(' ');
                    let currentWords = output.split(' ');
                    
                    if (quantity < standardWords.length) {
                        output = standardWords.slice(0, quantity).join(' ');
                    } else {
                        currentWords.splice(0, standardWords.length, ...standardWords);
                        output = currentWords.join(' ');
                    }
                } 
                else {
                    /* Replace at word boundaries so the phrase never lands
                       glued onto half of another word. The old substring
                       swap kept the character count neat but cut into
                       whatever word was straddling the cut point:
                       "…adipiscing elitnim eu…" for one; "…empower feedback
                       growthmpower win-win" for another. */
                    const startWords = startPhrase.split(/\s+/);
                    const outputWords = output.split(/(\s+)/);
                    const wordSlots = [];
                    for (let i = 0; i < outputWords.length; i++) {
                        if (i % 2 === 0) wordSlots.push(i);
                    }
                    if (wordSlots.length < startWords.length) {
                        output = startPhrase + ".";
                    } else {
                        for (let i = 0; i < startWords.length; i++) {
                            outputWords[wordSlots[i]] = startWords[i];
                        }
                        output = outputWords.join('');
                        if (!output.trim().endsWith(".")) output += ".";
                    }
                }
            }

            if (useHtml) {
                if (type === 'paragraphs') {
                    output = rawTextArray.map((p, index) => {
                        // rawTextArray never got the start phrase (only the joined
                        // output did), so it goes onto the first paragraph here.
                        if (index === 0 && startEnabled) {
                           let firstP = p;
                           if (p.length > startPhrase.length) {
                               firstP = startPhrase + p.substring(startPhrase.length);
                           } else {
                               firstP = startPhrase + ".";
                           }
                           return `<p>${firstP}</p>`; 
                        }
                        return `<p>${p}</p>`;
                    }).join("\n");
                } else if (type === 'sentences') {
                     let sentences = output.split('. ').filter(s => s.trim().length > 0);
                     output = sentences.map(s => {
                         let clean = s.replace(/\.$/, '');
                         return `<span>${clean}.</span>`;
                     }).join(" ");
                } else {
                    output = `<p>${output}</p>`;
                }
            } else {
                 if (type === 'paragraphs' && startEnabled) {
                     let paragraphs = output.split("\n\n");
                     const firstWords = startPhrase.split(' ')[0];
                     if (!paragraphs[0].startsWith(firstWords)) {
                         paragraphs[0] = startPhrase + paragraphs[0].substring(startPhrase.length);
                         output = paragraphs.join("\n\n");
                     }
                 }
            }

            if (format === 'json') {
                if (type === 'paragraphs') {
                     output = JSON.stringify({ paragraphs: output.split('\n\n') }, null, 2);
                } else if (type === 'sentences') {
                     output = JSON.stringify({ sentences: output.split('. ').filter(s => s.trim().length > 0).map(s => s.replace(/\.$/, '') + '.') }, null, 2);
                } else {
                     output = JSON.stringify({ words: output.split(' ') }, null, 2);
                }
            } else if (format === 'csv') {
                if (type === 'paragraphs') {
                    output = "id,paragraph\n" + output.split('\n\n').map((p, i) => `${i + 1},"${p.replace(/"/g, '""')}"`).join('\n');
                } else if (type === 'sentences') {
                    let sentences = output.split('. ').filter(s => s.trim().length > 0).map(s => s.replace(/\.$/, '') + '.');
                    output = "id,sentence\n" + sentences.map((s, i) => `${i + 1},"${s.replace(/"/g, '""')}"`).join('\n');
                } else {
                    output = "id,word\n" + output.split(' ').map((w, i) => `${i + 1},${w}`).join('\n');
                }
            } else if (format === 'sql') {
                const tableName = `mock_${type}`;
                const colName = type === 'paragraphs' ? 'paragraph' : (type === 'sentences' ? 'sentence' : 'word');
                let items = [];
                if (type === 'paragraphs') {
                    items = output.split('\n\n');
                } else if (type === 'sentences') {
                    items = output.split('. ').filter(s => s.trim().length > 0).map(s => s.replace(/\.$/, '') + '.');
                } else {
                    items = output.split(' ');
                }
                output = `INSERT INTO ${tableName} (${colName}) VALUES\n` + items.map(item => `  ('${item.replace(/'/g, "''")}')`).join(',\n') + ';';
            }

            textOutput.innerText = output;
            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function triggerQuickCopy(paragraphs) {
            quantityInput.value = paragraphs;
            typeSelect.value = 'paragraphs';
            formatSelect.value = 'text';
            try {
                generateText();
                copyBtn.click();
            } catch (e) {
                console.error(e);
                showToast('Could not generate text', 'error');
            }
        }

        quick1ParBtn.addEventListener('click', () => triggerQuickCopy(1));
        quick5ParBtn.addEventListener('click', () => triggerQuickCopy(5));
        quick10ParBtn.addEventListener('click', () => triggerQuickCopy(10));

        generateBtn.addEventListener('click', () => {
            try {
                generateText();
                showToast('Text generated', 'success');
            } catch (e) {
                console.error(e);
                showToast('Could not generate text', 'error');
            }
        });

        clearBtn.addEventListener('click', () => {
            textOutput.innerText = '';
            resultBox.classList.add('hidden');
            quantityInput.value = 3;
            typeSelect.value = 'paragraphs';
            
            themeSelect.value = 'latin';
            startWithLabel.textContent = 'Start with "Lorem ipsum..."';
            startWithLoremCheck.disabled = false;
            startWithLoremCheck.checked = true;
            loremToggleWrapper.style.opacity = '1';
            
            htmlTagsCheck.checked = false;
        });

        copyBtn.addEventListener('click', () => {
            const text = textOutput.innerText;
            if (!text) return;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Copied to clipboard', 'success');
                }).catch(err => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        });

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;

            // Fixed at the top, or focusing it scrolls the page to the bottom
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";

            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('Copied to clipboard', 'success');
                } else {
                    showToast('Could not copy', 'error');
                }
            } catch (err) {
                showToast('Could not copy', 'error');
            }

            document.body.removeChild(textArea);
        }

        window.onload = generateText;
    </script>
</body>
</html>
