<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unix Timestamp Converter | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    
    <script src="../../assets/vendor/dayjs.min.js"></script>
    <script src="../../assets/vendor/dayjs-utc.js"></script>
    <script src="../../assets/vendor/dayjs-relativeTime.js"></script>
    <script src="../../assets/vendor/dayjs-localizedFormat.js"></script>
    <script src="../../assets/vendor/dayjs-timezone.js"></script>

    <style>
        /* The base CSS only styles input[type="text"], so the date picker is
           made to match here. */
        input[type="datetime-local"] {
            width: 100%; 
            padding: 0.8rem 1rem; 
            margin-bottom: 1.25rem;
            border: 1px solid var(--border); 
            background: var(--input-bg); 
            color: var(--input-text);
            font-family: var(--font-mono);
            font-size: 0.95rem; 
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        input[type="datetime-local"]:focus {
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(196, 77, 60, 0.1);
        }

        .hero-time {
            font-family: var(--font-heading);
            color: var(--accent-secondary);
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1>Unix Timestamp Converter</h1>
                <p>Shows the current Unix time, and converts between timestamps and dates in your own time zone or another one.</p>
            </div>

            <div class="card">
                
                <div style="text-align: center; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border);">
                    
                    <div class="hero-time" id="currentHumanTime">Loading...</div>
                    
                    <div class="big-display" id="currentTimestamp" style="margin-top: 0;">...</div>
                    <label style="color: var(--ink-secondary); font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; margin-top: -10px; display: block; margin-bottom: 1.5rem;">Seconds since Epoch</label>
                    
                    <div class="button-group" style="justify-content: center;">
                        <button class="button sm" id="pauseBtn">Pause</button>
                        <button class="button sm outline" id="copyCurrentBtn">Copy Timestamp</button>
                    </div>
                </div>

                <!-- One grid, not two columns, so each row lines up across both
                     sides. Children go left, right, left, right. -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;" id="converterGrid">

                    <h3 style="margin-bottom: 0.75rem;">Timestamp &rarr; Date</h3>
                    <h3 style="margin-bottom: 0.75rem;">Date &rarr; Timestamp</h3>

                    <div>
                        <label for="tsInput">Enter Timestamp</label>
                        <input type="number" id="tsInput" placeholder="e.g. 1678886400">
                    </div>
                    <div>
                        <label for="nlInput">Natural Language Date <span style="font-size: 0.8em; color: var(--ink-secondary); font-weight: normal;">(fetches a parser from jsDelivr on first use)</span></label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="text" id="nlInput" placeholder="e.g. Next Friday at 5pm" style="margin-bottom: 0; flex: 1;">
                            <button class="button sm outline" id="parseNlBtn" style="flex-shrink: 0; align-self: stretch;">Parse</button>
                        </div>
                        <div id="nlFeedback" style="font-size: 0.8rem; color: var(--accent); margin-top: 0.4rem; min-height: 1.1em;"></div>
                    </div>

                    <div>
                        <label for="tsFormat">Input Format</label>
                        <select id="tsFormat" data-save>
                            <option value="auto">Auto-detect</option>
                            <option value="s">Seconds</option>
                            <option value="ms">Milliseconds</option>
                            <option value="us">Microseconds</option>
                            <option value="ns">Nanoseconds</option>
                        </select>
                        <div id="tsFormatFeedback" style="font-size: 0.8rem; color: var(--accent); margin-top: -0.75rem; margin-bottom: 1rem; min-height: 1.1em;"></div>
                    </div>
                    <div>
                        <label for="manualTz">Select Timezone</label>
                        <select id="manualTz" data-save>
                            <option value="local">Local Time</option>
                            <option value="utc">UTC</option>
                        </select>
                    </div>

                    <div>
                        <label for="targetTz">Convert to Timezone</label>
                        <select id="targetTz" data-save>
                        </select>
                    </div>
                    <div>
                        <label for="dateInput">Select Date &amp; Time</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="datetime-local" id="dateInput" step="1" style="flex: 1; margin-bottom: 0;">
                            <button class="button sm outline" id="setNowBtn" style="flex-shrink: 0; align-self: stretch;" title="Set to current time">Now</button>
                        </div>
                    </div>

                    <div class="button-group" style="margin-top: 0.5rem;">
                        <button class="button" id="convertToDateBtn">Convert</button>
                        <button class="button outline" id="clearTsBtn">Clear</button>
                    </div>
                    <div class="button-group" style="margin-top: 0.5rem;">
                        <button class="button" id="convertToTsBtn">Get Timestamp</button>
                        <button class="button outline" id="clearDateBtn">Clear</button>
                    </div>

                    <div class="result-box hidden" id="tsResultBox">
                        <label>GMT / UTC</label>
                        <input type="text" readonly id="resUtc" style="font-family: var(--font-mono); font-size: 0.9rem;" onclick="this.select()">
                        
                        <label>Your Local Time</label>
                        <input type="text" readonly id="resLocal" style="font-family: var(--font-mono); font-size: 0.9rem;" onclick="this.select()">
                        
                        <label>Selected Timezone</label>
                        <input type="text" readonly id="resZone" style="font-family: var(--font-mono); font-size: 0.9rem; font-weight: bold; color: var(--accent);" onclick="this.select()">

                        <label>Relative</label>
                        <p id="resRelative" style="font-family: var(--font-mono); margin-bottom: 0; color: var(--ink-secondary);"></p>
                    </div>
                    <div class="result-box hidden" id="dateResultBox">
                        <label>Unix Timestamp (Seconds)</label>
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 1rem;">
                            <input type="text" readonly id="resTsSeconds" style="font-family: var(--font-mono); margin-bottom: 0; flex: 1;" onclick="this.select()">
                            <button class="button sm secondary" onclick="copyInput('resTsSeconds')">Copy</button>
                        </div>

                        <label>Timestamp (Milliseconds)</label>
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 1rem;">
                            <input type="text" readonly id="resTsMillis" style="font-family: var(--font-mono); margin-bottom: 0; flex: 1;">
                            <button class="button sm secondary" onclick="copyInput('resTsMillis')">Copy</button>
                        </div>

                        <label>Timestamp (Microseconds)</label>
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 1rem;">
                            <input type="text" readonly id="resTsMicro" style="font-family: var(--font-mono); margin-bottom: 0; flex: 1;">
                            <button class="button sm secondary" onclick="copyInput('resTsMicro')">Copy</button>
                        </div>

                        <label>Timestamp (Nanoseconds)</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="text" readonly id="resTsNano" style="font-family: var(--font-mono); margin-bottom: 0; flex: 1;">
                            <button class="button sm secondary" onclick="copyInput('resTsNano')">Copy</button>
                        </div>
                    </div>

                </div>
                <style>
                    @media (max-width: 768px) {
                        #converterGrid { grid-template-columns: 1fr !important; }
                    }
                </style>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/layout.js"></script>
    
    <script>
        dayjs.extend(window.dayjs_plugin_utc);
        dayjs.extend(window.dayjs_plugin_relativeTime);
        dayjs.extend(window.dayjs_plugin_localizedFormat);
        dayjs.extend(window.dayjs_plugin_timezone);

        const currentTimestampDisplay = document.getElementById('currentTimestamp');
        const currentHumanTimeDisplay = document.getElementById('currentHumanTime');
        const pauseBtn = document.getElementById('pauseBtn');
        const copyCurrentBtn = document.getElementById('copyCurrentBtn');

        const tsInput = document.getElementById('tsInput');
        const targetTz = document.getElementById('targetTz');
        const tsFormat = document.getElementById('tsFormat');
        const tsFormatFeedback = document.getElementById('tsFormatFeedback');
        const convertToDateBtn = document.getElementById('convertToDateBtn');
        const clearTsBtn = document.getElementById('clearTsBtn');
        const tsResultBox = document.getElementById('tsResultBox');
        const resUtc = document.getElementById('resUtc');
        const resLocal = document.getElementById('resLocal');
        const resZone = document.getElementById('resZone');
        const resRelative = document.getElementById('resRelative');

        const manualTz = document.getElementById('manualTz');
        const nlInput = document.getElementById('nlInput');
        const parseNlBtn = document.getElementById('parseNlBtn');
        const nlFeedback = document.getElementById('nlFeedback');
        const dateInput = document.getElementById('dateInput');
        const setNowBtn = document.getElementById('setNowBtn');
        const convertToTsBtn = document.getElementById('convertToTsBtn');
        const clearDateBtn = document.getElementById('clearDateBtn');
        const dateResultBox = document.getElementById('dateResultBox');
        const resTsSeconds = document.getElementById('resTsSeconds');
        const resTsMillis = document.getElementById('resTsMillis');
        const resTsMicro = document.getElementById('resTsMicro');
        const resTsNano = document.getElementById('resTsNano');

        let isPaused = false;
        let timerInterval;

        const commonTimezones = [
            { name: "UTC (Coordinated Universal Time)", zone: "UTC" },
            { name: "New York (EST/EDT)", zone: "America/New_York" },
            { name: "Los Angeles (PST/PDT)", zone: "America/Los_Angeles" },
            { name: "Chicago (CST/CDT)", zone: "America/Chicago" },
            { name: "London (GMT/BST)", zone: "Europe/London" },
            { name: "Paris (CET/CEST)", zone: "Europe/Paris" },
            { name: "Berlin (CET/CEST)", zone: "Europe/Berlin" },
            { name: "Moscow (MSK)", zone: "Europe/Moscow" },
            { name: "Dubai (GST)", zone: "Asia/Dubai" },
            { name: "Mumbai (IST)", zone: "Asia/Kolkata" },
            { name: "Singapore (SGT)", zone: "Asia/Singapore" },
            { name: "Shanghai (CST)", zone: "Asia/Shanghai" },
            { name: "Tokyo (JST)", zone: "Asia/Tokyo" },
            { name: "Sydney (AEST/AEDT)", zone: "Australia/Sydney" },
            { name: "Auckland (NZST/NZDT)", zone: "Pacific/Auckland" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            populateTimezones();
            startClock();
            setDatePickerToNow();
            
            const userZone = dayjs.tz.guess();
            if (userZone) {
                // Only preselected when the visitor's zone is one of the fifteen
                const exists = Array.from(targetTz.options).some(opt => opt.value === userZone);
                if (exists) targetTz.value = userZone;
            }

            tsInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') convertToDateBtn.click();
            });

            dateInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') convertToTsBtn.click();
            });

            if (nlInput) {
                nlInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') parseNlBtn.click();
                });
            }
        });

        function populateTimezones() {
            commonTimezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz.zone;
                option.textContent = tz.name;
                targetTz.appendChild(option);
            });
        }

        function startClock() {
            updateClock();
            timerInterval = setInterval(updateClock, 1000);
        }

        function updateClock() {
            if (!isPaused) {
                const now = dayjs();
                currentTimestampDisplay.textContent = now.unix();
                currentHumanTimeDisplay.textContent = now.format('dddd, MMM D, YYYY h:mm:ss A');
            }
        }

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
            pauseBtn.classList.toggle('secondary');
        });

        copyCurrentBtn.addEventListener('click', () => {
            copyToClipboard(currentTimestampDisplay.textContent);
        });

        function setDatePickerToNow() {
            const now = dayjs();
            // datetime-local requires format YYYY-MM-DDTHH:mm:ss
            dateInput.value = now.format('YYYY-MM-DDTHH:mm:ss');
        }

        setNowBtn.addEventListener('click', setDatePickerToNow);

        convertToDateBtn.addEventListener('click', () => {
            const inputVal = tsInput.value.trim();
            const selectedZone = targetTz.value;
            const selectedFormat = tsFormat.value;
            
            if (!inputVal) {
                showToast('Enter a timestamp first', 'error');
                return;
            }

            let tsBigInt;
            try {
                tsBigInt = BigInt(inputVal);
            } catch (e) {
                showToast('A timestamp is a whole number', 'error');
                return;
            }

            let format = selectedFormat;
            let strLen = inputVal.replace(/^-/, '').length;

            if (format === 'auto') {
                if (strLen <= 11) format = 's';
                else if (strLen <= 14) format = 'ms';
                else if (strLen <= 17) format = 'us';
                else format = 'ns';

                const formatNames = {
                    's': 'Seconds',
                    'ms': 'Milliseconds',
                    'us': 'Microseconds',
                    'ns': 'Nanoseconds'
                };
                tsFormatFeedback.textContent = `Auto-detected as ${formatNames[format]}`;
            } else {
                tsFormatFeedback.textContent = '';
            }

            // Convert everything to milliseconds for Day.js
            let dayObj;
            let msValue;

            if (format === 's') {
                msValue = Number(tsBigInt) * 1000;
            } else if (format === 'ms') {
                msValue = Number(tsBigInt);
            } else if (format === 'us') {
                msValue = Number(tsBigInt / 1000n);
            } else if (format === 'ns') {
                msValue = Number(tsBigInt / 1000000n);
            }

            dayObj = dayjs(msValue);

            if (!dayObj.isValid()) {
                showToast('That timestamp is out of the range a date can show', 'error');
                return;
            }

            resUtc.value = dayObj.utc().format('YYYY-MM-DD HH:mm:ss [UTC]');
            resLocal.value = dayObj.format('YYYY-MM-DD HH:mm:ss Z');

            resZone.value = dayObj.tz(selectedZone).format('YYYY-MM-DD HH:mm:ss Z');
            
            resRelative.textContent = dayObj.fromNow();
            
            tsResultBox.classList.remove('hidden');
        });

        clearTsBtn.addEventListener('click', () => {
            tsInput.value = '';
            tsFormatFeedback.textContent = '';
            tsResultBox.classList.add('hidden');
        });

        convertToTsBtn.addEventListener('click', () => {
            const dateVal = dateInput.value;
            const tzMode = manualTz.value;
            
            if (!dateVal) {
                showToast('Pick a date first', 'error');
                return;
            }

            let dayObj;
            if (tzMode === 'utc') {
                dayObj = dayjs.utc(dateVal);
            } else {
                dayObj = dayjs(dateVal);
            }
            
            if (!dayObj.isValid()) {
                showToast('That is not a valid date', 'error');
                return;
            }

            resTsSeconds.value = dayObj.unix();
            resTsMillis.value = dayObj.valueOf();
            
            // BigInt: nanoseconds since 1970 are past 2^53, where a Number
            // starts rounding the last digits
            resTsMicro.value = BigInt(dayObj.valueOf()) * 1000n;
            resTsNano.value = BigInt(dayObj.valueOf()) * 1000000n;

            dateResultBox.classList.remove('hidden');
        });

        clearDateBtn.addEventListener('click', () => {
            dateInput.value = '';
            if (nlInput) nlInput.value = '';
            if (nlFeedback) nlFeedback.textContent = '';
            dateResultBox.classList.add('hidden');
        });

        parseNlBtn.addEventListener('click', async () => {
            const text = nlInput.value.trim();
            if (!text) {
                nlFeedback.textContent = "Type a date first";
                return;
            }

            parseNlBtn.textContent = '...';
            parseNlBtn.disabled = true;

            try {
                // Imported only when someone uses this field, so opening the page
                // makes no request to jsDelivr.
                const chronoModule = await import('https://cdn.jsdelivr.net/npm/chrono-node@2.7.7/+esm');
                const parsedDate = chronoModule.parseDate(text);

                if (parsedDate) {
                    nlFeedback.textContent = "Found a date";
                    nlFeedback.style.color = "var(--success, #2e7d32)";

                    dateInput.value = dayjs(parsedDate).format('YYYY-MM-DDTHH:mm:ss');
                    manualTz.value = 'local'; // chrono returns local time unless the text names a zone
                    convertToTsBtn.click();
                } else {
                    nlFeedback.textContent = "No date found in that";
                    nlFeedback.style.color = "var(--accent)";
                }
            } catch (err) {
                console.error('Could not load chrono-node', err);
                nlFeedback.textContent = "Could not load the parser from jsDelivr. This field needs a connection.";
                nlFeedback.style.color = "var(--accent)";
            } finally {
                parseNlBtn.textContent = 'Parse';
                parseNlBtn.disabled = false;
            }
        });

        window.copyInput = function(elementId) {
            const val = document.getElementById(elementId).value;
            copyToClipboard(val);
        };
    </script>
</body>
</html>
