<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="Unix-Zeitstempel-Umrechner | Linus Linhof">Unix Timestamp Converter | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    
    <script src="../../assets/vendor/dayjs.min.js"></script>
    <script src="../../assets/vendor/dayjs-utc.js"></script>
    <script src="../../assets/vendor/dayjs-relativeTime.js"></script>
    <script src="../../assets/vendor/dayjs-localizedFormat.js"></script>
    <script src="../../assets/vendor/dayjs-timezone.js"></script>

    <style>
        /* The base CSS only styles input[type="text"], so the date picker is
           made to match here. */
        input[type="datetime-local"] {
            width: 100%; 
            padding: 0.8rem 1rem; 
            margin-bottom: 1.25rem;
            border: 1px solid var(--border); 
            background: var(--input-bg); 
            color: var(--input-text);
            font-family: var(--font-mono);
            font-size: 0.95rem; 
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        input[type="datetime-local"]:focus {
            outline: none; 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(196, 77, 60, 0.1);
        }

        .hero-time {
            font-family: var(--font-heading);
            color: var(--accent-secondary);
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1 data-de="Unix-Zeitstempel-Umrechner">Unix Timestamp Converter</h1>
                <p data-de="Zeigt die aktuelle Unix-Zeit und rechnet zwischen Zeitstempeln und Daten in deiner oder einer anderen Zeitzone um.">Shows the current Unix time, and converts between timestamps and dates in your own time zone or another one.</p>
            </div>

            <div class="card">
                
                <div style="text-align: center; margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border);">
                    
                    <div class="hero-time" id="currentHumanTime">Loading...</div>
                    
                    <div class="big-display" id="currentTimestamp" style="margin-top: 0;">...</div>
                    <label style="color: var(--ink-secondary); font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; margin-top: -10px; display: block; margin-bottom: 1.5rem;" data-de="Sekunden seit Epoch">Seconds since Epoch</label>

                    <div class="button-group" style="justify-content: center;">
                        <button class="button sm" id="pauseBtn" data-de="Pause">Pause</button>
                        <button class="button sm outline" id="copyCurrentBtn" data-de="Zeitstempel kopieren">Copy Timestamp</button>
                    </div>
                </div>

                <!-- One grid, not two columns, so each row lines up across both
                     sides. Children go left, right, left, right. -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;" id="converterGrid">

                    <h3 style="margin-bottom: 0.75rem;" data-de="Zeitstempel → Datum">Timestamp &rarr; Date</h3>
                    <h3 style="margin-bottom: 0.75rem;" data-de="Datum → Zeitstempel">Date &rarr; Timestamp</h3>

                    <div>
                        <label for="tsInput" data-de="Zeitstempel eingeben">Enter Timestamp</label>
                        <input type="number" id="tsInput" placeholder="e.g. 1678886400" data-de-attr="placeholder:z. B. 1678886400">
                    </div>
                    <div>
                        <label for="nlInput"><span data-de="Datum in Umgangssprache">Natural Language Date</span> <span style="font-size: 0.8em; color: var(--ink-secondary); font-weight: normal;" data-de="(lädt beim ersten Nutzen einen Parser von jsDelivr)">(fetches a parser from jsDelivr on first use)</span></label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="text" id="nlInput" placeholder="e.g. Next Friday at 5pm" style="margin-bottom: 0; flex: 1;" data-de-attr="placeholder:z. B. nächsten Freitag um 17 Uhr">
                            <button class="button sm outline" id="parseNlBtn" style="flex-shrink: 0; align-self: stretch;" data-de="Auslesen">Parse</button>
                        </div>
                        <div id="nlFeedback" style="font-size: 0.8rem; color: var(--accent); margin-top: 0.4rem; min-height: 1.1em;"></div>
                    </div>

                    <div>
                        <label for="tsFormat" data-de="Eingabeformat">Input Format</label>
                        <select id="tsFormat" data-save>
                            <option value="auto" data-de="Automatisch erkennen">Auto-detect</option>
                            <option value="s" data-de="Sekunden">Seconds</option>
                            <option value="ms" data-de="Millisekunden">Milliseconds</option>
                            <option value="us" data-de="Mikrosekunden">Microseconds</option>
                            <option value="ns" data-de="Nanosekunden">Nanoseconds</option>
                        </select>
                        <div id="tsFormatFeedback" style="font-size: 0.8rem; color: var(--accent); margin-top: -0.75rem; margin-bottom: 1rem; min-height: 1.1em;"></div>
                    </div>
                    <div>
                        <label for="manualTz" data-de="Zeitzone wählen">Select Timezone</label>
                        <select id="manualTz" data-save>
                            <option value="local" data-de="Ortszeit">Local Time</option>
                            <option value="utc">UTC</option>
                        </select>
                    </div>

                    <div>
                        <label for="targetTz" data-de="In Zeitzone umrechnen">Convert to Timezone</label>
                        <select id="targetTz" data-save>
                        </select>
                    </div>
                    <div>
                        <label for="dateInput" data-de="Datum & Uhrzeit wählen">Select Date &amp; Time</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="datetime-local" id="dateInput" step="1" style="flex: 1; margin-bottom: 0;">
                            <button class="button sm outline" id="setNowBtn" style="flex-shrink: 0; align-self: stretch;" title="Set to current time" data-de="Jetzt" data-de-attr="title:Auf jetzige Zeit setzen">Now</button>
                        </div>
                    </div>

                    <div class="button-group" style="margin-top: 0.5rem;">
                        <button class="button" id="convertToDateBtn" data-de="Umrechnen">Convert</button>
                        <button class="button outline" id="clearTsBtn" data-de="Leeren">Clear</button>
                    </div>
                    <div class="button-group" style="margin-top: 0.5rem;">
                        <button class="button" id="convertToTsBtn" data-de="Zeitstempel holen">Get Timestamp</button>
                        <button class="button outline" id="clearDateBtn" data-de="Leeren">Clear</button>
                    </div>

                    <div class="result-box hidden" id="tsResultBox">
                        <label>GMT / UTC</label>
                        <input type="text" readonly id="resUtc" style="font-family: var(--font-mono); font-size: 0.9rem;" onclick="this.select()">

                        <label data-de="Deine Ortszeit">Your Local Time</label>
                        <input type="text" readonly id="resLocal" style="font-family: var(--font-mono); font-size: 0.9rem;" onclick="this.select()">

                        <label data-de="Gewählte Zeitzone">Selected Timezone</label>
                        <input type="text" readonly id="resZone" style="font-family: var(--font-mono); font-size: 0.9rem; font-weight: bold; color: var(--accent);" onclick="this.select()">

                        <label data-de="Relativ">Relative</label>
                        <p id="resRelative" style="font-family: var(--font-mono); margin-bottom: 0; color: var(--ink-secondary);"></p>
                    </div>
                    <div class="result-box hidden" id="dateResultBox">
                        <label data-de="Unix-Zeitstempel (Sekunden)">Unix Timestamp (Seconds)</label>
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 1rem;">
                            <input type="text" readonly id="resTsSeconds" style="font-family: var(--font-mono); margin-bottom: 0; flex: 1;" onclick="this.select()">
                            <button class="button sm secondary" onclick="copyInput('resTsSeconds')" data-de="Kopieren">Copy</button>
                        </div>

                        <label data-de="Zeitstempel (Millisekunden)">Timestamp (Milliseconds)</label>
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 1rem;">
                            <input type="text" readonly id="resTsMillis" style="font-family: var(--font-mono); margin-bottom: 0; flex: 1;">
                            <button class="button sm secondary" onclick="copyInput('resTsMillis')" data-de="Kopieren">Copy</button>
                        </div>

                        <label data-de="Zeitstempel (Mikrosekunden)">Timestamp (Microseconds)</label>
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 1rem;">
                            <input type="text" readonly id="resTsMicro" style="font-family: var(--font-mono); margin-bottom: 0; flex: 1;">
                            <button class="button sm secondary" onclick="copyInput('resTsMicro')" data-de="Kopieren">Copy</button>
                        </div>

                        <label data-de="Zeitstempel (Nanosekunden)">Timestamp (Nanoseconds)</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="text" readonly id="resTsNano" style="font-family: var(--font-mono); margin-bottom: 0; flex: 1;">
                            <button class="button sm secondary" onclick="copyInput('resTsNano')" data-de="Kopieren">Copy</button>
                        </div>
                    </div>

                </div>
                <style>
                    @media (max-width: 768px) {
                        #converterGrid { grid-template-columns: 1fr !important; }
                    }
                </style>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>
    
    <script>
        dayjs.extend(window.dayjs_plugin_utc);
        dayjs.extend(window.dayjs_plugin_relativeTime);
        dayjs.extend(window.dayjs_plugin_localizedFormat);
        dayjs.extend(window.dayjs_plugin_timezone);

        /* Convenience: pick the string for the current locale. LL_I18N.t
           returns the English string when the site is in English mode
           and the German one when in German mode, without touching state. */
        const T = (en, de) => (window.LL_I18N ? window.LL_I18N.t(en, de) : en);
        /* Native Intl formatters follow LL_I18N. Rebuilt when the locale
           changes so a mid-session switch does not leave stale strings on
           the live clock. */
        function currentIntlLocale() {
            const lang = window.LL_I18N && window.LL_I18N.lang;
            return lang === 'de' ? 'de-DE' : 'en-US';
        }
        /* No hour12 override: German is 24-hour, US English 12-hour with an
           AM/PM. Letting Intl pick per locale gives both the right shape. */
        const clockFormatter = new Intl.DateTimeFormat(currentIntlLocale(), {
            weekday: 'long', year: 'numeric', month: 'short', day: 'numeric',
            hour: 'numeric', minute: '2-digit', second: '2-digit'
        });
        const relativeFormatter = new Intl.RelativeTimeFormat(currentIntlLocale(), { numeric: 'auto' });
        /* Turn "seconds since or until date X" into a locale-aware phrase.
           Picks the coarsest unit that still reads sensibly ("2 hours ago"
           rather than "7200 seconds ago"). */
        function relativeFromMs(msFromNow) {
            const secs = Math.round(msFromNow / 1000);
            const abs = Math.abs(secs);
            if (abs < 60) return relativeFormatter.format(secs, 'second');
            const mins = Math.round(secs / 60);
            if (Math.abs(mins) < 60) return relativeFormatter.format(mins, 'minute');
            const hrs = Math.round(secs / 3600);
            if (Math.abs(hrs) < 24) return relativeFormatter.format(hrs, 'hour');
            const days = Math.round(secs / 86400);
            if (Math.abs(days) < 30) return relativeFormatter.format(days, 'day');
            const months = Math.round(secs / (86400 * 30.44));
            if (Math.abs(months) < 12) return relativeFormatter.format(months, 'month');
            const years = Math.round(secs / (86400 * 365.25));
            return relativeFormatter.format(years, 'year');
        }

        const currentTimestampDisplay = document.getElementById('currentTimestamp');
        const currentHumanTimeDisplay = document.getElementById('currentHumanTime');
        const pauseBtn = document.getElementById('pauseBtn');
        const copyCurrentBtn = document.getElementById('copyCurrentBtn');

        const tsInput = document.getElementById('tsInput');
        const targetTz = document.getElementById('targetTz');
        const tsFormat = document.getElementById('tsFormat');
        const tsFormatFeedback = document.getElementById('tsFormatFeedback');
        const convertToDateBtn = document.getElementById('convertToDateBtn');
        const clearTsBtn = document.getElementById('clearTsBtn');
        const tsResultBox = document.getElementById('tsResultBox');
        const resUtc = document.getElementById('resUtc');
        const resLocal = document.getElementById('resLocal');
        const resZone = document.getElementById('resZone');
        const resRelative = document.getElementById('resRelative');

        const manualTz = document.getElementById('manualTz');
        const nlInput = document.getElementById('nlInput');
        const parseNlBtn = document.getElementById('parseNlBtn');
        const nlFeedback = document.getElementById('nlFeedback');
        const dateInput = document.getElementById('dateInput');
        const setNowBtn = document.getElementById('setNowBtn');
        const convertToTsBtn = document.getElementById('convertToTsBtn');
        const clearDateBtn = document.getElementById('clearDateBtn');
        const dateResultBox = document.getElementById('dateResultBox');
        const resTsSeconds = document.getElementById('resTsSeconds');
        const resTsMillis = document.getElementById('resTsMillis');
        const resTsMicro = document.getElementById('resTsMicro');
        const resTsNano = document.getElementById('resTsNano');

        let isPaused = false;
        let timerInterval;

        const commonTimezones = [
            { name: "UTC (Coordinated Universal Time)", zone: "UTC" },
            { name: "New York (EST/EDT)", zone: "America/New_York" },
            { name: "Los Angeles (PST/PDT)", zone: "America/Los_Angeles" },
            { name: "Chicago (CST/CDT)", zone: "America/Chicago" },
            { name: "London (GMT/BST)", zone: "Europe/London" },
            { name: "Paris (CET/CEST)", zone: "Europe/Paris" },
            { name: "Berlin (CET/CEST)", zone: "Europe/Berlin" },
            { name: "Moscow (MSK)", zone: "Europe/Moscow" },
            { name: "Dubai (GST)", zone: "Asia/Dubai" },
            { name: "Mumbai (IST)", zone: "Asia/Kolkata" },
            { name: "Singapore (SGT)", zone: "Asia/Singapore" },
            { name: "Shanghai (CST)", zone: "Asia/Shanghai" },
            { name: "Tokyo (JST)", zone: "Asia/Tokyo" },
            { name: "Sydney (AEST/AEDT)", zone: "Australia/Sydney" },
            { name: "Auckland (NZST/NZDT)", zone: "Pacific/Auckland" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            populateTimezones();
            startClock();
            setDatePickerToNow();
            
            const userZone = dayjs.tz.guess();
            if (userZone) {
                // Only preselected when the visitor's zone is one of the fifteen
                const exists = Array.from(targetTz.options).some(opt => opt.value === userZone);
                if (exists) targetTz.value = userZone;
            }

            tsInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') convertToDateBtn.click();
            });

            dateInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') convertToTsBtn.click();
            });

            if (nlInput) {
                nlInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') parseNlBtn.click();
                });
            }
        });

        function populateTimezones() {
            commonTimezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz.zone;
                option.textContent = tz.name;
                targetTz.appendChild(option);
            });
        }

        function startClock() {
            updateClock();
            timerInterval = setInterval(updateClock, 1000);
        }

        function updateClock() {
            if (!isPaused) {
                const now = dayjs();
                currentTimestampDisplay.textContent = now.unix();
                currentHumanTimeDisplay.textContent = clockFormatter.format(now.toDate());
            }
        }

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? T('Resume', 'Weiter') : T('Pause', 'Pause');
            pauseBtn.classList.toggle('secondary');
        });

        copyCurrentBtn.addEventListener('click', () => {
            copyToClipboard(currentTimestampDisplay.textContent);
        });

        function setDatePickerToNow() {
            const now = dayjs();
            // datetime-local requires format YYYY-MM-DDTHH:mm:ss
            dateInput.value = now.format('YYYY-MM-DDTHH:mm:ss');
        }

        setNowBtn.addEventListener('click', setDatePickerToNow);

        convertToDateBtn.addEventListener('click', () => {
            const inputVal = tsInput.value.trim();
            const selectedZone = targetTz.value;
            const selectedFormat = tsFormat.value;

            if (!inputVal) {
                showToast(T('Enter a timestamp first', 'Erst einen Zeitstempel eingeben'), 'error');
                return;
            }

            let tsBigInt;
            try {
                tsBigInt = BigInt(inputVal);
            } catch (e) {
                showToast(T('A timestamp is a whole number', 'Ein Zeitstempel ist eine ganze Zahl'), 'error');
                return;
            }

            let format = selectedFormat;
            let strLen = inputVal.replace(/^-/, '').length;

            if (format === 'auto') {
                if (strLen <= 11) format = 's';
                else if (strLen <= 14) format = 'ms';
                else if (strLen <= 17) format = 'us';
                else format = 'ns';

                const formatNames = {
                    's': T('Seconds', 'Sekunden'),
                    'ms': T('Milliseconds', 'Millisekunden'),
                    'us': T('Microseconds', 'Mikrosekunden'),
                    'ns': T('Nanoseconds', 'Nanosekunden')
                };
                tsFormatFeedback.textContent = T(
                    `Auto-detected as ${formatNames[format]}`,
                    `Automatisch als ${formatNames[format]} erkannt`
                );
            } else {
                tsFormatFeedback.textContent = '';
            }

            // Convert everything to milliseconds for Day.js
            let dayObj;
            let msValue;

            if (format === 's') {
                msValue = Number(tsBigInt) * 1000;
            } else if (format === 'ms') {
                msValue = Number(tsBigInt);
            } else if (format === 'us') {
                msValue = Number(tsBigInt / 1000n);
            } else if (format === 'ns') {
                msValue = Number(tsBigInt / 1000000n);
            }

            dayObj = dayjs(msValue);

            if (!dayObj.isValid()) {
                showToast(T('That timestamp is out of the range a date can show',
                            'Dieser Zeitstempel liegt außerhalb dessen, was ein Datum zeigen kann'), 'error');
                return;
            }

            resUtc.value = dayObj.utc().format('YYYY-MM-DD HH:mm:ss [UTC]');
            resLocal.value = dayObj.format('YYYY-MM-DD HH:mm:ss Z');

            resZone.value = dayObj.tz(selectedZone).format('YYYY-MM-DD HH:mm:ss Z');

            /* dayjs' relativeTime plugin only knows English. Intl on the other
               hand goes as a native and does not need vendoring. */
            resRelative.textContent = relativeFromMs(dayObj.valueOf() - Date.now());

            tsResultBox.classList.remove('hidden');
        });

        clearTsBtn.addEventListener('click', () => {
            tsInput.value = '';
            tsFormatFeedback.textContent = '';
            tsResultBox.classList.add('hidden');
        });

        convertToTsBtn.addEventListener('click', () => {
            const dateVal = dateInput.value;
            const tzMode = manualTz.value;

            if (!dateVal) {
                showToast(T('Pick a date first', 'Erst ein Datum wählen'), 'error');
                return;
            }

            let dayObj;
            if (tzMode === 'utc') {
                dayObj = dayjs.utc(dateVal);
            } else {
                dayObj = dayjs(dateVal);
            }

            if (!dayObj.isValid()) {
                showToast(T('That is not a valid date', 'Das ist kein gültiges Datum'), 'error');
                return;
            }

            resTsSeconds.value = dayObj.unix();
            resTsMillis.value = dayObj.valueOf();
            
            // BigInt: nanoseconds since 1970 are past 2^53, where a Number
            // starts rounding the last digits
            resTsMicro.value = BigInt(dayObj.valueOf()) * 1000n;
            resTsNano.value = BigInt(dayObj.valueOf()) * 1000000n;

            dateResultBox.classList.remove('hidden');
        });

        clearDateBtn.addEventListener('click', () => {
            dateInput.value = '';
            if (nlInput) nlInput.value = '';
            if (nlFeedback) nlFeedback.textContent = '';
            dateResultBox.classList.add('hidden');
        });

        parseNlBtn.addEventListener('click', async () => {
            const text = nlInput.value.trim();
            if (!text) {
                nlFeedback.textContent = T('Type a date first', 'Erst ein Datum tippen');
                return;
            }

            parseNlBtn.textContent = '...';
            parseNlBtn.disabled = true;

            try {
                // Imported only when someone uses this field, so opening the page
                // makes no request to jsDelivr.
                const chronoModule = await import('https://cdn.jsdelivr.net/npm/chrono-node@2.7.7/+esm');
                const parsedDate = chronoModule.parseDate(text);

                if (parsedDate) {
                    nlFeedback.textContent = T('Found a date', 'Datum gefunden');
                    nlFeedback.style.color = "var(--success, #2e7d32)";

                    dateInput.value = dayjs(parsedDate).format('YYYY-MM-DDTHH:mm:ss');
                    manualTz.value = 'local'; // chrono returns local time unless the text names a zone
                    convertToTsBtn.click();
                } else {
                    nlFeedback.textContent = T('No date found in that', 'Darin steckt kein Datum');
                    nlFeedback.style.color = "var(--accent)";
                }
            } catch (err) {
                console.error('Could not load chrono-node', err);
                nlFeedback.textContent = T(
                    'Could not load the parser from jsDelivr. This field needs a connection.',
                    'Der Parser ließ sich nicht von jsDelivr laden. Dieses Feld braucht eine Verbindung.');
                nlFeedback.style.color = "var(--accent)";
            } finally {
                parseNlBtn.textContent = T('Parse', 'Auslesen');
                parseNlBtn.disabled = false;
            }
        });

        window.copyInput = function(elementId) {
            const val = document.getElementById(elementId).value;
            copyToClipboard(val);
        };
    </script>
</body>
</html>
