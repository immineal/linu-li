<!DOCTYPE html>
<html lang="en" data-status="archiv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Watermarker | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    
    <script src="../../assets/vendor/pdf-lib.min.js"></script>
    <script src="../../assets/js/pdfjs.js"></script>
    <script src="../../assets/vendor/jszip.min.js"></script>

    <style>
        .preview-wrapper {
            position: relative;
            width: 100%;
            background: var(--code-bg);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 400px;
            user-select: none;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            line-height: 0;
        }

        #pdfPreviewCanvas {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .watermark-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            cursor: grab;
            white-space: nowrap;
            font-family: Helvetica, sans-serif;
            font-weight: bold;
            line-height: 1;
            /* pdf-lib rotates text about its bottom-left corner */
            transform-origin: 0% 100%;
            border: 2px dashed rgba(196, 77, 60, 0.5);
            z-index: 10;
            padding: 0 4px; /* a little more to grab than the letters alone */
        }

        .watermark-overlay:active {
            cursor: grabbing;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1>PDF Watermarker</h1>
                <p>Stamps a line of text on every page of one or more PDFs. Drag the text on the preview to place it.</p>
            </div>

            <div class="card">
                
                <div class="drop-zone" id="dropZone">
                    <p>Drop PDFs here</p>
                    <input type="file" id="fileInput" class="hidden" accept="application/pdf" multiple>
                </div>

                <div id="editorArea" class="hidden">
                    
                    <div class="preview-wrapper">
                        <div class="canvas-container" id="canvasContainer">
                            <canvas id="pdfPreviewCanvas"></canvas>
                            <div id="watermarkOverlay" class="watermark-overlay">CONFIDENTIAL</div>
                        </div>
                    </div>

                    <div class="split-view">
                        <div>
                            <label>Watermark Text</label>
                            <input type="text" id="watermarkText" value="CONFIDENTIAL">
                        </div>
                        <div>
                            <label>Color</label>
                            <select id="watermarkColor" data-save>
                                <option value="0.76, 0.3, 0.23">Red</option>
                                <option value="0.42, 0.56, 0.5">Green</option>
                                <option value="0.6, 0.6, 0.6" selected>Grey</option>
                                <option value="0, 0, 0">Black</option>
                                <option value="0.9, 0.9, 0.9">Light grey</option>
                            </select>
                        </div>
                    </div>

                    <div class="split-view">
                        <div>
                            <label>Opacity: <span id="opacityValue">0.5</span></label>
                            <input type="range" id="opacityRange" min="0.1" max="1" step="0.1" value="0.5">
                        </div>
                        <div>
                            <label>Size (pt): <span id="sizeValue">60</span></label>
                            <input type="range" id="fontSize" min="10" max="300" step="5" value="60">
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 2rem;">
                        <label>Rotation: <span id="rotValue">45</span>°</label>
                        <input type="range" id="rotRange" min="-180" max="180" step="5" value="45">
                    </div>

                </div>

                <div class="button-group">
                    <button class="button" id="processBtn" disabled>Apply watermark</button>
                    <button class="button outline" id="clearBtn">Reset</button>
                </div>

                <div class="result-box hidden" id="resultBox">
                    <p style="margin-bottom: 1rem; text-align: center;">Watermark applied.</p>
                    <div style="display: flex; justify-content: center;">
                        <a id="downloadLink" class="button secondary" download="watermarked.pdf">Download PDF</a>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/layout.js"></script>
    
    <script>

        const { PDFDocument, rgb, degrees, StandardFonts } = PDFLib;

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const editorArea = document.getElementById('editorArea');
        const processBtn = document.getElementById('processBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultBox = document.getElementById('resultBox');
        const downloadLink = document.getElementById('downloadLink');

        const canvas = document.getElementById('pdfPreviewCanvas');
        const overlay = document.getElementById('watermarkOverlay');
        const canvasContainer = document.getElementById('canvasContainer');

        const txtInput = document.getElementById('watermarkText');
        const colInput = document.getElementById('watermarkColor');
        const opRange = document.getElementById('opacityRange');
        const opVal = document.getElementById('opacityValue');
        const szRange = document.getElementById('fontSize');
        const szVal = document.getElementById('sizeValue');
        const rotRange = document.getElementById('rotRange');
        const rotVal = document.getElementById('rotValue');

        let currentFiles = [];
        let generatedPdfUrl = null;

        // Position as a fraction of the page, so it carries over to pages of other sizes
        let posX = 0.3;
        let posY = 0.5;

        // Screen pixels per PDF point in the preview
        let renderScaleRatio = 1;

        opRange.addEventListener('input', updateVisuals);
        szRange.addEventListener('input', updateVisuals);
        rotRange.addEventListener('input', updateVisuals);
        txtInput.addEventListener('input', updateVisuals);
        colInput.addEventListener('change', updateVisuals);

        function updateVisuals() {
            opVal.textContent = opRange.value;
            szVal.textContent = szRange.value;
            rotVal.textContent = rotRange.value;

            overlay.textContent = txtInput.value || "CONFIDENTIAL";
            overlay.style.opacity = opRange.value;

            // The size is in PDF points; scale it so the preview matches the page
            const visualSize = parseInt(szRange.value) * renderScaleRatio;
            overlay.style.fontSize = `${visualSize}px`;

            // CSS turns clockwise, pdf-lib counter-clockwise
            overlay.style.transform = `rotate(${rotRange.value * -1}deg)`;

            const rgbStr = colInput.value.split(',').map(n => Math.floor(parseFloat(n) * 255));
            overlay.style.color = `rgb(${rgbStr.join(',')})`;
        }

        setupDropZone(dropZone, fileInput, handleFiles);

        async function handleFiles(files) {
            if (files.length === 0) return;
            const validFiles = Array.from(files).filter(f => f.type === 'application/pdf');

            if (validFiles.length === 0) {
                showToast('None of those files is a PDF.', 'error');
                return;
            }

            currentFiles = validFiles;
            dropZone.classList.add('hidden');
            editorArea.classList.remove('hidden');
            processBtn.disabled = false;

            if (currentFiles.length > 1) {
                showToast(`${currentFiles.length} PDFs loaded. The preview shows the first.`, 'info');
            }

            await renderPreview(currentFiles[0]);
            initDraggable();
        }

        async function renderPreview(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await (await pdfOeffnen({ data: new Uint8Array(arrayBuffer) })).promise;
            const page = await pdf.getPage(1);

            const unscaledViewport = page.getViewport({ scale: 1 });

            const desiredWidth = Math.min(800, window.innerWidth - 60);
            const scale = desiredWidth / unscaledViewport.width;

            renderScaleRatio = scale;

            const scaledViewport = page.getViewport({ scale: scale });
            canvas.width = scaledViewport.width;
            canvas.height = scaledViewport.height;

            const ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;

            overlay.style.left = (canvas.width * posX) + 'px';
            overlay.style.top = (canvas.height * posY) + 'px';

            // The font size depends on renderScaleRatio, which only now is known
            updateVisuals();
        }

        function initDraggable() {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            const onMouseDown = (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = overlay.offsetLeft;
                initialTop = overlay.offsetTop;
                
                overlay.style.cursor = 'grabbing';

                // On the document, so a fast drag that leaves the overlay is not lost
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };

            const onMouseMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                let newLeft = initialLeft + dx;
                let newTop = initialTop + dy;

                newLeft = Math.max(-50, Math.min(newLeft, canvas.width + 50));
                newTop = Math.max(-50, Math.min(newTop, canvas.height + 50));

                overlay.style.left = `${newLeft}px`;
                overlay.style.top = `${newTop}px`;

                posX = newLeft / canvas.width;
                posY = newTop / canvas.height;
            };

            const onMouseUp = () => {
                isDragging = false;
                overlay.style.cursor = 'grab';
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };

            overlay.addEventListener('mousedown', onMouseDown);
            overlay.addEventListener('touchstart', (e) => {
                e.preventDefault(); // otherwise the page scrolls instead
                onMouseDown(e.touches[0]);
            }, { passive: false });
        }

        async function processPdf(file, text, fontSize, opacity, angle, color) {
            const arrayBuffer = await file.arrayBuffer();
            let pdfDoc;
            try {
                pdfDoc = await PDFDocument.load(arrayBuffer);
            } catch (err) {
                if (/encrypted/i.test(err.message)) throw new Error(`"${file.name}" is encrypted. Even when it opens without a password, its contents stay locked, and this tool cannot unlock them. It leaves the file alone rather than make pages nobody can read.`);
                throw err;
            }
            const helveticaFont = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

            const pages = pdfDoc.getPages();

            pages.forEach(page => {
                const { width, height } = page.getSize();

                const pdfX = width * posX;
                // PDF counts y from the bottom, the screen from the top
                const pdfY = height - (height * posY);

                page.drawText(text, {
                    x: pdfX,
                    y: pdfY,
                    size: fontSize,
                    font: helveticaFont,
                    color: color,
                    opacity: opacity,
                    rotate: degrees(angle),
                });
            });

            return await pdfDoc.save();
        }

        processBtn.addEventListener('click', async () => {
            if (currentFiles.length === 0) return;
            processBtn.disabled = true;
            processBtn.textContent = 'Working...';

            try {
                const text = txtInput.value || 'CONFIDENTIAL';
                const fontSize = parseInt(szRange.value);
                const opacity = parseFloat(opRange.value);
                const angle = parseInt(rotRange.value);
                
                const colorVals = colInput.value.split(',').map(Number);
                const color = rgb(colorVals[0], colorVals[1], colorVals[2]);

                if (currentFiles.length === 1) {
                    const pdfBytes = await processPdf(currentFiles[0], text, fontSize, opacity, angle, color);
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    
                    if (generatedPdfUrl) URL.revokeObjectURL(generatedPdfUrl);
                    generatedPdfUrl = URL.createObjectURL(blob);
                    
                    downloadLink.href = generatedPdfUrl;
                    downloadLink.download = `watermarked-${currentFiles[0].name}`;
                } else {
                    const zip = new JSZip();
                    for (let i = 0; i < currentFiles.length; i++) {
                        const file = currentFiles[i];
                        const pdfBytes = await processPdf(file, text, fontSize, opacity, angle, color);
                        zip.file(`watermarked-${file.name}`, pdfBytes);
                    }
                    const zipBlob = await zip.generateAsync({ type: 'blob' });

                    if (generatedPdfUrl) URL.revokeObjectURL(generatedPdfUrl);
                    generatedPdfUrl = URL.createObjectURL(zipBlob);

                    downloadLink.href = generatedPdfUrl;
                    downloadLink.download = 'watermarked-pdfs.zip';
                }
                
                resultBox.classList.remove('hidden');
                resultBox.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                console.error(err);
                showToast('Could not apply the watermark: ' + err.message, 'error');
            } finally {
                processBtn.disabled = false;
                processBtn.textContent = 'Apply watermark';
            }
        });

        clearBtn.addEventListener('click', () => {
            currentFiles = [];
            fileInput.value = '';
            editorArea.classList.add('hidden');
            resultBox.classList.add('hidden');
            dropZone.classList.remove('hidden');
            if (generatedPdfUrl) URL.revokeObjectURL(generatedPdfUrl);
        });

    
    /* Hält dieses Werkzeug gerade etwas, das ein Neuladen vernichtet?
       Gefragt wird beim Druck auf "Neu laden" im Update-Hinweis
       (assets/js/layout.js). Wer sich nicht meldet, gilt als leer —
       tests/test-arbeit-haken.js besteht darauf, dass jedes Werkzeug mit
       Datei-Eingabe sich meldet. */
    window.llHaeltArbeit = () => currentFiles.length > 0;
    </script>
</body>
</html>
