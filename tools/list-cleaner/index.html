<!DOCTYPE html>
<html lang="en" data-status="archiv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="Listenreiniger & Sortierer | Linus Linhof">List Cleaner & Sorter | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1 data-de="Listenreiniger">List Cleaner</h1>
                <p data-de="Sortiert eine Liste, entfernt Duplikate und Leerzeilen, mischt sie, oder setzt denselben Text vor oder hinter jede Zeile.">Sorts a list, removes duplicates and empty lines, shuffles it, or puts the same text before or after every line.</p>
            </div>

            <div class="split-view">
                
                <div class="card" style="display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <label for="listInput" style="margin: 0;" data-de="Eingabeliste">Input List</label>
                        <span id="inputCount" style="font-size: 0.8rem; color: var(--ink-secondary);">0 lines</span>
                    </div>
                    <textarea id="listInput" class="code-editor" style="flex-grow: 1; min-height: 400px;" placeholder="Paste a list, one item per line" data-de-attr="placeholder:Liste einfügen, ein Eintrag pro Zeile"></textarea>
                </div>

                <div class="card">
                    <label data-de="Aktionen">Actions</label>
                    <div class="button-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem;">
                        <button class="button outline" onclick="processList('sortAZ')" data-de="A → Z sortieren">Sort A → Z</button>
                        <button class="button outline" onclick="processList('sortZA')" data-de="Z → A sortieren">Sort Z → A</button>
                        <button class="button outline" onclick="processList('reverse')" data-de="Reihenfolge umkehren">Reverse Order</button>
                        <button class="button outline" onclick="processList('random')" data-de="Mischen">Randomize</button>
                        <button class="button outline" onclick="processList('dedup')" data-de="Duplikate entfernen">Remove Duplicates</button>
                        <button class="button outline" onclick="processList('dedupInsensitive')" data-de="Duplikate ohne Groß/Klein">Dedup (Case Insensitive)</button>
                        <button class="button outline" onclick="processList('trim')" data-de="Leerzeichen kürzen">Trim Whitespace</button>
                        <button class="button outline" onclick="processList('empty')" data-de="Leerzeilen entfernen">Remove Empty Lines</button>
                    </div>

                    <div style="border-top: 1px solid var(--border); padding-top: 1rem; margin-bottom: 1.5rem;">
                        <label data-de="Einträge dekorieren">Decorate Items</label>
                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                            <input type="text" id="prefixInput" placeholder="Prefix (start)" style="margin-bottom: 0;" data-de-attr="placeholder:Präfix (Anfang)">
                            <input type="text" id="suffixInput" placeholder="Suffix (end)" style="margin-bottom: 0;" data-de-attr="placeholder:Suffix (Ende)">
                        </div>
                        <button class="button outline" style="width: 100%;" onclick="processList('decorate')" data-de="Präfix/Suffix anwenden">Apply Prefix/Suffix</button>
                    </div>

                    <div style="border-top: 1px solid var(--border); padding-top: 1rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <label style="margin: 0;" data-de="Ergebnis">Result</label>
                            <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                                <span id="outputCount" style="font-size: 0.8rem; color: var(--ink-secondary);">0 lines</span>
                                <button class="button sm outline" onclick="useAsInput()" data-de="↑ Als Eingabe">↑ Use as input</button>
                                <button class="button sm secondary" onclick="copyResult()" data-de="Kopieren">Copy</button>
                            </div>
                        </div>
                        <textarea id="listOutput" class="code-editor" style="min-height: 200px; background: var(--paper);" readonly></textarea>
                    </div>
                </div>
            </div>

        </div>
    </main>
    
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script>
        const listInput = document.getElementById('listInput');
        const listOutput = document.getElementById('listOutput');
        const inputCount = document.getElementById('inputCount');
        const outputCount = document.getElementById('outputCount');
        const prefixInput = document.getElementById('prefixInput');
        const suffixInput = document.getElementById('suffixInput');

        let inputTimeout;
        listInput.addEventListener('input', () => {
            clearTimeout(inputTimeout);
            inputTimeout = setTimeout(() => {
                const val = listInput.value;
                const lines = val === '' ? 0 : (val.match(/\n/g) || []).length + 1;
                inputCount.textContent = `${lines} line${lines !== 1 ? 's' : ''}`;
            }, 100);
        });

        function processList(action) {
            let raw = listInput.value;
            if (!raw) {
                listOutput.value = '';
                outputCount.textContent = '0 lines';
                return;
            }

            let items = raw.split('\n');

            switch(action) {
                case 'sortAZ':
                    items.sort((a, b) => a.localeCompare(b));
                    break;
                case 'sortZA':
                    items.sort((a, b) => b.localeCompare(a));
                    break;
                case 'reverse':
                    items.reverse();
                    break;
                case 'random':
                    for (let i = items.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [items[i], items[j]] = [items[j], items[i]];
                    }
                    break;
                case 'dedup':
                    // A Set keeps the first occurrence, so the order stays as it was.
                    items = [...new Set(items)];
                    break;
                case 'dedupInsensitive':
                    const seen = new Set();
                    items = items.filter(item => {
                        const lower = item.toLowerCase();
                        if (seen.has(lower)) return false;
                        seen.add(lower);
                        return true;
                    });
                    break;
                case 'trim':
                    items = items.map(item => item.trim());
                    break;
                case 'empty':
                    items = items.filter(item => item.trim() !== '');
                    break;
                case 'decorate':
                    const pre = prefixInput.value || '';
                    const suf = suffixInput.value || '';
                    items = items.map(item => `${pre}${item}${suf}`);
                    break;
            }

            const result = items.join('\n');
            listOutput.value = result;
            
            const outLines = result === '' ? 0 : items.length;
            outputCount.textContent = `${outLines} line${outLines !== 1 ? 's' : ''}`;
            
            listOutput.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function copyResult() {
            copyToClipboard(listOutput.value);
        }

        /* Chain operations: pipe the current result back into the input box
           so the next click (sort, dedup, prefix, …) works on top of the
           previous one. Without this, every button read from the untouched
           original and combining operations meant copy-paste by hand. */
        function useAsInput() {
            if (!listOutput.value) return;
            listInput.value = listOutput.value;
            const lines = listOutput.value.split('\n').filter((l) => l.trim() !== '').length;
            inputCount.textContent = `${lines} line${lines !== 1 ? 's' : ''}`;
            listInput.dispatchEvent(new Event('input', { bubbles: true }));
            listInput.focus();
        }
    
    /* Is this tool holding something right now that a reload would throw
       away? The question is asked when someone clicks "Reload" in the
       update notice (assets/js/layout.js). A tool that stays quiet counts
       as empty. tests/test-holds-work.js insists that every tool with a
       file input speaks up. */
    window.llHoldsWork = () => listInput.value.trim() !== '';
    </script>
</body>
</html>
