<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="Markdown-Vorschau | Linus Linhof">Markdown Previewer | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    
    <script src="../../assets/vendor/marked.min.js"></script>
    <script src="../../assets/vendor/purify.min.js"></script>
    <script src="../../assets/vendor/mermaid.min.js"></script>

    <style>
        .markdown-body {
            background: var(--card-bg);
            padding: 2rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            height: 100%;
            min-height: 500px;
            overflow-y: auto;
            font-family: var(--font-body);
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { border-bottom: 1px solid var(--border); padding-bottom: 0.3em; margin-top: 1.5em; }
        .markdown-body h1:first-child { margin-top: 0; }
        .markdown-body blockquote { border-left: 4px solid var(--accent); padding-left: 1rem; color: var(--ink-secondary); margin: 1rem 0; }
        .markdown-body code { background: var(--code-bg); padding: 0.2rem 0.4rem; border-radius: 3px; font-family: var(--font-mono); font-size: 0.85em; }
        .markdown-body pre { background: var(--code-bg); padding: 1rem; overflow-x: auto; border-radius: 4px; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body ul, .markdown-body ol { padding-left: 2rem; margin-bottom: 1rem; }
        .markdown-body img { max-width: 100%; }
        .markdown-body hr { border: 0; border-top: 2px solid var(--border); margin: 2rem 0; }

        .editor-pane { display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <main>
        <div class="container" style="max-width: 1400px;">
            <div class="tool-header">
                <h1 data-de="Markdown-Vorschau">Markdown Previewer</h1>
                <p data-de="Links Markdown schreiben, rechts das gerenderte HTML sehen.">Write Markdown on the left, see the rendered HTML on the right.</p>
            </div>

            <div class="split-view" style="grid-template-columns: 1fr 1fr; align-items: stretch;">
                
                <div class="editor-pane">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <label for="mdInput" data-de="Markdown-Eingabe">Markdown Input</label>
                        <button class="button sm outline" id="clearBtn" data-de="Leeren">Clear</button>
                    </div>
                    <textarea id="mdInput" class="code-editor" style="flex-grow: 1; min-height: 600px; font-size: 0.9rem;" placeholder="# A heading&#10;&#10;Some **Markdown**"></textarea>
                </div>

                <div class="editor-pane">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <label data-de="Live-Vorschau">Live Preview</label>
                        <button class="button sm secondary" id="copyHtmlBtn" data-de="HTML kopieren">Copy HTML</button>
                    </div>
                    <div id="preview" class="markdown-body"></div>
                </div>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script>
        const mdInput = document.getElementById('mdInput');
        const preview = document.getElementById('preview');
        const clearBtn = document.getElementById('clearBtn');
        const copyHtmlBtn = document.getElementById('copyHtmlBtn');

        const defaultText = `# Markdown

Type on the left and the preview follows.

## What renders
- **Bold** and *italic* text
- [Links](https://immineal.com)
- Code blocks:
\`\`\`javascript
console.log('Hello World');
\`\`\`

- Mermaid diagrams:
\`\`\`mermaid
graph TD;
    A[Markdown] --> B{Parse};
    B --> C[HTML Preview];
    B --> D[Mermaid Graph];
\`\`\`

> Raw HTML works too, but scripts and event handlers are stripped before it is shown.`;

        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({ startOnLoad: false, theme: 'default' });
        }

        let renderTimeout;
        function render(immediate = false) {
            clearTimeout(renderTimeout);

            const process = async () => {
                const text = mdInput.value;
                try {
                    // marked passes raw HTML straight through, so the result
                    // goes through DOMPurify before it touches the page.
                    const rawHtml = marked.parse(text);
                    const cleanHtml = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target'] }) : "The preview is off because DOMPurify did not load.";
                    preview.innerHTML = cleanHtml;

                    // marked turns ```mermaid into an ordinary code block;
                    // Mermaid wants the source in a div.mermaid instead.
                    if (typeof mermaid !== 'undefined') {
                        const mermaidBlocks = preview.querySelectorAll('code.language-mermaid');
                        mermaidBlocks.forEach(block => {
                            const pre = block.parentElement;
                            if (pre && pre.tagName === 'PRE') {
                                const div = document.createElement('div');
                                div.className = 'mermaid';
                                div.textContent = block.textContent;
                                pre.replaceWith(div);
                            }
                        });

                        try {
                            await mermaid.run({ querySelector: '.mermaid' });
                        } catch (mermaidErr) {
                            console.error('Mermaid could not draw a diagram:', mermaidErr);
                        }
                    }
                } catch (err) {
                    console.error('Markdown could not be rendered:', err);
                    preview.innerHTML = "";
                    const errorP = document.createElement("p");
                    errorP.style.color = "red";
                    errorP.textContent = "This Markdown could not be rendered.";
                    preview.appendChild(errorP);
                }
            };

            if (immediate) {
                process();
            } else {
                renderTimeout = setTimeout(process, 300);
            }
        }

        mdInput.addEventListener('input', () => render(false));

        // Each pane follows the other's scroll position. The flags stop the
        // scroll event this sets off in the other pane from echoing back.
        let isSyncingLeftScroll = false;
        let isSyncingRightScroll = false;

        mdInput.addEventListener('scroll', function(e) {
            if (!isSyncingLeftScroll) {
                isSyncingRightScroll = true;
                const percentage = this.scrollTop / (this.scrollHeight - this.clientHeight);
                preview.scrollTop = percentage * (preview.scrollHeight - preview.clientHeight);
            }
            isSyncingLeftScroll = false;
        });

        preview.addEventListener('scroll', function(e) {
            if (!isSyncingRightScroll) {
                isSyncingLeftScroll = true;
                const percentage = this.scrollTop / (this.scrollHeight - this.clientHeight);
                mdInput.scrollTop = percentage * (mdInput.scrollHeight - mdInput.clientHeight);
            }
            isSyncingRightScroll = false;
        });

        mdInput.value = defaultText;
        render(true);

        clearBtn.addEventListener('click', () => {
            mdInput.value = '';
            render(true);
            mdInput.focus();
        });

        copyHtmlBtn.addEventListener('click', () => {
            const html = preview.innerHTML;
            copyToClipboard(html);
        });
    
    /* Is this tool holding something right now that a reload would throw
       away? The question is asked when someone clicks "Reload" in the
       update notice (assets/js/layout.js). A tool that stays quiet counts
       as empty. tests/test-holds-work.js insists that every tool with a
       file input speaks up. */
    const llStart = mdInput.value;
    window.llHoldsWork = () => mdInput.value.trim() !== '' && mdInput.value !== llStart;
    </script>
</body>
</html>
