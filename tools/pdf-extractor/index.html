<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="PDF-Bildextraktor | Linus Linhof">PDF Image Extractor | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    
    <script src="../../assets/vendor/jszip.min.js"></script>
    <script src="../../assets/vendor/FileSaver.min.js"></script>
    <script src="../../assets/js/pdfjs.js"></script>
    
    <style>
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .image-card {
            border: 1px solid var(--border);
            background: var(--input-bg);
            border-radius: 4px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }
        .image-card:hover {
            border-color: var(--accent);
        }
        .image-preview {
            width: 100%;
            height: 120px;
            object-fit: contain;
            background-color: #fff; /* transparent PNGs would vanish on a dark card */
            border-radius: 2px;
            margin-bottom: 0.5rem;
        }
        .image-meta {
            font-size: 0.75rem;
            color: var(--ink-secondary);
            text-align: center;
            font-family: var(--font-mono);
            margin-bottom: 0.5rem;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1 data-de="PDF-Bildextraktor">PDF Image Extractor</h1>
                <p data-de="Holt die Bilder, Texte und Schriften aus einer PDF, Seite für Seite.">Pulls out the images, text and fonts embedded in a PDF, page by page.</p>
            </div>

            <div class="card">
                
                <div class="drop-zone" id="dropZone">
                    <p data-de="PDF hier ablegen">Drop a PDF here</p>
                    <p style="font-size: 0.85rem; opacity: 0.7;" data-de="Bilder kommen als PNG raus, Text als eine Datei pro Seite">Images come out as PNG, text as one file per page</p>
                    <input type="file" id="fileInput" class="hidden" accept="application/pdf">
                </div>
                
                <ul class="file-list" id="fileList"></ul>

                <div class="hidden" id="controlPanel">
                    <div style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="extractImagesCb" checked> <span data-de="Bilder">Images</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="extractTextCb" checked> <span data-de="Text">Text</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="extractFontsCb" checked> <span data-de="Schriften">Fonts</span>
                        </label>
                    </div>
                    <div class="button-group">
                        <button class="button" id="processBtn" data-de="Herausholen">Extract</button>
                        <button class="button outline" id="resetBtn" data-de="Zurücksetzen">Reset</button>
                    </div>
                </div>

                <div class="progress-container" id="progressContainer">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <p id="statusText" style="text-align: center; font-size: 0.9rem; margin-top: 0.5rem; display: none;"></p>

                <div class="result-box hidden" id="resultBox">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <h3><span data-de="Herausgeholt">Extracted</span> <span id="imgCount" style="font-weight: normal; font-size: 0.9rem; color: var(--ink-secondary);"></span></h3>
                        <button class="button secondary sm" id="downloadAllBtn" data-de="Alle herunterladen (.zip)">Download All (.zip)</button>
                    </div>
                    
                    <div class="image-grid" id="imageGrid"></div>
                </div>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>
    
    <script>

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const controlPanel = document.getElementById('controlPanel');
        const processBtn = document.getElementById('processBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const resultBox = document.getElementById('resultBox');
        const imageGrid = document.getElementById('imageGrid');
        const imgCount = document.getElementById('imgCount');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        let currentFile = null;
        let extractedImages = [];
        let extractedTexts = [];
        let extractedFonts = [];
        /* Bumped on every Reset. Every await inside a run checks its own
           captured token against this counter so a Reset mid-extract stops
           the loop, drops its result, and skips the "Extracted…" toast. */
        let runToken = 0;
        let currentPdf = null;

        setupDropZone(dropZone, fileInput, handleFileSelection);

        function handleFileSelection(files) {
            if (files.length === 0) return;
            
            const file = files[0];
            if (file.type !== 'application/pdf') {
                showToast('That is not a PDF.', 'error');
                return;
            }

            currentFile = file;

            fileList.innerHTML = `
                <li class="file-item">
                    <div class="file-info">
                        <div>
                            <div class="file-name"></div>
                            <div class="file-size">${formatFileSize(file.size)}</div>
                        </div>
                    </div>
                    <button class="remove-file" aria-label="Remove file" onclick="resetTool()">×</button>
                </li>
            `;
            fileList.querySelector('.file-name').textContent = file.name;
            
            dropZone.classList.add('hidden');
            controlPanel.classList.remove('hidden');
            resultBox.classList.add('hidden');
        }

        processBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            const token = ++runToken;
            processBtn.disabled = true;
            progressContainer.style.display = 'block';
            statusText.style.display = 'block';
            statusText.textContent = 'Opening PDF...';
            progressBar.style.width = '5%';
            imageGrid.innerHTML = '';
            extractedImages = [];
            extractedTexts = [];
            extractedFonts = [];
            /* An image or font resource stays in the operator list on every
               page that paints it. Asking pdf.js for the same imgName again
               after it already refused (a 10s timeout) would stall the whole
               loop on every page. Track what we've asked for and skip it. */
            const seenImgNames = new Set();

            const doImages = document.getElementById('extractImagesCb').checked;
            const doText = document.getElementById('extractTextCb').checked;
            const doFonts = document.getElementById('extractFontsCb').checked;

            if (!doImages && !doText && !doFonts) {
                showToast('Tick at least one of images, text or fonts.', 'error');
                processBtn.disabled = false;
                progressContainer.style.display = 'none';
                statusText.style.display = 'none';
                return;
            }

            try {
                const arrayBuffer = await currentFile.arrayBuffer();
                if (token !== runToken) return;
                // Without fontExtraProperties pdf.js drops a font's bytes once the browser has loaded it
                const loadingTask = await pdfOeffnen({ data: new Uint8Array(arrayBuffer), fontExtraProperties: true });
                const pdf = await loadingTask.promise;
                if (token !== runToken) { try { loadingTask.destroy(); } catch (e) {} return; }
                currentPdf = pdf;

                const numPages = pdf.numPages;
                let imagesFoundTotal = 0;
                let textFoundTotal = 0;
                let fontsFoundTotal = 0;
                let processedFonts = new Set(); // a font is set again on every page that uses it

                const documentFragment = document.createDocumentFragment();

                for (let i = 1; i <= numPages; i++) {
                    if (token !== runToken) break;
                    // Let the progress bar repaint on long documents
                    if (i % 5 === 0) {
                        await new Promise(r => setTimeout(r, 0));
                    }
                    if (token !== runToken) break;

                    const percent = Math.round((i / numPages) * 100);
                    progressBar.style.width = `${percent}%`;
                    statusText.textContent = `Scanning page ${i} of ${numPages}...`;

                    let page = null;
                    try {
                        page = await pdf.getPage(i);
                        
                        if (doText) {
                            try {
                                const textContent = await page.getTextContent();
                                if (textContent && textContent.items && textContent.items.length > 0) {
                                    const pageText = textContent.items.map(item => item.str).join('\n');
                                    if (pageText.trim()) {
                                        const blob = new Blob([pageText], { type: 'text/plain' });
                                        const filename = `text_p${i}.txt`;
                                        const txtObj = {
                                            blob: blob,
                                            filename: filename,
                                            url: URL.createObjectURL(blob),
                                            preview: pageText.substring(0, 100) + (pageText.length > 100 ? '...' : '')
                                        };
                                        extractedTexts.push(txtObj);
                                        documentFragment.appendChild(createCardForText(txtObj));
                                        textFoundTotal++;
                                    }
                                }
                            } catch (txtErr) {
                                console.warn(`Failed to extract text on page ${i}`, txtErr);
                            }
                        }

                        if (doImages || doFonts) {
                            const operatorList = await page.getOperatorList();
                            
                            const validImgOperators = [
                                pdfjsLib.OPS.paintImageXObject,
                                pdfjsLib.OPS.paintInlineImageXObject
                            ];

                            for (let j = 0; j < operatorList.fnArray.length; j++) {
                                const op = operatorList.fnArray[j];
                                
                                if (doImages && validImgOperators.includes(op)) {
                                    const imgName = operatorList.argsArray[j][0];
                                    if (typeof imgName === 'string') {
                                        if (seenImgNames.has(imgName)) continue;
                                        seenImgNames.add(imgName);
                                    }
                                    try {
                                        // An inline image comes along in the list itself
                                        const imageObj = typeof imgName === 'string' ? await bekommen(page.objs, imgName) : imgName;
                                        if (token !== runToken) break;
                                        if (imageObj) {
                                            const processedImg = await processPdfImage(imageObj, i, imagesFoundTotal + 1);
                                            if (processedImg) {
                                                extractedImages.push(processedImg);
                                                documentFragment.appendChild(createCardForImage(processedImg));
                                                imagesFoundTotal++;
                                            }
                                        }
                                    } catch (imgErr) {
                                        console.warn(`Failed to extract image ${imgName} on page ${i}`, imgErr);
                                    }
                                }

                                if (doFonts && op === pdfjsLib.OPS.setFont) {
                                    const fontName = operatorList.argsArray[j][0];
                                    if (!processedFonts.has(fontName)) {
                                        processedFonts.add(fontName);
                                        try {
                                            const fontObj = await bekommen(fontName.startsWith('g_') ? page.commonObjs : page.objs, fontName);
                                            if (fontObj && fontObj.data && fontObj.data.length > 0) {
                                                const blob = new Blob([fontObj.data], { type: 'application/octet-stream' });
                                                // Guess the extension from the first four bytes
                                                let ext = "bin";
                                                if (fontObj.data[0] === 0x00 && fontObj.data[1] === 0x01 && fontObj.data[2] === 0x00 && fontObj.data[3] === 0x00) {
                                                    ext = "ttf";
                                                } else if (fontObj.data[0] === 0x4F && fontObj.data[1] === 0x54 && fontObj.data[2] === 0x54 && fontObj.data[3] === 0x4F) {
                                                    ext = "otf";
                                                } else if (fontObj.mimetype && fontObj.mimetype.includes('truetype')) {
                                                    ext = "ttf";
                                                }
                                                const filename = `font_${fontObj.loadedName || fontName}.${ext}`;
                                                const fntObj = {
                                                    blob: blob,
                                                    filename: filename,
                                                    url: URL.createObjectURL(blob),
                                                    name: fontObj.loadedName || fontName
                                                };
                                                extractedFonts.push(fntObj);
                                                documentFragment.appendChild(createCardForFont(fntObj));
                                                fontsFoundTotal++;
                                            }
                                        } catch (fntErr) {
                                            console.warn(`Failed to extract font ${fontName} on page ${i}`, fntErr);
                                        }
                                    }
                                }
                            }
                        }
                    } catch (pageErr) {
                        console.error(`Error processing page ${i}`, pageErr);
                    } finally {
                        if (page) {
                            try {
                                page.cleanup();
                            } catch (e) {}
                        }
                    }
                }

                try {
                    pdf.loadingTask.destroy();
                } catch (e) {}
                if (currentPdf === pdf) currentPdf = null;

                if (token !== runToken) return;

                // One append for all cards, not one reflow per card
                imageGrid.appendChild(documentFragment);

                progressBar.style.width = '100%';
                const totalAssets = imagesFoundTotal + textFoundTotal + fontsFoundTotal;
                statusText.textContent = `Found ${totalAssets} files.`;
                imgCount.textContent = `(${totalAssets})`;
                resultBox.classList.remove('hidden');
                
                if (totalAssets === 0) {
                    showToast('Nothing of the ticked kinds in this PDF.', 'info');
                    imageGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--ink-secondary);">Nothing found.</p>';
                    downloadAllBtn.disabled = true;
                } else {
                    downloadAllBtn.disabled = false;
                    let msg = [];
                    if(imagesFoundTotal) msg.push(`${imagesFoundTotal} images`);
                    if(textFoundTotal) msg.push(`${textFoundTotal} texts`);
                    if(fontsFoundTotal) msg.push(`${fontsFoundTotal} fonts`);
                    showToast(`Extracted ${msg.join(', ')}.`, 'success');
                }

            } catch (error) {
                if (token !== runToken) return;
                console.error(error);
                showToast('Could not read this PDF: ' + error.message, 'error');
                statusText.textContent = 'Stopped with an error.';
            } finally {
                if (token === runToken) processBtn.disabled = false;
            }
        });

        /* pdf.js hands images and fonts over after the operator list, the
           large ones once they are decoded. Asking before that throws, so
           this waits for them; ten seconds, in case one never comes. */
        function bekommen(objs, id) {
            return new Promise((resolve) => {
                const aufgeben = setTimeout(() => resolve(null), 10000);
                objs.get(id, (obj) => { clearTimeout(aufgeben); resolve(obj); });
            });
        }

        async function processPdfImage(img, pageNum, index) {
            if (!img || !img.width || !img.height) return null;

            const width = img.width;
            const height = img.height;
            
            // Under 20px it is usually a bullet or a rule, not a picture
            if (width < 20 || height < 20) return null;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            let imageData = ctx.createImageData(width, height);

            if (img.kind === pdfjsLib.ImageKind.GRAYSCALE_1BPP) {
                 // 1-bit images are only taken when pdf.js has decoded them already
                 if (img.bitmap) {
                     ctx.drawImage(img.bitmap, 0, 0);
                 } else {
                     return null;
                 }
            } else if (img.bitmap) {
                ctx.drawImage(img.bitmap, 0, 0);
            } else if (img.data) {
                if (img.data.length === width * height * 4) {
                    imageData.data.set(img.data);
                    ctx.putImageData(imageData, 0, 0);
                } else if (img.data.length === width * height * 3) {
                    const src = img.data;
                    const dest = imageData.data;
                    let j = 0;
                    for (let i = 0; i < src.length; i += 3) {
                        dest[j++] = src[i];
                        dest[j++] = src[i + 1];
                        dest[j++] = src[i + 2];
                        dest[j++] = 255;
                    }
                    ctx.putImageData(imageData, 0, 0);
                } else {
                     // Masks and other layouts are skipped
                     return null;
                }
            } else {
                return null;
            }

            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            if (!blob) return null;

            const filename = `image_p${pageNum}_${index}.png`;

            return {
                blob: blob,
                filename: filename,
                width: width,
                height: height,
                url: URL.createObjectURL(blob)
            };
        }

        function createCardForImage(imgObj) {
            const div = document.createElement('div');
            div.className = 'image-card';

            const img = document.createElement('img');
            img.src = imgObj.url;
            img.className = 'image-preview';
            img.alt = imgObj.filename;

            const meta = document.createElement('div');
            meta.className = 'image-meta';
            meta.textContent = `${imgObj.width}x${imgObj.height}`;

            const btn = document.createElement('button');
            btn.className = 'button sm outline';
            btn.style.width = '100%';
            btn.style.fontSize = '0.75rem';
            btn.textContent = 'Download';
            btn.onclick = () => downloadSingle(imgObj.url, imgObj.filename);

            div.appendChild(img);
            div.appendChild(meta);
            div.appendChild(btn);

            return div;
        }

        function createCardForText(txtObj) {
            const div = document.createElement('div');
            div.className = 'image-card';

            const preview = document.createElement('div');
            preview.className = 'image-preview';
            preview.style.padding = '0.5rem';
            preview.style.fontSize = '0.65rem';
            preview.style.textAlign = 'left';
            preview.style.overflow = 'hidden';
            preview.style.background = '#fafafa';
            preview.style.border = '1px solid #eee';
            preview.textContent = txtObj.preview;

            const meta = document.createElement('div');
            meta.className = 'image-meta';
            meta.title = txtObj.filename;
            meta.textContent = 'Text';

            const btn = document.createElement('button');
            btn.className = 'button sm outline';
            btn.style.width = '100%';
            btn.style.fontSize = '0.75rem';
            btn.textContent = 'Download';
            btn.onclick = () => downloadSingle(txtObj.url, txtObj.filename);

            div.appendChild(preview);
            div.appendChild(meta);
            div.appendChild(btn);

            return div;
        }

        function createCardForFont(fntObj) {
            const div = document.createElement('div');
            div.className = 'image-card';

            const preview = document.createElement('div');
            preview.className = 'image-preview';
            preview.style.display = 'flex';
            preview.style.alignItems = 'center';
            preview.style.justifyContent = 'center';
            preview.style.fontSize = '2rem';
            preview.style.background = '#fafafa';
            preview.style.border = '1px solid #eee';
            preview.textContent = 'Aa';

            const meta = document.createElement('div');
            meta.className = 'image-meta';
            meta.title = fntObj.name;
            meta.textContent = `Font: ${fntObj.name}`;

            const btn = document.createElement('button');
            btn.className = 'button sm outline';
            btn.style.width = '100%';
            btn.style.fontSize = '0.75rem';
            btn.textContent = 'Download';
            btn.onclick = () => downloadSingle(fntObj.url, fntObj.filename);

            div.appendChild(preview);
            div.appendChild(meta);
            div.appendChild(btn);

            return div;
        }

        window.downloadSingle = (url, filename) => {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        downloadAllBtn.addEventListener('click', () => {
            if (extractedImages.length === 0 && extractedTexts.length === 0 && extractedFonts.length === 0) return;
            
            showToast('Packing the ZIP...', 'info');
            const zip = new JSZip();

            if (extractedImages.length > 0) {
                const imgFolder = zip.folder("extracted_images");
                extractedImages.forEach(img => imgFolder.file(img.filename, img.blob));
            }

            if (extractedTexts.length > 0) {
                const txtFolder = zip.folder("extracted_texts");
                extractedTexts.forEach(txt => txtFolder.file(txt.filename, txt.blob));
            }

            if (extractedFonts.length > 0) {
                const fntFolder = zip.folder("extracted_fonts");
                extractedFonts.forEach(fnt => fntFolder.file(fnt.filename, fnt.blob));
            }

            zip.generateAsync({ type: "blob" }).then(function(content) {
                saveAs(content, `assets_${currentFile.name.replace('.pdf', '')}.zip`);
                showToast('Download started.', 'success');
            });
        });

        resetBtn.addEventListener('click', resetTool);
        
        function resetTool() {
            // Any run in flight sees the new token on its next await and returns
            runToken++;
            if (currentPdf) {
                try { currentPdf.loadingTask.destroy(); } catch (e) {}
                currentPdf = null;
            }
            const allAssets = [...extractedImages, ...extractedTexts, ...extractedFonts];
            if (allAssets.length > 0) {
                allAssets.forEach(asset => {
                    if (asset && asset.url) {
                        try { URL.revokeObjectURL(asset.url); } catch (e) {}
                    }
                });
            }
            currentFile = null;
            extractedImages = [];
            extractedTexts = [];
            extractedFonts = [];
            fileList.innerHTML = '';
            dropZone.classList.remove('hidden');
            controlPanel.classList.add('hidden');
            resultBox.classList.add('hidden');
            progressContainer.style.display = 'none';
            statusText.style.display = 'none';
            progressBar.style.width = '0%';
            fileInput.value = '';
            processBtn.disabled = false;
        }
    
    /* Is this tool holding something right now that a reload would throw
       away? The question is asked when someone clicks "Reload" in the
       update notice (assets/js/layout.js). A tool that stays quiet counts
       as empty. tests/test-holds-work.js insists that every tool with a
       file input speaks up. */
    window.llHoldsWork = () => !!currentFile || extractedImages.length > 0;
    </script>
</body>
</html>
