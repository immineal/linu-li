<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="Einheiten-Umrechner | Linus Linhof">Unit Converter | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <style>
        .converter-layout {
            display: flex;
            align-items: flex-start; /* label rows aligned along the top */
            gap: 2rem;
        }
        
        .input-group {
            flex: 1;
            width: 100%;
        }

        /* The equals sign should sit at the same height as the two value
           fields. Rather than shove it there with a fixed pixel value, its
           column mirrors a field column: an invisible label above and a box
           below with the same vertical measurements as an input. If the
           padding, border or font size of the fields changes, the sign
           moves along with them. */
        .equals-column label {
            visibility: hidden;
        }

        .equals-sign {
            position: relative;
            width: 2rem;                     /* room for the sign itself */
            padding: 0.8rem 0;               /* matches input in style.css */
            border: 1px solid transparent;   /* like input, but invisible */
            font-size: 1.5rem;               /* matches the value fields */
            font-family: var(--font-mono);   /* matches the value fields */
            line-height: normal;             /* as inside the field, not the page's 1.6 */
        }

        /* A slim blank glyph: invisible, but stretches the line to the height
           of a value field. That way the box is exactly as tall as a field —
           even when the system font brings its own line height. */
        .equals-strut {
            font-size: 1.5rem;
        }

        .equals-glyph {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-family: var(--font-body);
            font-size: 2rem;
            line-height: 1;
            opacity: 0.5;
            user-select: none;
        }

        @media (max-width: 768px) {
            .converter-layout {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
            /* Stacked, there is no field height left to hit: the sign stands
               on its own between the two columns. It used to be rotated a
               quarter turn here and then read as two vertical strokes — an
               equals sign stays an equals sign, on the phone too. */
            .equals-column {
                align-self: center;
            }
            .equals-column label,
            .equals-strut {
                display: none;
            }
            .equals-sign {
                padding: 0;
                border: 0;
                height: 2rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1 data-de="Einheiten-Umrechner">Unit Converter</h1>
                <p data-de="Länge, Gewicht, Temperatur, Geschwindigkeit, Datenspeicher und Währung. Wert in ein Feld tippen, oder die ganze Frage ins obere Feld schreiben.">Length, weight, temperature, speed, data storage and currency. Type a value into either box, or write the whole question in the top field.</p>
            </div>

            <div class="card">
                
                <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
                    <label data-de="Schnellumrechnung">Quick convert</label>
                    <input type="text" id="nlpInput" placeholder="5 km in miles, or 100 usd to eur" style="width: 100%; font-size: 1.1rem; padding: 0.75rem;" data-de-attr="placeholder:5 km in miles, oder 100 usd in eur">
                </div>

                <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
                    <label data-de="Kategorie">Category</label>
                    <div class="button-group">
                        <button class="button active-cat" onclick="setCategory('length')" data-category="length" data-de="Länge">Length</button>
                        <button class="button outline" onclick="setCategory('weight')" data-category="weight" data-de="Gewicht">Weight</button>
                        <button class="button outline" onclick="setCategory('temp')" data-category="temp" data-de="Temperatur">Temperature</button>
                        <button class="button outline" onclick="setCategory('speed')" data-category="speed" data-de="Geschwindigkeit">Speed</button>
                        <button class="button outline" onclick="setCategory('data')" data-category="data" data-de="Datenspeicher">Data Storage</button>
                        <button class="button outline" onclick="setCategory('currency')" data-category="currency" data-de="Währung">Currency</button>
                    </div>
                </div>

                <div id="nlpNotUnderstood" role="status" aria-live="polite" style="display:none; margin-bottom: 1rem; font-size: 0.85rem; color: var(--ink-secondary);"
                     data-de="Konnte die Anfrage nicht deuten.">Could not read that as a conversion.</div>

                <div class="converter-layout">
                    
                    <div class="input-group">
                        <label data-de="Wert 1">Value 1</label>
                        <input type="number" id="inputFrom" value="1" style="font-size: 1.5rem; font-family: var(--font-mono);">
                        <select id="unitFrom" data-save></select>
                    </div>

                    <div class="equals-column" aria-hidden="true">
                        <label>&nbsp;</label>
                        <div class="equals-sign"><span class="equals-strut">&#8203;</span><span class="equals-glyph">=</span></div>
                    </div>

                    <div class="input-group">
                        <label data-de="Wert 2">Value 2</label>
                        <input type="number" id="inputTo" style="font-size: 1.5rem; font-family: var(--font-mono);">
                        <select id="unitTo" data-save></select>
                    </div>
                </div>

                <div id="currencyOptIn" style="display: none; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); text-align: center;">
                    <button class="button sm outline" id="fetchRatesBtn" onclick="fetchExchangeRates()" data-de="Aktuelle Wechselkurse laden">Fetch Live Currency Rates</button>
                    <p style="font-size: 0.8rem; color: var(--ink-secondary); margin-top: 0.5rem;" data-de="(Benötigt Internet. Lädt von er-api.com und coincap.io)">(Requires internet. Fetches from er-api.com and coincap.io)</p>
                </div>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script>
        const nlpInput = document.getElementById('nlpInput');
        const inputFrom = document.getElementById('inputFrom');
        const inputTo = document.getElementById('inputTo');
        const unitFrom = document.getElementById('unitFrom');
        const unitTo = document.getElementById('unitTo');
        const catButtons = document.querySelectorAll('.button-group button');

        // Each unit's size in the category's base unit. Currency is the other
        // way round (units per 1 USD), because that is what er-api.com returns.
        const factors = {
            length: {
                base: 'm', // meters
                units: {
                    mm: 0.001,
                    cm: 0.01,
                    m: 1,
                    km: 1000,
                    in: 0.0254,
                    ft: 0.3048,
                    yd: 0.9144,
                    mi: 1609.344
                }
            },
            weight: {
                base: 'g', // grams
                units: {
                    mg: 0.001,
                    g: 1,
                    kg: 1000,
                    oz: 28.349523125,   // avoirdupois ounce
                    lb: 453.59237       // international avoirdupois pound
                }
            },
            speed: {
                base: 'm/s', // meters per second
                units: {
                    'm/s': 1,
                    'km/h': 1 / 3.6,    // exact; the old 0.27777778 rounded off
                    'mph': 0.44704,     // 1 mph = 0.44704 m/s (exact)
                    'knots': 1852 / 3600, // exact: 1 knot = 1 nautical mile / hour
                    'ft/s': 0.3048      // 1 ft/s = 0.3048 m/s
                }
            },
            data: {
                // Binary units: 1 KiB = 1024 B, 1 MiB = 1024 KiB, and so on.
                // The old table called these "KB, MB, …" and used rounded
                // factors — 1024 B round-tripped to 1.00000000377 KB.
                base: 'B',
                units: {
                    B:   1,
                    KiB: 1024,
                    MiB: 1024 * 1024,
                    GiB: 1024 * 1024 * 1024,
                    TiB: 1024 * 1024 * 1024 * 1024
                }
            },
            currency: {
                base: 'USD',
                units: {
                    USD: 1,
                    EUR: 0.9,
                    GBP: 0.78,
                    JPY: 150,
                    CAD: 1.35,
                    AUD: 1.5,
                    CHF: 0.88,
                    CNY: 7.2,
                    INR: 83
                } // replaced when live rates are fetched
            }
        };

        let currentCategory = 'length';

        async function fetchExchangeRates() {
            const CACHE_KEY = 'linuli_currency_rates';
            const CACHE_TIME = 'linuli_currency_time';
            const ONE_HOUR = 60 * 60 * 1000;
            const now = Date.now();

            // Whatever the visitor picked before the fetch stays picked after.
            const prevFrom = unitFrom.value;
            const prevTo = unitTo.value;

            try {
                // Rates younger than an hour are reused rather than fetched again.
                const cachedTime = localStorage.getItem(CACHE_TIME);
                if (cachedTime && (now - cachedTime < ONE_HOUR)) {
                    const cachedRates = localStorage.getItem(CACHE_KEY);
                    if (cachedRates) {
                        const parsed = JSON.parse(cachedRates);
                        factors.currency.units = parsed;
                        if (currentCategory === 'currency') {
                            populateSelects();
                            restoreCurrencySelection(prevFrom, prevTo);
                        }
                        return;
                    }
                }
            } catch (err) { /* storage blocked */ }

            const newRates = { ...factors.currency.units }; // built-in rates stay for anything the servers leave out

            // Fiat and crypto are two separate services. A failure on one used
            // to throw the other away as well.
            try {
                const fiatRes = await fetch('https://open.er-api.com/v6/latest/USD');
                const fiatData = await fiatRes.json();
                if (fiatData && fiatData.rates) {
                    Object.keys(fiatData.rates).forEach(currency => {
                        newRates[currency] = fiatData.rates[currency];
                    });
                }
            } catch (error) {
                console.error("Could not fetch fiat rates, keeping the built-in ones.", error);
            }

            try {
                const cryptoRes = await fetch('https://api.coincap.io/v2/assets?limit=20');
                const cryptoData = await cryptoRes.json();
                if (cryptoData && cryptoData.data) {
                    cryptoData.data.forEach(coin => {
                        // CoinCap gives USD per coin; the table holds coins per USD.
                        const priceUsd = parseFloat(coin.priceUsd);
                        if (priceUsd > 0) {
                            newRates[coin.symbol] = 1 / priceUsd;
                        }
                    });
                }
            } catch (error) {
                console.error("Could not fetch crypto rates, keeping the built-in ones.", error);
            }

            factors.currency.units = newRates;
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(newRates));
                localStorage.setItem(CACHE_TIME, now.toString());
            } catch (err) { /* storage blocked */ }

            if (currentCategory === 'currency') {
                populateSelects();
                restoreCurrencySelection(prevFrom, prevTo);
                convert('from');
            }
        }

        function restoreCurrencySelection(prevFrom, prevTo) {
            if (prevFrom && factors.currency.units[prevFrom]) unitFrom.value = prevFrom;
            if (prevTo && factors.currency.units[prevTo]) unitTo.value = prevTo;
        }

        function setCategory(cat) {
            currentCategory = cat;

            document.getElementById('currencyOptIn').style.display = (cat === 'currency') ? 'block' : 'none';

            // Match by data-category, not label — the German labels used to fall
            // through the substring check and leave every button outlined.
            catButtons.forEach(btn => {
                if (btn.getAttribute('data-category') === cat) {
                    btn.classList.remove('outline');
                } else {
                    btn.classList.add('outline');
                }
            });

            populateSelects();
            convert('from');
        }

        function populateSelects() {
            unitFrom.innerHTML = '';
            unitTo.innerHTML = '';

            if (currentCategory === 'temp') {
                const units = ['Celsius (°C)', 'Fahrenheit (°F)', 'Kelvin (K)'];
                units.forEach(u => {
                    unitFrom.add(new Option(u, u));
                    unitTo.add(new Option(u, u));
                });
                unitTo.selectedIndex = 1; // °C to °F
            } else {
                const units = Object.keys(factors[currentCategory].units);
                units.forEach(u => {
                    unitFrom.add(new Option(u, u));
                    unitTo.add(new Option(u, u));
                });
                
                if(currentCategory === 'length') { unitFrom.value = 'm'; unitTo.value = 'ft'; }
                if(currentCategory === 'weight') { unitFrom.value = 'kg'; unitTo.value = 'lb'; }
                if(currentCategory === 'speed')  { unitFrom.value = 'km/h'; unitTo.value = 'mph'; }
                if(currentCategory === 'data')   { unitFrom.value = 'MiB'; unitTo.value = 'GiB'; }
                if(currentCategory === 'currency') { unitFrom.value = 'USD'; unitTo.value = 'EUR'; }
            }
        }

        /**
         * @param {string} direction - 'from' fills the right box, 'to' the left one
         * @param {boolean} [clampInput] - whether to rewrite the source input on
         *   an out-of-range value. False while typing, true on blur/change.
         */
        function convert(direction, clampInput) {
            let val, outputEl, sourceEl, u1, u2;

            if (direction === 'to') {
                val = parseFloat(inputTo.value);
                outputEl = inputFrom;
                sourceEl = inputTo;
                u1 = unitTo.value;
                u2 = unitFrom.value;
            } else {
                val = parseFloat(inputFrom.value);
                outputEl = inputTo;
                sourceEl = inputFrom;
                u1 = unitFrom.value;
                u2 = unitTo.value;
            }

            if (isNaN(val)) {
                outputEl.value = '';
                return;
            }

            if (currentCategory === 'temp') {
                let result = convertTemp(val, u1, u2);
                outputEl.value = formatNumber(result);

                // Below absolute zero the source is clamped only when the user
                // has stopped typing. Otherwise "-3" on the way to "-300" jumps
                // to -273.15 mid-keystroke.
                if (clampInput) {
                    const originalClamped = convertTemp(result, u2, u1);
                    if (Math.abs(val - originalClamped) > 0.01 && val < originalClamped) {
                        sourceEl.value = formatNumber(originalClamped);
                    }
                }
            } else {
                // Nothing but temperature can go below zero. Clamp the input
                // only on blur/change; while typing, keep what the user has.
                if (val < 0) {
                    if (clampInput) sourceEl.value = 0;
                    val = 0;
                }

                const catData = factors[currentCategory];
                let result;
                if (currentCategory === 'currency') {
                    // Rates are units per USD, so divide into dollars first.
                    const baseValue = val / catData.units[u1];
                    result = baseValue * catData.units[u2];
                } else {
                    const baseValue = val * catData.units[u1];
                    result = baseValue / catData.units[u2];
                }

                outputEl.value = formatNumber(result);
            }
        }

        function formatNumber(num) {
            if (num === 0) return "0";
            if (!isFinite(num)) return String(num);

            // Very small numbers: scientific notation rather than rounding to 0.
            const abs = Math.abs(num);
            if (abs < 1e-6) {
                // toExponential gives 9.09e-13; toPrecision would round tiny
                // values to 0 further down the pipe.
                return num.toExponential(6).replace(/\.?0+e/, 'e');
            }

            // 12 significant digits hides float noise like 0.30000000000000004.
            let str = num.toPrecision(12);
            return parseFloat(str).toString();
        }

        function convertTemp(val, from, to) {
            let c = val;
            if (from.includes('Fahrenheit')) c = (val - 32) * 5/9;
            if (from.includes('Kelvin')) c = val - 273.15;

            if (c < -273.15) {
                c = -273.15;
            }

            if (to.includes('Celsius')) return c;
            if (to.includes('Fahrenheit')) return c * 9/5 + 32;
            if (to.includes('Kelvin')) return c + 273.15;
            return c;
        }

        // While typing, do not rewrite the source field. Clamp on blur only, so
        // "-300" on its way to being typed does not snap to -273.15 mid-keystroke.
        inputFrom.addEventListener('input', () => convert('from', false));
        inputFrom.addEventListener('change', () => convert('from', true));
        inputFrom.addEventListener('blur', () => convert('from', true));

        inputTo.addEventListener('input', () => convert('to', false));
        inputTo.addEventListener('change', () => convert('to', true));
        inputTo.addEventListener('blur', () => convert('to', true));

        // Changing either unit recalculates the right box from the left one.
        unitFrom.addEventListener('change', () => convert('from', true));
        unitTo.addEventListener('change', () => convert('from', true));

        // Words the quick-convert field accepts for each unit. Currency codes
        // are looked up in the rate table instead.
        const synonymDict = {
            'm': ['m', 'meter', 'meters'],
            'km': ['km', 'kilometer', 'kilometers'],
            'mm': ['mm', 'millimeter', 'millimeters'],
            'cm': ['cm', 'centimeter', 'centimeters'],
            'in': ['in', 'inch', 'inches'],
            'ft': ['ft', 'foot', 'feet'],
            'yd': ['yd', 'yard', 'yards'],
            'mi': ['mi', 'mile', 'miles'],

            'g': ['g', 'gram', 'grams'],
            'kg': ['kg', 'kilo', 'kilogram', 'kilograms'],
            'mg': ['mg', 'milligram', 'milligrams'],
            'oz': ['oz', 'ounce', 'ounces'],
            'lb': ['lb', 'lbs', 'pound', 'pounds'],

            'Celsius (°C)': ['c', 'celsius', '°c'],
            'Fahrenheit (°F)': ['f', 'fahrenheit', '°f'],
            'Kelvin (K)': ['k', 'kelvin'],

            'm/s': ['m/s', 'mps', 'meters per second', 'metres per second'],
            'km/h': ['km/h', 'kmh', 'kph', 'kilometers per hour', 'kilometres per hour'],
            'mph': ['mph', 'miles per hour'],
            'knots': ['knots', 'knot', 'kn'],
            'ft/s': ['ft/s', 'fps', 'feet per second'],

            'B':   ['b', 'byte', 'bytes'],
            'KiB': ['kib', 'kb', 'kibibyte', 'kibibytes', 'kilobyte', 'kilobytes'],
            'MiB': ['mib', 'mb', 'mebibyte', 'mebibytes', 'megabyte', 'megabytes'],
            'GiB': ['gib', 'gb', 'gibibyte', 'gibibytes', 'gigabyte', 'gigabytes'],
            'TiB': ['tib', 'tb', 'tebibyte', 'tebibytes', 'terabyte', 'terabytes']
        };

        const nlpNotUnderstood = document.getElementById('nlpNotUnderstood');

        function isTempUnit(u) {
            return typeof u === 'string' && (u.includes('Celsius') || u.includes('Fahrenheit') || u.includes('Kelvin'));
        }

        function parseNLP(inputStr) {
            const raw = (inputStr || '').trim();
            if (!raw) { nlpNotUnderstood.style.display = 'none'; return true; }

            // "convert 5 km to miles please" → strip framing words on both ends.
            let s = raw.replace(/^(convert|umrechnen|umwandeln)\s+/i, '')
                       .replace(/[.,!?\s]*(please|bitte)[.,!?\s]*$/i, '')
                       .trim();

            // Accept "1,5 km to miles" (German decimal) and "100km" (no space).
            // The unit half can be anything up to the "in"/"to" separator.
            const match = s.match(/^(-?\d+(?:[.,]\d+)?)\s*(.+?)\s+(?:in|to|nach)\s+(.+)$/i);
            if (!match) return false;

            const val = parseFloat(match[1].replace(',', '.'));
            if (isNaN(val)) return false;

            const sourceStr = match[2].toLowerCase().trim();
            const targetStr = match[3].toLowerCase().trim();

            const findUnitKey = (query) => {
                for (const [key, synonyms] of Object.entries(synonymDict)) {
                    if (synonyms.includes(query)) return key;
                }
                const upperQuery = query.toUpperCase();
                if (factors.currency.units[upperQuery]) return upperQuery;
                return null;
            };

            const foundU1 = findUnitKey(sourceStr);
            const foundU2 = findUnitKey(targetStr);
            if (!foundU1 || !foundU2) return false;

            let foundCat = null;
            if (isTempUnit(foundU1) && isTempUnit(foundU2)) {
                foundCat = 'temp';
            } else {
                for (const cat of Object.keys(factors)) {
                    if (factors[cat].units[foundU1] && factors[cat].units[foundU2]) {
                        foundCat = cat;
                        break;
                    }
                }
            }
            if (!foundCat) return false;

            if (currentCategory !== foundCat) setCategory(foundCat);
            inputFrom.value = val;
            unitFrom.value = foundU1;
            unitTo.value = foundU2;
            convert('from', true);
            return true;
        }

        nlpInput.addEventListener('input', (e) => {
            const raw = e.target.value.trim();
            if (!raw) {
                nlpNotUnderstood.style.display = 'none';
                return;
            }
            const ok = parseNLP(raw);
            if (ok) {
                nlpNotUnderstood.style.display = 'none';
            } else {
                // Drop the stale conversion so a half-typed query does not read
                // as a good answer to the last complete one.
                inputTo.value = '';
                nlpNotUnderstood.style.display = 'block';
            }
        });

        setCategory('length');
    </script>
</body>
</html>
