<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="Einheiten-Umrechner | Linus Linhof">Unit Converter | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <style>
        .converter-layout {
            display: flex;
            align-items: flex-start; /* label rows aligned along the top */
            gap: 2rem;
        }
        
        .input-group {
            flex: 1;
            width: 100%;
        }

        /* The equals sign should sit at the same height as the two value
           fields. Rather than shove it there with a fixed pixel value, its
           column mirrors a field column: an invisible label above and a box
           below with the same vertical measurements as an input. If the
           padding, border or font size of the fields changes, the sign
           moves along with them. */
        .equals-column label {
            visibility: hidden;
        }

        .equals-sign {
            position: relative;
            width: 2rem;                     /* room for the sign itself */
            padding: 0.8rem 0;               /* matches input in style.css */
            border: 1px solid transparent;   /* like input, but invisible */
            font-size: 1.5rem;               /* matches the value fields */
            font-family: var(--font-mono);   /* matches the value fields */
            line-height: normal;             /* as inside the field, not the page's 1.6 */
        }

        /* A slim blank glyph: invisible, but stretches the line to the height
           of a value field. That way the box is exactly as tall as a field —
           even when the system font brings its own line height. */
        .equals-strut {
            font-size: 1.5rem;
        }

        .equals-glyph {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-family: var(--font-body);
            font-size: 2rem;
            line-height: 1;
            opacity: 0.5;
            user-select: none;
        }

        @media (max-width: 768px) {
            .converter-layout {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
            /* Stacked, there is no field height left to hit: the sign stands
               on its own between the two columns. It used to be rotated a
               quarter turn here and then read as two vertical strokes — an
               equals sign stays an equals sign, on the phone too. */
            .equals-column {
                align-self: center;
            }
            .equals-column label,
            .equals-strut {
                display: none;
            }
            .equals-sign {
                padding: 0;
                border: 0;
                height: 2rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1 data-de="Einheiten-Umrechner">Unit Converter</h1>
                <p data-de="Länge, Gewicht, Temperatur, Geschwindigkeit, Datenspeicher und Währung. Wert in ein Feld tippen, oder die ganze Frage ins obere Feld schreiben.">Length, weight, temperature, speed, data storage and currency. Type a value into either box, or write the whole question in the top field.</p>
            </div>

            <div class="card">
                
                <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
                    <label data-de="Schnellumrechnung">Quick convert</label>
                    <input type="text" id="nlpInput" placeholder="5 km in miles, or 100 usd to eur" style="width: 100%; font-size: 1.1rem; padding: 0.75rem;" data-de-attr="placeholder:5 km in miles, oder 100 usd in eur">
                </div>

                <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
                    <label data-de="Kategorie">Category</label>
                    <div class="button-group">
                        <button class="button active-cat" onclick="setCategory('length')" data-de="Länge">Length</button>
                        <button class="button outline" onclick="setCategory('weight')" data-de="Gewicht">Weight</button>
                        <button class="button outline" onclick="setCategory('temp')" data-de="Temperatur">Temperature</button>
                        <button class="button outline" onclick="setCategory('speed')" data-de="Geschwindigkeit">Speed</button>
                        <button class="button outline" onclick="setCategory('data')" data-de="Datenspeicher">Data Storage</button>
                        <button class="button outline" onclick="setCategory('currency')" data-de="Währung">Currency</button>
                    </div>
                </div>

                <div class="converter-layout">
                    
                    <div class="input-group">
                        <label data-de="Wert 1">Value 1</label>
                        <input type="number" id="inputFrom" value="1" style="font-size: 1.5rem; font-family: var(--font-mono);">
                        <select id="unitFrom" data-save></select>
                    </div>

                    <div class="equals-column" aria-hidden="true">
                        <label>&nbsp;</label>
                        <div class="equals-sign"><span class="equals-strut">&#8203;</span><span class="equals-glyph">=</span></div>
                    </div>

                    <div class="input-group">
                        <label data-de="Wert 2">Value 2</label>
                        <input type="number" id="inputTo" style="font-size: 1.5rem; font-family: var(--font-mono);">
                        <select id="unitTo" data-save></select>
                    </div>
                </div>

                <div id="currencyOptIn" style="display: none; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); text-align: center;">
                    <button class="button sm outline" id="fetchRatesBtn" onclick="fetchExchangeRates()" data-de="Aktuelle Wechselkurse laden">Fetch Live Currency Rates</button>
                    <p style="font-size: 0.8rem; color: var(--ink-secondary); margin-top: 0.5rem;" data-de="(Benötigt Internet. Lädt von er-api.com und coincap.io)">(Requires internet. Fetches from er-api.com and coincap.io)</p>
                </div>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>
    <script>
        const nlpInput = document.getElementById('nlpInput');
        const inputFrom = document.getElementById('inputFrom');
        const inputTo = document.getElementById('inputTo');
        const unitFrom = document.getElementById('unitFrom');
        const unitTo = document.getElementById('unitTo');
        const catButtons = document.querySelectorAll('.button-group button');

        // Each unit's size in the category's base unit. Currency is the other
        // way round (units per 1 USD), because that is what er-api.com returns.
        const factors = {
            length: {
                base: 'm', // meters
                units: {
                    mm: 0.001,
                    cm: 0.01,
                    m: 1,
                    km: 1000,
                    in: 0.0254,
                    ft: 0.3048,
                    yd: 0.9144,
                    mi: 1609.344
                }
            },
            weight: {
                base: 'g', // grams
                units: {
                    mg: 0.001,
                    g: 1,
                    kg: 1000,
                    oz: 28.3495,
                    lb: 453.592
                }
            },
            speed: {
                base: 'm/s', // meters per second
                units: {
                    'm/s': 1,
                    'km/h': 0.27777778, // 1 km/h = 0.277 m/s
                    'mph': 0.44704,     // 1 mph = 0.447 m/s
                    'knots': 0.51444444,// 1 knot = 0.514 m/s
                    'ft/s': 0.3048      // 1 ft/s = 0.3048 m/s
                }
            },
            data: {
                base: 'MB', // megabytes
                units: {
                    B: 0.00000095367432,
                    KB: 0.0009765625,
                    MB: 1,
                    GB: 1024,
                    TB: 1048576
                }
            },
            currency: {
                base: 'USD',
                units: {
                    USD: 1,
                    EUR: 0.9,
                    GBP: 0.78,
                    JPY: 150,
                    CAD: 1.35,
                    AUD: 1.5,
                    CHF: 0.88,
                    CNY: 7.2,
                    INR: 83
                } // replaced when live rates are fetched
            }
        };

        let currentCategory = 'length';

        async function fetchExchangeRates() {
            const CACHE_KEY = 'linuli_currency_rates';
            const CACHE_TIME = 'linuli_currency_time';
            const ONE_HOUR = 60 * 60 * 1000;
            const now = Date.now();

            try {
                // Rates younger than an hour are reused rather than fetched again.
                const cachedTime = localStorage.getItem(CACHE_TIME);
                if (cachedTime && (now - cachedTime < ONE_HOUR)) {
                    const cachedRates = localStorage.getItem(CACHE_KEY);
                    if (cachedRates) {
                        const parsed = JSON.parse(cachedRates);
                        factors.currency.units = parsed;
                        if (currentCategory === 'currency') populateSelects();
                        return;
                    }
                }

                const fiatRes = await fetch('https://open.er-api.com/v6/latest/USD');
                const fiatData = await fiatRes.json();

                const cryptoRes = await fetch('https://api.coincap.io/v2/assets?limit=20');
                const cryptoData = await cryptoRes.json();

                if (fiatData && fiatData.rates && cryptoData && cryptoData.data) {
                    const newRates = { ...factors.currency.units }; // built-in rates stay for anything the servers leave out

                    Object.keys(fiatData.rates).forEach(currency => {
                        newRates[currency] = fiatData.rates[currency];
                    });

                    cryptoData.data.forEach(coin => {
                        // CoinCap gives USD per coin; the table holds coins per USD.
                        const priceUsd = parseFloat(coin.priceUsd);
                        if (priceUsd > 0) {
                            newRates[coin.symbol] = 1 / priceUsd;
                        }
                    });

                    factors.currency.units = newRates;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(newRates));
                    localStorage.setItem(CACHE_TIME, now.toString());

                    if (currentCategory === 'currency') {
                        populateSelects();
                        convert('from');
                    }
                }
            } catch (error) {
                console.error("Could not fetch exchange rates, keeping the built-in ones.", error);
            }
        }

        function setCategory(cat) {
            currentCategory = cat;
            
            document.getElementById('currencyOptIn').style.display = (cat === 'currency') ? 'block' : 'none';
            
            catButtons.forEach(btn => {
                // The buttons carry no data attribute, so match on their label.
                const btnText = btn.textContent.toLowerCase();
                const isMatch = (cat === 'data' && btnText.includes('data')) || 
                                (cat === 'speed' && btnText.includes('speed')) ||
                                (cat === 'temp' && btnText.includes('temp')) ||
                                (cat === 'currency' && btnText.includes('currency')) ||
                                (btnText.startsWith(cat.substring(0,3)));
                                
                if(isMatch) {
                    btn.classList.remove('outline');
                } else {
                    btn.classList.add('outline');
                }
            });

            populateSelects();
            convert('from');
        }

        function populateSelects() {
            unitFrom.innerHTML = '';
            unitTo.innerHTML = '';

            if (currentCategory === 'temp') {
                const units = ['Celsius (°C)', 'Fahrenheit (°F)', 'Kelvin (K)'];
                units.forEach(u => {
                    unitFrom.add(new Option(u, u));
                    unitTo.add(new Option(u, u));
                });
                unitTo.selectedIndex = 1; // °C to °F
            } else {
                const units = Object.keys(factors[currentCategory].units);
                units.forEach(u => {
                    unitFrom.add(new Option(u, u));
                    unitTo.add(new Option(u, u));
                });
                
                if(currentCategory === 'length') { unitFrom.value = 'm'; unitTo.value = 'ft'; }
                if(currentCategory === 'weight') { unitFrom.value = 'kg'; unitTo.value = 'lb'; }
                if(currentCategory === 'speed')  { unitFrom.value = 'km/h'; unitTo.value = 'mph'; }
                if(currentCategory === 'data')   { unitFrom.value = 'MB'; unitTo.value = 'GB'; }
                if(currentCategory === 'currency') { unitFrom.value = 'USD'; unitTo.value = 'EUR'; }
            }
        }

        /**
         * @param {string} direction - 'from' fills the right box, 'to' the left one
         */
        function convert(direction) {
            let val, outputEl, u1, u2;

            if (direction === 'to') {
                val = parseFloat(inputTo.value);
                outputEl = inputFrom;
                u1 = unitTo.value;
                u2 = unitFrom.value;
            } else {
                val = parseFloat(inputFrom.value);
                outputEl = inputTo;
                u1 = unitFrom.value;
                u2 = unitTo.value;
            }

            if (isNaN(val)) {
                outputEl.value = '';
                return;
            }

            if (currentCategory === 'temp') {
                const result = convertTemp(val, u1, u2);
                outputEl.value = result;

                // Below absolute zero the result was clamped. Converting it back
                // gives the clamped input, which then replaces what was typed.
                const originalClamped = convertTemp(result, u2, u1);
                if (Math.abs(val - originalClamped) > 0.01 && val < originalClamped) {
                     if (direction === 'to') {
                         inputTo.value = originalClamped;
                     } else {
                         inputFrom.value = originalClamped;
                     }
                }
            } else {
                // Nothing but temperature can go below zero.
                if (val < 0) {
                    val = 0;
                    if (direction === 'to') inputTo.value = 0;
                    else inputFrom.value = 0;
                }

                const catData = factors[currentCategory];
                let result;
                if (currentCategory === 'currency') {
                    // Rates are units per USD, so divide into dollars first.
                    const baseValue = val / catData.units[u1];
                    result = baseValue * catData.units[u2];
                } else {
                    const baseValue = val * catData.units[u1];
                    result = baseValue / catData.units[u2];
                }
                
                outputEl.value = formatNumber(result);
            }
        }

        function formatNumber(num) {
            // 12 significant digits hides float noise like 0.30000000000000004.
            if (Math.abs(num) < 1e-12) return "0";

            let str = num.toPrecision(12);
            return parseFloat(str).toString();
        }

        function convertTemp(val, from, to) {
            let c = val;
            if (from.includes('Fahrenheit')) c = (val - 32) * 5/9;
            if (from.includes('Kelvin')) c = val - 273.15;

            if (c < -273.15) {
                c = -273.15;
            }

            if (to.includes('Celsius')) return formatNumber(c);
            if (to.includes('Fahrenheit')) return formatNumber(c * 9/5 + 32);
            if (to.includes('Kelvin')) return formatNumber(c + 273.15);
        }

        inputFrom.addEventListener('input', () => convert('from'));

        inputTo.addEventListener('input', () => convert('to'));

        // Changing either unit recalculates the right box from the left one.
        unitFrom.addEventListener('change', () => convert('from'));
        unitTo.addEventListener('change', () => convert('from'));

        // Words the quick-convert field accepts for each unit. Currency codes
        // are looked up in the rate table instead.
        const synonymDict = {
            'm': ['m', 'meter', 'meters'],
            'km': ['km', 'kilometer', 'kilometers'],
            'mm': ['mm', 'millimeter', 'millimeters'],
            'cm': ['cm', 'centimeter', 'centimeters'],
            'in': ['in', 'inch', 'inches'],
            'ft': ['ft', 'foot', 'feet'],
            'yd': ['yd', 'yard', 'yards'],
            'mi': ['mi', 'mile', 'miles'],

            'g': ['g', 'gram', 'grams'],
            'kg': ['kg', 'kilo', 'kilogram', 'kilograms'],
            'mg': ['mg', 'milligram', 'milligrams'],
            'oz': ['oz', 'ounce', 'ounces'],
            'lb': ['lb', 'lbs', 'pound', 'pounds'],

            'Celsius (°C)': ['c', 'celsius', '°c'],
            'Fahrenheit (°F)': ['f', 'fahrenheit', '°f'],
            'Kelvin (K)': ['k', 'kelvin'],

            'm/s': ['m/s', 'mps', 'meters per second'],
            'km/h': ['km/h', 'kph', 'kilometers per hour'],
            'mph': ['mph', 'miles per hour'],
            'knots': ['knots', 'knot'],
            'ft/s': ['ft/s', 'fps', 'feet per second'],

            'B': ['b', 'byte', 'bytes'],
            'KB': ['kb', 'kilobyte', 'kilobytes'],
            'MB': ['mb', 'megabyte', 'megabytes'],
            'GB': ['gb', 'gigabyte', 'gigabytes'],
            'TB': ['tb', 'terabyte', 'terabytes']
        };

        function parseNLP(inputStr) {
            if (!inputStr) return;
            // "5 km to miles", "100.5 USD in EUR"
            const match = inputStr.trim().match(/^([\d\.]+)\s+(.+?)\s+(?:in|to)\s+(.+)$/i);
            if (!match) return;

            const val = parseFloat(match[1]);
            if (isNaN(val)) return;

            let sourceStr = match[2].toLowerCase();
            let targetStr = match[3].toLowerCase();

            let foundCat = null;
            let foundU1 = null;
            let foundU2 = null;

            const findUnitKey = (query) => {
                for (const [key, synonyms] of Object.entries(synonymDict)) {
                    if (synonyms.includes(query)) return key;
                }

                const upperQuery = query.toUpperCase();
                if (factors.currency.units[upperQuery]) {
                    return upperQuery;
                }

                return null;
            };

            foundU1 = findUnitKey(sourceStr);
            foundU2 = findUnitKey(targetStr);

            if (foundU1 && foundU2) {
                for (const cat of Object.keys(factors)) {
                    if (cat === 'temp') {
                         if (foundU1.includes('Celsius') || foundU1.includes('Fahrenheit') || foundU1.includes('Kelvin')) {
                             foundCat = 'temp'; break;
                         }
                    } else if (factors[cat].units[foundU1]) {
                        foundCat = cat;
                        break;
                    }
                }

                // Only act when both units belong to the same category.
                if (foundCat && factors[foundCat]) {
                    let u2IsValid = false;
                    if (foundCat === 'temp') {
                        u2IsValid = foundU2.includes('Celsius') || foundU2.includes('Fahrenheit') || foundU2.includes('Kelvin');
                    } else {
                        u2IsValid = !!factors[foundCat].units[foundU2];
                    }

                    if (u2IsValid) {
                        if (currentCategory !== foundCat) {
                            setCategory(foundCat);
                        }
                        inputFrom.value = val;
                        unitFrom.value = foundU1;
                        unitTo.value = foundU2;
                        convert('from');
                    }
                }
            }
        }

        nlpInput.addEventListener('input', (e) => {
            parseNLP(e.target.value);
        });

        setCategory('length');
    </script>
</body>
</html>
