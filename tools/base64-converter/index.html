<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-de="Base64 kodieren/dekodieren | Linus Linhof">Base64 Encoder/Decoder | Linus Linhof</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
</head>
<body>
    <main>
        <div class="container">
            <div class="tool-header">
                <h1 data-de="Base64-Konverter">Base64 Converter</h1>
                <p data-de="Text oder eine beliebige Datei als Base64 kodieren, oder Base64 wieder in Text dekodieren. Bilder, Audio und PDFs bekommen eine Vorschau.">Encode text or any file as Base64, or decode Base64 back into text. Images, audio and PDFs get a preview.</p>
            </div>

            <div class="card">
                
                <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem;">
                    <label data-de="Modus">Conversion Mode</label>
                    <div class="button-group">
                        <button class="button" id="modeTextBtn" data-de="Aus Text">From Text String</button>
                        <button class="button outline" id="modeImageBtn" data-de="Aus Datei">From File</button>
                    </div>
                </div>

                <div id="textModeSection">
                    <label for="textInput" data-de="Text oder Base64-String">Input Text / Base64 String</label>
                    <textarea id="textInput" class="code-editor" placeholder="Text to encode, or Base64 to decode" data-de-attr="placeholder:Text zum Kodieren, oder Base64 zum Dekodieren"></textarea>

                    <div class="button-group">
                        <button class="button" id="encodeBtn" data-de="Als Base64 kodieren">Encode to Base64</button>
                        <button class="button secondary" id="decodeBtn" data-de="Aus Base64 dekodieren">Decode from Base64</button>
                        <button class="button outline" id="clearTextBtn" data-de="Leeren">Clear</button>
                    </div>
                </div>

                <div id="imageModeSection" class="hidden">
                    <div class="drop-zone" id="dropZone">
                        <p data-de="Datei hier ablegen, oder klicken zum Auswählen">Drop a file here, or click to pick one</p>
                        <p style="font-size: 0.8rem; color: var(--ink-secondary);" data-de="Jede Art von Datei">Any kind of file</p>
                        <input type="file" id="fileInput" class="hidden" accept="*">
                    </div>
                    
                    <ul class="file-list" id="fileList"></ul>
                    <div id="progressContainer" class="hidden" style="margin-top: 1rem; text-align: center; color: var(--ink-secondary);">
                        <p id="progressText">Encoding… 0 MB</p>
                    </div>
                </div>

                <div class="result-box hidden" id="resultBox">
                    <label data-de="Ergebnis">Result</label>
                    
                    <div id="imagePreviewContainer" class="hidden" style="text-align: center; margin-bottom: 1.5rem; padding: 1rem; background: var(--paper); border: 1px solid var(--border); border-radius: 4px;">
                        <img id="imagePreview" src="" alt="Preview" style="max-width: 100%; max-height: 300px; height: auto; border-radius: 4px;">
                        <p style="font-size: 0.8rem; color: var(--ink-secondary); margin-top: 0.5rem; margin-bottom: 0;">Preview</p>
                    </div>

                    <textarea id="outputArea" class="code-editor" readonly></textarea>

                    <div class="button-group" style="margin-top: 1rem;">
                        <button class="button sm secondary" onclick="copyResult()" data-de="Ergebnis kopieren">Copy Result</button>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <script src="../../assets/js/i18n.js"></script>
    <script src="../../assets/js/layout.js"></script>
    
    <script>
        const modeTextBtn = document.getElementById('modeTextBtn');
        const modeImageBtn = document.getElementById('modeImageBtn');
        const textModeSection = document.getElementById('textModeSection');
        const imageModeSection = document.getElementById('imageModeSection');
        
        const textInput = document.getElementById('textInput');
        const encodeBtn = document.getElementById('encodeBtn');
        const decodeBtn = document.getElementById('decodeBtn');
        const clearTextBtn = document.getElementById('clearTextBtn');
        
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        
        const resultBox = document.getElementById('resultBox');
        const outputArea = document.getElementById('outputArea');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');

        let currentMode = 'text'; // or 'image', which is the file mode

        function switchMode(mode) {
            currentMode = mode;
            resultBox.classList.add('hidden');
            outputArea.value = '';
            imagePreviewContainer.classList.add('hidden');
            imagePreviewContainer.innerHTML = '';
            fileList.innerHTML = '';

            if (mode === 'text') {
                textModeSection.classList.remove('hidden');
                imageModeSection.classList.add('hidden');
                
                modeTextBtn.classList.remove('outline');
                modeImageBtn.classList.add('outline');
            } else {
                textModeSection.classList.add('hidden');
                imageModeSection.classList.remove('hidden');
                
                modeTextBtn.classList.add('outline');
                modeImageBtn.classList.remove('outline');
            }
        }

        modeTextBtn.addEventListener('click', () => switchMode('text'));
        modeImageBtn.addEventListener('click', () => switchMode('image'));

        // btoa() only takes Latin-1, so text goes through UTF-8 bytes first.
        // The bytes go to fromCharCode in chunks because one call with a long
        // array throws a RangeError.
        function utf8_to_b64(str) {
            try {
                const bytes = new TextEncoder().encode(str);
                let binString = '';
                const chunkSize = 0x8000;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    binString += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
                }
                return window.btoa(binString);
            } catch (e) {
                throw new Error('Could not encode this text');
            }
        }

        function b64_to_utf8(str) {
            try {
                // Accepts a whole data: URI, line breaks, and missing padding
                if (str.includes('base64,')) {
                    str = str.split('base64,')[1];
                }
                str = str.replace(/\s+/g, '');
                while (str.length % 4 !== 0) {
                    str += '=';
                }

                const binString = window.atob(str);
                const bytes = new Uint8Array(binString.length);
                for (let i = 0; i < binString.length; i++) {
                    bytes[i] = binString.charCodeAt(i);
                }
                // fatal: true throws on bytes that are not UTF-8 text, instead of
                // showing a screen of replacement characters
                return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            } catch (e) {
                throw new Error('Not valid Base64, or not text once decoded');
            }
        }

        textInput.addEventListener('input', () => {
            const val = textInput.value.trim();
            if (!val) {
                if (imagePreviewContainer.classList.contains('hidden') === false) {
                    imagePreviewContainer.classList.add('hidden');
                    imagePreviewContainer.innerHTML = '';
                    if (!outputArea.value) resultBox.classList.add('hidden');
                }
                return;
            }
            detectAndPreviewMedia(val);
        });

        function detectAndPreviewMedia(str) {
            let mediaSrc = null;
            let mediaType = null; // 'image', 'audio', 'video' or 'pdf'

            const dataUriMatch = str.match(/^data:(image|audio|video|application\/pdf)[\w\/+-]*;base64,/i);
            if (dataUriMatch) {
                mediaSrc = str;
                mediaType = dataUriMatch[1];
                if (mediaType === 'application/pdf') mediaType = 'pdf';
            } 
            // Without a data: prefix the type is guessed from the first bytes of
            // the file, as they look once encoded (\x89PNG is iVBORw0KGgo).
            else {
                if (str.startsWith('iVBORw0KGgo')) { mediaSrc = `data:image/png;base64,${str}`; mediaType = 'image'; }
                else if (str.startsWith('/9j/')) { mediaSrc = `data:image/jpeg;base64,${str}`; mediaType = 'image'; }
                else if (str.startsWith('R0lGOD')) { mediaSrc = `data:image/gif;base64,${str}`; mediaType = 'image'; }
                else if (str.startsWith('UklGR')) { mediaSrc = `data:image/webp;base64,${str}`; mediaType = 'image'; } // RIFF, which WAV and AVI also start with
                else if (str.startsWith('SUQzAAA')) { mediaSrc = `data:audio/mp3;base64,${str}`; mediaType = 'audio'; } // ID3
                else if (str.startsWith('T2dnUw')) { mediaSrc = `data:audio/ogg;base64,${str}`; mediaType = 'audio'; } // OggS
                else if (str.startsWith('JVBERi0xLjQ=')) { mediaSrc = `data:application/pdf;base64,${str}`; mediaType = 'pdf'; } // %PDF-1.4
            }

            if (mediaSrc) {
                imagePreviewContainer.innerHTML = '';

                let element;
                if (mediaType === 'image') {
                    element = document.createElement('img');
                    element.style.cssText = "max-width: 100%; max-height: 300px; height: auto; border-radius: 4px;";
                } else if (mediaType === 'audio') {
                    element = document.createElement('audio');
                    element.controls = true;
                    element.style.cssText = "width: 100%; margin-top: 10px;";
                } else if (mediaType === 'video') {
                    element = document.createElement('video');
                    element.controls = true;
                    element.style.cssText = "max-width: 100%; max-height: 300px; height: auto; border-radius: 4px;";
                } else if (mediaType === 'pdf') {
                    element = document.createElement('embed');
                    element.type = 'application/pdf';
                    element.style.cssText = "width: 100%; height: 500px; border: 1px solid var(--border);";
                }

                element.src = mediaSrc;
                element.id = 'imagePreview'; // tests/test-base64-converter.js looks for it by this id

                const label = document.createElement('p');
                label.style.cssText = "font-size: 0.8rem; color: var(--ink-secondary); margin-top: 0.5rem; margin-bottom: 0;";
                label.innerText = `Preview (looks like ${mediaType === 'pdf' ? 'a PDF' : mediaType})`;

                imagePreviewContainer.appendChild(element);
                imagePreviewContainer.appendChild(label);

                imagePreviewContainer.classList.remove('hidden');
                resultBox.classList.remove('hidden');
            } else {
                imagePreviewContainer.classList.add('hidden');
                imagePreviewContainer.innerHTML = '';
            }
        }

        encodeBtn.addEventListener('click', () => {
            const t = (window.LL_I18N && window.LL_I18N.t)
                ? window.LL_I18N.t : ((en) => en);
            const input = textInput.value.trim();
            if (!input) {
                showToast(t('Nothing to encode', 'Nichts zu kodieren'), 'error');
                return;
            }
            try {
                const result = utf8_to_b64(input);
                showResult(result);
                showToast(t('Encoded', 'Kodiert'), 'success');
            } catch (err) {
                /* Clear any stale result so a user does not read the old
                   output as if it were the new one. */
                resultBox.classList.add('hidden');
                showToast(t('Could not encode this text',
                            'Konnte diesen Text nicht kodieren'), 'error');
            }
        });

        decodeBtn.addEventListener('click', () => {
            const t = (window.LL_I18N && window.LL_I18N.t)
                ? window.LL_I18N.t : ((en) => en);
            const input = textInput.value.trim();
            if (!input) {
                showToast(t('Nothing to decode', 'Nichts zu dekodieren'), 'error');
                return;
            }
            try {
                const result = b64_to_utf8(input);
                showResult(result);
                showToast(t('Decoded', 'Dekodiert'), 'success');
            } catch (err) {
                /* Clear the stale result on failure — otherwise the old
                   decoded text sits under the error toast and reads like
                   the answer to the new input. */
                resultBox.classList.add('hidden');
                showToast(t('Not valid Base64, or not text once decoded',
                            'Kein gültiges Base64, oder nach dem Dekodieren kein Text'), 'error');
            }
        });

        clearTextBtn.addEventListener('click', () => {
            textInput.value = '';
            resultBox.classList.add('hidden');
            imagePreviewContainer.classList.add('hidden');
            imagePreviewContainer.innerHTML = '';
            textInput.focus();
        });

        let currentWorker = null;
        let fileChunks = []; // kept whole for Copy; the textarea only shows the first megabyte
        const progressContainer = document.getElementById('progressContainer');
        const progressText = document.getElementById('progressText');
        
        setupDropZone(dropZone, fileInput, (files) => {
            if (files.length === 0) return;
            
            const file = files[0];
            
            updateFileList(file);
            
            if (currentWorker) {
                currentWorker.terminate();
            }
            fileChunks = [];
            outputArea.value = '';
            resultBox.classList.add('hidden');
            imagePreviewContainer.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            progressText.innerText = 'Encoding… 0 MB';

            currentWorker = new Worker('./worker.js');

            let totalBytesProcessed = 0;

            let prefix = '';
            if (file.type) {
                prefix = `data:${file.type};base64,`;
                fileChunks.push(prefix);
            }
            
            currentWorker.onmessage = function(e) {
                const msg = e.data;
                if (msg.type === 'chunk') {
                    fileChunks.push(msg.chunk);
                    totalBytesProcessed += (msg.chunk.length / 4) * 3; // back from Base64 length to bytes
                    progressText.innerText = `Encoding… ${(totalBytesProcessed / (1024 * 1024)).toFixed(1)} MB`;
                } else if (msg.type === 'done') {
                    progressContainer.classList.add('hidden');
                    showToast('File converted to Base64', 'success');

                    // Putting hundreds of megabytes into a textarea hangs the tab, so
                    // it gets the first megabyte.
                    let previewString = '';
                    let totalSize = 0;
                    for(let i = 0; i < fileChunks.length; i++) {
                        previewString += fileChunks[i];
                        if (previewString.length > 1024 * 1024) {
                            previewString = previewString.substring(0, 1024 * 1024) + '\n\n[Only the first megabyte is shown. Copy Result copies all of it.]';
                            break;
                        }
                    }
                    showResult(previewString);

                    // The type is recognised from the prefix and the first chunk
                    if (prefix && fileChunks.length > 1) {
                        detectAndPreviewMedia(prefix + fileChunks[1]);
                    } else if (fileChunks.length > 0) {
                        detectAndPreviewMedia(fileChunks[0]);
                    }

                } else if (msg.type === 'error') {
                    progressContainer.classList.add('hidden');
                    showToast('Could not read the file: ' + msg.error, 'error');
                }
            };
            
            currentWorker.postMessage({ file });
        });

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function updateFileList(file) {
            fileList.innerHTML = ''; // one file at a time
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <div class="file-info">
                    <div class="file-name">${escapeHtml(file.name)}</div>
                    <div class="file-size">${formatFileSize(file.size)}</div>
                </div>
                <button class="remove-file" onclick="clearImageSelection()">&times;</button>
            `;
            fileList.appendChild(li);
        }

        // global for the onclick on the remove button
        window.clearImageSelection = function() {
            if (currentWorker) {
                currentWorker.terminate();
                currentWorker = null;
            }
            fileChunks = [];
            fileList.innerHTML = '';
            fileInput.value = '';
            progressContainer.classList.add('hidden');
            resultBox.classList.add('hidden');
            imagePreviewContainer.classList.add('hidden');
            imagePreviewContainer.innerHTML = '';
        };

        function showResult(content) {
            outputArea.value = content;
            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        window.copyResult = async function() {
            if (fileChunks.length > 0 && currentMode === 'image') {
                try {
                    // Copied as a Blob because joining the chunks into one string
                    // can exceed the engine's maximum string length.
                    const blob = new Blob(fileChunks, { type: 'text/plain' });
                    const item = new ClipboardItem({ 'text/plain': blob });
                    await navigator.clipboard.write([item]);
                    showToast('Copied to clipboard', 'success');
                } catch (err) {
                    showToast('Could not copy. The file may be too large for the clipboard.', 'error');
                }
            } else {
                const content = outputArea.value;
                if (!content) return;
                copyToClipboard(content);
            }
        }
    
    /* Is this tool holding something right now that a reload would throw
       away? The question is asked when someone clicks "Reload" in the
       update notice (assets/js/layout.js). A tool that stays quiet counts
       as empty. tests/test-holds-work.js insists that every tool with a
       file input speaks up. */
    window.llHoldsWork = () => fileChunks.length > 0 || textInput.value.trim() !== '';
    </script>
</body>
</html>
