name: Sperrmüll-Termine

# Bonn publishes the bulky-waste schedule once a year, as a new file, usually
# in December for the year after. This looks every Monday whether this year's
# or next year's schedule is new or was revised, and if so rebuilds the map's
# data and puts it on main. The map then shows both years, so it keeps going
# past December without anyone having to remember.
#
# Visitors are not asked about it: the update note gets a "-", which tells
# the site's worker that this change is not worth a prompt.
#
# A push made with GITHUB_TOKEN starts no other workflow, so this starts the
# tests itself, and the deploy follows them as it does after any push.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sperrmuell-termine
  cancel-in-progress: false

jobs:
  termine:
    name: Fetch collection dates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/sperrmuell/package-lock.json

      - name: Fetch schedules from opendata.bonn.de
        id: fetch
        working-directory: src/sperrmuell
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npm ci
          npm run schedules
          if git status --porcelain -- etl/termine | grep -q .; then
            git status --short -- etl/termine
            echo "new=1" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new."
          fi

      # Street geometry comes fresh from OpenStreetMap. The build fails on its
      # own if too few streets match, and then nothing is committed.
      - name: Build the data
        if: steps.fetch.outputs.new == '1'
        working-directory: src/sperrmuell
        timeout-minutes: 40
        run: |
          set -euo pipefail
          npm run data
          npm test

      - name: Push to main and trigger the tests
        if: steps.fetch.outputs.new == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "-" >> assets/update-note.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sperrmuell/etl/termine tools/sperrmuell/data assets/update-note.txt
          git commit -m "chore(sperrmuell): new collection dates from bonnorange"
          for attempt in 1 2 3; do
            git push origin HEAD:main && break
            [ "$attempt" = 3 ] && exit 1
            git pull --rebase origin main
          done
          gh workflow run ci.yml --ref main
