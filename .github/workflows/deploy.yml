name: Deploy to All-Inkl

# Hangs off the test run, not off the push.
#
# Both workflows used to listen to `push: main` and started in the same
# second — 11:05:16 on 6 September 2026, deploy done after 3m13s, tests after
# 1m23s. A red test run therefore stopped nothing: the broken code was on
# linu.li before anyone knew it was broken.
on:
  workflow_run:
    workflows: ["CI Tests"]
    types: [completed]
    branches: [main]
  # The hand lever. With the push trigger gone, a mistake in the wiring above
  # would leave no way to deploy at all — this is the way back, and the way to
  # push something out while a test is being fixed.
  workflow_dispatch:

# One deploy at a time. Two pushes in quick succession used to open two LFTP
# sessions against the same account, both mirroring with --delete; whichever
# finished last won, file by file. Not cancel-in-progress: an upload cut off
# halfway leaves the website halfway.
concurrency:
  group: deploy-to-all-inkl
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Read every line of this before touching it.
    #
    # A workflow_run job runs in this repository, with this repository's
    # secrets — the FTP password among them. And "CI Tests" runs on
    # `pull_request` as well as on push, which includes pull requests opened
    # from a fork of this public repository. The `branches: [main]` filter
    # above does not help: it matches workflow_run.head_branch, and that is
    # the branch name *inside the fork*, so anyone who pushes to the default
    # branch of their own fork and opens a pull request satisfies it.
    #
    # Without the two conditions below, a stranger's commit would be checked
    # out by head_sha and mirrored onto linu.li. This is the well-known
    # workflow_run trap and it costs two lines to close:
    #
    #   event == 'push'                    — not a pull request
    #   head_repository == this repository — not a fork
    #
    # A hand-started run carries no test result, and starting one already
    # requires write access to this repository.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
      # `ref` is not optional here. A workflow_run job checks out the head of
      # the default branch by default, which is whatever was pushed last —
      # not necessarily the commit that just passed. Without this the deploy
      # could ship a commit no test ever saw.
      - name: Get the code that passed
        uses: actions/checkout@v4
        with:
          # Empty on a hand-started run, and then checkout takes the branch
          # the run was started from — which is what you want by hand.
          ref: ${{ github.event.workflow_run.head_sha }}
          # The whole history, not the one commit checkout fetches by default.
          # The note check below has to resolve the commit the live site is
          # running and diff against it; on a shallow clone that commit is not
          # in the history at all.
          fetch-depth: 0

      # The worker's cache name carries the deployed commit, and that is the
      # only thing in sw.js that moves between deploys. Without it the file is
      # byte-identical after a change to a tool, the browser sees no new
      # worker, and the old cache keeps answering.
      #
      # The grep is the point of the step as much as the sed: if the
      # placeholder is ever renamed or dropped, this stops the deploy instead
      # of quietly shipping a worker that never changes again.
      - name: 🔖 Write the deployed commit into the worker
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)

          # Each of these three has a silent failure behind it, and all three
          # end the same way: a cache name that never changes again, which is
          # precisely the bug this step exists to prevent.
          #
          # An empty SHA is the nastiest of them — `sed` would happily write
          # `ll-toolbox-` and the deploy would go green. Found by running this
          # step by hand outside a git checkout.
          [ -n "$SHA" ] || { echo "::error::no commit hash — sw.js would be stamped blank"; exit 1; }
          grep -q '__DEPLOY_SHA__' sw.js \
            || { echo "::error::sw.js carries no __DEPLOY_SHA__ placeholder any more"; exit 1; }

          sed -i "s/__DEPLOY_SHA__/$SHA/g" sw.js

          ! grep -q '__DEPLOY_SHA__' sw.js \
            || { echo "::error::the placeholder survived the sed"; exit 1; }
          grep -n 'CACHE_NAME' sw.js

      # What changed for the people who already visited, in one sentence.
      #
      # A returning visitor is told there is a new version and asked whether
      # to take it. "There is a new version" on its own gets dismissed, so
      # every push that changes something the site serves has to say what.
      # The rule has two halves and both must agree before anyone is asked:
      #
      #   the files say whether to ask   — nothing served changed, nobody is
      #                                    disturbed, and no line is required
      #   the line says what to say      — written by hand, in the language
      #                                    the visitor reads
      #
      # A line reading "-" means: this one changed something, and it is not
      # worth a prompt. That is a deliberate sentence, not a default, which is
      # the whole reason the file is appended to rather than overwritten —
      # two silent pushes in a row are two "-" lines, so the file changes both
      # times and the check below still bites.
      - name: 📝 What to tell people who were here before
        run: |
          set -euo pipefail
          NOTIZ=assets/update-note.txt

          # What is on the website right now, straight from the worker it is
          # serving. Nothing else knows it: the repository has no record of
          # which commit is live.
          #
          # And it fails rather than waving through. A network error, a 404 and
          # a live commit this clone does not know all used to look the same as
          # "first run", and then the deploy went out without the check that
          # sits right here. A check that quietly disappears when something goes
          # wrong is not a check.
          WORKER=""
          for versuch in 1 2 3; do
            WORKER=$(curl -sS --fail --max-time 20 \
                     "https://linu.li/sw.js?deploy=$GITHUB_RUN_ID.$versuch" || true)
            [ -n "$WORKER" ] && break
            sleep 5
          done
          [ -n "$WORKER" ] || {
            echo "::error::could not read https://linu.li/sw.js after three tries."
            echo "Without it there is no way to tell what is live, and the note check"
            echo "below would pass by doing nothing. Re-run once the site answers again."
            exit 1
          }
          LIVE=$(printf '%s' "$WORKER" | sed -n "s/^const DEPLOY_SHA = '\(.*\)';$/\1/p")

          if [ -z "$LIVE" ]; then
            echo "::notice::the live worker carries no DEPLOY_SHA — it predates this mechanism, nothing to compare against"
            exit 0
          fi

          git cat-file -e "$LIVE^{commit}" 2>/dev/null || {
            echo "::error::the live site runs commit $LIVE, which is not in this history."
            echo "Someone force-pushed, or the checkout is incomplete. Deploying now would"
            echo "skip the note check silently, so it stops here instead."
            exit 1
          }

          # Only what the website actually hands out. A change to tests or to
          # the CI workflow reaches no browser and needs no sentence.
          GEAENDERT=$(git diff --name-only "$LIVE" HEAD -- . \
            ':(exclude)tests' ':(exclude).tests' ':(exclude).github' \
            ':(exclude)thisshouldbegitignored' ':(exclude)README.md' \
            ':(exclude)package.json' ':(exclude)package-lock.json' \
            ':(exclude).gitignore' ':(exclude)start_server.js' \
            ':(exclude)test*.js' ':(exclude)test*.py' \
            ':(exclude)assets/update-note.txt' \
            ':(exclude)CONTRIBUTING.md' ':(exclude)SECURITY.md' \
            ':(exclude)CODE_OF_CONDUCT.md' || true)

          if [ -z "$GEAENDERT" ]; then
            echo "::notice::nothing the website serves has changed since $LIVE — no note needed, no prompt"
            exit 0
          fi

          echo "Geändert seit $LIVE:"; echo "$GEAENDERT" | sed 's/^/  /'

          git diff --name-only "$LIVE" HEAD -- "$NOTIZ" | grep -q . || {
            echo "::error::$NOTIZ carries no new line, but these files changed since the live version:"
            echo "$GEAENDERT" | sed 's/^/  /'
            echo "Add one line saying what changed for a visitor, or a single - if this one does not deserve a prompt."
            exit 1
          }

      # The sentences travel inside the worker, next to the commit — one file,
      # one cache rule, one step. A version.json of its own would need its own
      # exception in .htaccess, and that is the exception somebody forgets.
      - name: 🗒️ Carry the sentences into the worker
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, pathlib

          notiz = pathlib.Path("assets/update-note.txt")
          zeilen = []
          if notiz.exists():
              for zeile in notiz.read_text(encoding="utf-8").splitlines():
                  text = zeile.strip()
                  # Kommentare und das ausdrückliche "kein Hinweis" fallen raus,
                  # zählen aber auch nicht mit: die Seite vergleicht Anzahlen.
                  if text and not text.startswith("#") and text != "-":
                      zeilen.append(text)

          worker = pathlib.Path("sw.js")
          text = worker.read_text(encoding="utf-8")
          marke = "[/* __DEPLOY_NOTES__ */]"
          if marke not in text:
              raise SystemExit("::error::sw.js carries no __DEPLOY_NOTES__ marker any more")
          eingesetzt = json.dumps(zeilen, ensure_ascii=False)
          worker.write_text(text.replace(marke, eingesetzt, 1), encoding="utf-8")
          print(f"{len(zeilen)} Zeilen in den Worker geschrieben")
          PYTHON
          node --check sw.js || { echo "::error::sw.js no longer parses after the notes were written in"; exit 1; }
          grep -c 'DEPLOY_NOTES' sw.js

      # The mirror below copies whatever is left in the working directory, so
      # anything the site does not need is deleted here first. Done in plain
      # shell rather than as lftp exclude patterns: what this removes can be
      # read off the run log, and a mistake shows up here instead of on the
      # web server.
      - name: 🧹 Drop everything the website does not serve
        run: |
          rm -rf tests .tests test-results .jules .Jules
          rm -f test.js test_*.js test-*.js test*.py test*.html test*.png
          rm -f package.json package-lock.json README.md .gitignore start_server.js
          rm -f assets/update-note.txt
          rm -f CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md
          find tools -type f \( \
            -name 'test.js' -o -name 'test_*.js' -o -name 'test-*.js' \
            -o -name '*.test.js' -o -name '*.spec.js' -o -name 'test-worker.html' \
            \) -delete
          echo "Was hochgeladen wird:"
          find . -path ./.git -prune -o -path ./.github -prune -o -type f -print | sort

      # --delete makes the server match this directory: a file removed from
      # the repository disappears from the website too. Without it the server
      # only ever grew, and files nobody had committed in months were still
      # being served.
      #
      # The excluded paths are the ones this repository does not own:
      # .well-known/ carries the ACME challenge the TLS certificate renews
      # through (and security.txt), .ftpquota belongs to the host, cgi-bin/
      # is created by the hosting panel. Deleting those would break things
      # nobody would connect to a deploy.
      - name: 📂 Sync files via LFTP
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -c "set ftp:ssl-allow yes; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }}; mirror -R -v --delete --parallel=2 --exclude .git/ --exclude .github/ --exclude .well-known/ --exclude cgi-bin/ --exclude .ftpquota ./ ./"
