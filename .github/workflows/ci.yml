name: CI Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Started by sperrmuell-termine.yml after it put new collection dates on
  # main: its push, made with GITHUB_TOKEN, starts nothing by itself.
  workflow_dispatch:

jobs:
  # ─── Node.js / jsdom tests (no browser needed) ───────────────────────────
  node-tests:
    name: Node.js Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            src/sperrmuell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the Sperrmüll map
        # tools/sperrmuell/ holds only the map's data in git; the page, its
        # bundle, its worker and .htaccess rules are built from src/sperrmuell,
        # and several tests read them.
        run: |
          cd src/sperrmuell
          npm ci
          npm test
          npm run build
          npm run publish:site

      - name: Run jsdom-based tests
        run: |
          PASS=0; FAIL=0; ERRORS=""

          run_test() {
            local file="$1"
            if node "$file"; then
              echo "[PASS] $file"
              PASS=$((PASS + 1))
            else
              echo "[FAIL] $file"
              FAIL=$((FAIL + 1))
              ERRORS="$ERRORS\n  - $file"
            fi
          }

          # Every test lives in tests/. The ones listed below need a real
          # browser and a server, so they run in the puppeteer job instead.
          for f in tests/test-*.js; do
            [ -f "$f" ] || continue
            case "$f" in
              tests/test-hash-generator.js)
                echo "[SKIP] $f (needs the Web Worker API, which jsdom has not got)"; continue ;;
              tests/test-pdf-watermarker.js|\
              tests/test-diff-checker-xss.js|\
              tests/test-exif-map-marker.js|\
              tests/test-exif-scrubber-regressions.js|\
              tests/test-number-spinners.js|\
              tests/test-unit-converter-layout.js|\
              tests/test-unit-converter-regressions.js|\
              tests/test-service-worker.js|\
              tests/test-freshness-passthrough.js|\
              tests/test-two-workers.js|\
              tests/test-autosave-behaviour.js|\
              tests/test-update-notice.js|\
              tests/test-holds-work.js|\
              tests/test-page-metadata.js|\
              tests/test-json-tools-browser.js|\
              tests/test-json-tools-stale-tree.js|\
              tests/test-diff-checker-invalid-json.js|\
              tests/test-pdf-compressor-browser.js|\
              tests/test-timestamp-button.js|\
              tests/test-archive-notice.js|\
              tests/test-sprache.js|\
              tests/test-buehnenbild-zoom.js|\
              tests/test-buehnenbild-drucken.js|\
              tests/test-sperrmuell-karte.js)
                echo "[SKIP] $f (Puppeteer — runs in puppeteer job)"; continue ;;
            esac
            run_test "$f"
          done

          # Per-tool jsdom tests, which sit next to the tool they cover
          for f in \
            tools/aspect-ratio/aspect-ratio.test.js \
            tools/image-resizer/test.js \
            tools/list-cleaner/test.js \
            tools/markdown-editor/test.js \
            tools/pdf-extractor/test.js \
            tools/pdf-splitter/test.js \
            tools/pdf-watermarker/test.js \
            tools/time-converter/test.js \
            tools/url-tools/test.js \
            tools/color-tools/test_color_contrast.js \
            tools/unit-converter/test_regression.js; do
            [ -f "$f" ] && run_test "$f"
          done

          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo -e "Failed tests:$ERRORS"
            exit 1
          fi

  # ─── Puppeteer tests (need a local HTTP server) ───────────────────────────
  puppeteer-tests:
    name: Puppeteer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            src/sperrmuell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install ImageMagick
        # update first: the runner image ships a package index from the day it
        # was built, and once Ubuntu replaces a package (ghostscript, on 28
        # September 2026) the old file name is a 404 and the job dies here,
        # before a single test has run.
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build the Sperrmüll map
        # tools/sperrmuell/ holds only the map's data in git; the page, its
        # bundle, its worker and .htaccess rules are built from src/sperrmuell,
        # and several tests read them.
        run: |
          cd src/sperrmuell
          npm ci
          npm run build
          npm run publish:site

      - name: Patch puppeteer.launch for CI sandbox
        # GitHub Actions runners don't support Chrome's sandbox.
        # This preload script monkey-patches puppeteer.launch() to always
        # inject --no-sandbox without touching any test file.
        run: |
          cat > ci-puppeteer-preload.js << 'EOF'
          const puppeteer = require('puppeteer');
          const origLaunch = puppeteer.launch.bind(puppeteer);
          puppeteer.launch = function(opts = {}) {
            const args = opts.args || [];
            if (!args.includes('--no-sandbox')) args.push('--no-sandbox');
            if (!args.includes('--disable-setuid-sandbox')) args.push('--disable-setuid-sandbox');
            return origLaunch({ ...opts, args });
          };
          EOF

      - name: Start local server
        run: npx serve . --listen 3000 &

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run Puppeteer tests
        run: |
          PASS=0; FAIL=0; ERRORS=""

          run_test() {
            local file="$1"
            if node --require ./ci-puppeteer-preload.js "$file"; then
              echo "[PASS] $file"
              PASS=$((PASS + 1))
            else
              echo "[FAIL] $file"
              FAIL=$((FAIL + 1))
              ERRORS="$ERRORS\n  - $file"
            fi
          }

          run_test "tests/test-json-tools-browser.js"
          run_test "tests/test-json-tools-stale-tree.js"
          run_test "tests/test-diff-checker-invalid-json.js"
          run_test "tests/test-pdf-compressor-browser.js"
          run_test "tests/test-timestamp-button.js"
          run_test "tests/test-pdf-watermarker.js"
          run_test "tools/social-cropper/social-cropper.spec.js"
          run_test "tests/test-diff-checker-xss.js"
          run_test "tests/test-exif-map-marker.js"
          run_test "tests/test-exif-scrubber-regressions.js"
          run_test "tests/test-number-spinners.js"
          run_test "tests/test-unit-converter-layout.js"
          run_test "tests/test-unit-converter-regressions.js"
          run_test "tests/test-service-worker.js"
          run_test "tests/test-freshness-passthrough.js"
          run_test "tests/test-two-workers.js"
          run_test "tests/test-autosave-behaviour.js"
          run_test "tests/test-update-notice.js"
          run_test "tests/test-holds-work.js"
          run_test "tests/test-page-metadata.js"
          run_test "tests/test-archive-notice.js"
          run_test "tests/test-sprache.js"
          run_test "tests/test-buehnenbild-zoom.js"
          run_test "tests/test-buehnenbild-drucken.js"
          run_test "tests/test-sperrmuell-karte.js"

          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo -e "Failed tests:$ERRORS"
            exit 1
          fi

  # ─── Playwright Python tests (need a local HTTP server) ───────────────────
  playwright-tests:
    name: Playwright Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright + browsers
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Start local server
        run: |
          python3 -m http.server 8000 &
          echo $! > /tmp/server.pid

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -s http://127.0.0.1:8000/ > /dev/null && break
            sleep 1
          done

      - name: Run Playwright tests
        run: |
          PASS=0; FAIL=0; ERRORS=""

          run_test() {
            local file="$1"
            if python3 "$file"; then
              echo "[PASS] $file"
              PASS=$((PASS + 1))
            else
              echo "[FAIL] $file"
              FAIL=$((FAIL + 1))
              ERRORS="$ERRORS\n  - $file"
            fi
          }

          run_test "tests/test_ui.py"
          run_test "tests/test_favicon.py"

          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo -e "Failed tests:$ERRORS"
            exit 1
          fi

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/server.pid) 2>/dev/null || true
