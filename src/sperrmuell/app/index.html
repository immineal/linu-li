<!doctype html>
<html lang="de" data-lang-lock="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1918" />
    <meta
      name="description"
      content="Sperrmüll-Abholtermine in Bonn: Straßen und Abholzonen nach Datum, mit Adresssuche."
    />
    <title>Bonn Sperrmüll-Karte</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      // Before the first paint, so the page does not flash light first.
      // Same rule as the rest of linu.li: dark, unless light was chosen there.
      try {
        if (localStorage.getItem("theme") === "light") document.documentElement.classList.add("light");
      } catch (err) {
        /* storage blocked: dark */
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>

      <header id="app-header">
        <div id="app-title">
          <a href="/" class="home-link">linu.li</a>
          <h1>Sperrmüll Bonn</h1>
        </div>
        <div id="app-actions">
          <button id="theme-toggle" class="theme-switch" type="button" aria-label="Zwischen hell und dunkel wechseln">
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </button>
          <button id="layers-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="layers-panel">
            Karte
          </button>
        </div>
      </header>

      <div id="layers-panel" role="menu" aria-label="Kartenebenen" hidden>
        <label><input type="checkbox" id="layer-routes" /> Abholzonen</label>
        <label><input type="checkbox" id="layer-ortsteile" /> Ortsteile</label>
      </div>

      <div id="search-bar">
        <form id="search-form" role="search">
          <label for="search-input" class="visually-hidden">Adresse suchen (Straße Hausnummer)</label>
          <input
            id="search-input"
            name="address"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="Straße und Hausnummer, z. B. Trierer Str. 130"
          />
          <button type="submit">Suchen</button>
        </form>
        <div id="search-result" role="status" aria-live="polite"></div>
      </div>

      <div id="date-scrubber">
        <button id="date-prev" type="button" aria-label="Vorheriger Termin" disabled>‹</button>
        <div id="date-display" aria-live="polite">
          <span id="date-label">Lade…</span>
          <span id="date-relative"></span>
        </div>
        <button id="date-next" type="button" aria-label="Nächster Termin" disabled>›</button>
      </div>

      <div id="bottom-sheet" role="region" aria-label="Details">
        <div
          id="bottom-sheet-handle"
          role="button"
          tabindex="0"
          aria-expanded="false"
          aria-controls="bottom-sheet-content"
          aria-label="Details ein- oder ausblenden"
        ></div>
        <div id="bottom-sheet-content"></div>
      </div>

      <div id="status-banner" role="alert" hidden></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
